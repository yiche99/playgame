<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>风狂一笔画</title>
<style>
  :root {
    --bg: #0a0a12;
    --panel: #12121f;
    --gold: #d4a853;
    --gold-light: #f0d78c;
    --text: #c8c8d4;
    --text-light: #e8e8f0;
    --red: #c0392b;
    --green: #27ae60;
    --blue-magic: #5b7fef;
    --purple: #7c3aed;
    --cyan: #22d3ee;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'STSong','SimSun','Songti SC','Microsoft YaHei',serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    cursor: default;
    user-select: none;
  }
  #particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  #app { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
  .game-title { font-size: 3.2rem; font-weight: 900; background: linear-gradient(135deg, #f0d78c, #d4a853, #b8860b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin: 20px 0 5px; text-align: center; animation: titleGlow 2s ease-in-out infinite alternate; }
  @keyframes titleGlow { 0% { filter: drop-shadow(0 0 8px rgba(212,168,83,0.3)); } 100% { filter: drop-shadow(0 0 20px rgba(240,215,140,0.6)); } }
  .game-subtitle { font-size: 1.1rem; color: var(--gold); letter-spacing: 6px; margin-bottom: 30px; }
  .panel { background: var(--panel); border: 1px solid rgba(212,168,83,0.2); border-radius: 16px; padding: 30px; width: 100%; box-shadow: 0 8px 32px rgba(0,0,0,0.4); margin-bottom: 20px; }
  .btn { font-family: inherit; padding: 12px 32px; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: all 0.3s; letter-spacing: 2px; position: relative; overflow: hidden; }
  .btn:active { transform: scale(0.96); }
  .btn-gold { background: linear-gradient(135deg, #d4a853, #b8860b); color: #1a1a2e; font-weight: 700; box-shadow: 0 4px 15px rgba(212,168,83,0.3); }
  .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(212,168,83,0.5); }
  .btn-magic { background: linear-gradient(135deg, #5b7fef, #7c3aed); color: #fff; font-weight: 700; box-shadow: 0 4px 15px rgba(91,127,239,0.3); }
  .btn-magic:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(91,127,239,0.5); }
  .btn-danger { background: linear-gradient(135deg, #c0392b, #e74c3c); color: #fff; font-weight: 700; }
  .btn-danger:hover { transform: translateY(-2px); }
  .btn-sm { padding: 8px 20px; font-size: 0.85rem; letter-spacing: 1px; }

  .layer-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; width: 100%; }
  @media (max-width: 700px) { .layer-grid { grid-template-columns: repeat(2, 1fr); } }
  .layer-card { background: linear-gradient(135deg, rgba(20,20,40,0.9), rgba(30,30,60,0.9)); border: 2px solid rgba(212,168,83,0.15); border-radius: 16px; padding: 20px 12px; text-align: center; cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden; }
  .layer-card:hover { border-color: var(--gold); transform: translateY(-4px); box-shadow: 0 8px 30px rgba(212,168,83,0.2); }
  .layer-card.locked { opacity: 0.4; cursor: not-allowed; filter: grayscale(60%); }
  .layer-card.locked:hover { border-color: rgba(212,168,83,0.15); transform: none; box-shadow: none; }
  .layer-card.completed { border-color: var(--green) !important; }
  .layer-card .layer-num { font-size: 2.5rem; font-weight: 900; background: linear-gradient(135deg, #f0d78c, #b8860b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .layer-card.completed .layer-num { background: linear-gradient(135deg, #27ae60, #2ecc71); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .layer-card .layer-name { font-size: 0.9rem; color: var(--text); margin-top: 4px; letter-spacing: 2px; }
  .layer-card .layer-icon { font-size: 2rem; margin-bottom: 4px; }
  .layer-card .complete-badge { position: absolute; top: 8px; right: 8px; color: var(--green); font-size: 1.2rem; }

  .level-select { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin: 20px 0; }
  .level-btn { width: 110px; height: 110px; border-radius: 16px; border: 2px solid rgba(212,168,83,0.2); background: rgba(20,20,40,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; color: var(--text); }
  .level-btn:hover { border-color: var(--gold); box-shadow: 0 4px 20px rgba(212,168,83,0.2); transform: translateY(-2px); }
  .level-btn.completed { border-color: var(--green); }
  .level-btn.locked { opacity: 0.4; cursor: not-allowed; }
  .level-btn .lvl-type { font-size: 0.65rem; color: var(--cyan); letter-spacing: 1px; margin-top: 2px; }
  .level-btn .lvl-num { font-size: 1.5rem; font-weight: 900; }
  .level-btn .lvl-name { font-size: 0.7rem; letter-spacing: 1px; }
  .level-btn.puzzle-type { border-color: rgba(91,127,239,0.3); }
  .level-btn.puzzle-type:hover { border-color: var(--blue-magic); }

  .story-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.5s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .story-box { background: var(--panel); border: 2px solid var(--gold); border-radius: 20px; padding: 40px; max-width: 550px; width: 90%; text-align: center; box-shadow: 0 0 60px rgba(212,168,83,0.2); animation: slideUp 0.5s; }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .story-box .story-icon { font-size: 3rem; margin-bottom: 10px; }
  .story-box .story-title { font-size: 1.6rem; color: var(--gold-light); margin-bottom: 16px; letter-spacing: 3px; }
  .story-box .story-text { font-size: 1rem; line-height: 2; color: var(--text-light); margin-bottom: 24px; text-align: left; text-indent: 2em; }
  .story-box .story-speaker { font-size: 0.85rem; color: var(--gold); text-align: right; margin-bottom: 16px; }

  .game-canvas-wrap { position: relative; width: 100%; display: flex; justify-content: center; margin: 10px 0; }
  #gameCanvas { border-radius: 12px; background: rgba(10,10,20,0.6); border: 1px solid rgba(212,168,83,0.15); cursor: pointer; max-width: 100%; height: auto; }
  .game-info { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; width: 100%; }
  .hearts { color: #e74c3c; font-size: 1.3rem; letter-spacing: 4px; }
  .progress-dots { display: flex; gap: 6px; }
  .progress-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(212,168,83,0.3); }
  .progress-dot.done { background: var(--green); }
  .progress-dot.current { background: var(--gold); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.4); } }
  .path-hint { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; margin: 8px 0; }
  .path-step { background: rgba(212,168,83,0.15); border: 1px solid rgba(212,168,83,0.3); border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; color: var(--gold); }
  .path-step.active { background: var(--gold); color: #1a1a2e; }
  .path-arrow { color: var(--gold); }

  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; display: flex; align-items: center; justify-content: center; }
  .modal-box { background: var(--panel); border: 2px solid var(--gold); border-radius: 20px; padding: 36px; max-width: 450px; width: 90%; text-align: center; }
  .modal-box h3 { font-size: 1.5rem; color: var(--gold-light); margin-bottom: 16px; }
  .modal-box p { line-height: 1.8; margin-bottom: 20px; }

  .top-nav { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .back-btn { background: none; border: 1px solid rgba(212,168,83,0.3); color: var(--gold); padding: 6px 16px; border-radius: 20px; cursor: pointer; font-family: inherit; font-size: 0.85rem; transition: all 0.3s; }
  .back-btn:hover { background: rgba(212,168,83,0.1); }

  .victory-sparkle { position: fixed; pointer-events: none; z-index: 300; animation: sparkleBurst 1.2s ease-out forwards; font-size: 2rem; }
  @keyframes sparkleBurst { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }

  /* 通关动画层 */
  #clearAnimOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 250; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .clear-anim-container { text-align: center; }
  .clear-anim-title { font-size: 2rem; color: var(--gold-light); font-weight: 900; margin-bottom: 10px; opacity: 0; animation: clearTitleIn 0.8s ease-out 0.2s forwards; }
  @keyframes clearTitleIn { 0% { opacity: 0; transform: translateY(-30px) scale(0.8); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
  .clear-anim-name { font-size: 1.2rem; color: var(--cyan); opacity: 0; animation: clearTitleIn 0.8s ease-out 0.5s forwards; }
  .clear-anim-ring { width: 200px; height: 200px; border: 3px solid var(--gold); border-radius: 50%; margin: 20px auto; position: relative; opacity: 0; animation: clearRingIn 0.6s ease-out 0.3s forwards; }
  @keyframes clearRingIn { 0% { opacity: 0; transform: scale(0); } 60% { opacity: 1; transform: scale(1.1); } 100% { opacity: 1; transform: scale(1); } }
  .clear-anim-ring::before { content: ''; position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px; border: 1px solid rgba(240,215,140,0.4); border-radius: 50%; animation: ringPulse 1.5s ease-in-out 0.6s infinite; }
  .clear-anim-ring::after { content: ''; position: absolute; top: -20px; left: -20px; right: -20px; bottom: -20px; border: 1px solid rgba(240,215,140,0.2); border-radius: 50%; animation: ringPulse 1.5s ease-in-out 0.9s infinite; }
  @keyframes ringPulse { 0%,100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.05); opacity: 1; } }
  .clear-anim-seal { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 3rem; opacity: 0; animation: sealAppear 0.6s ease-out 0.8s forwards; }
  @keyframes sealAppear { 0% { opacity: 0; transform: translate(-50%,-50%) rotate(-180deg) scale(0); } 100% { opacity: 1; transform: translate(-50%,-50%) rotate(0deg) scale(1); } }

  /* 保存提示 */
  #saveIndicator { position: fixed; bottom: 20px; right: 20px; background: rgba(39,174,96,0.9); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; z-index: 400; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  #saveIndicator.show { opacity: 1; }
  
  /* 音效开关 */
  .sound-toggle { position: fixed; top: 20px; right: 20px; z-index: 50; background: rgba(18,18,31,0.8); border: 1px solid rgba(212,168,83,0.3); color: var(--gold); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
  .sound-toggle:hover { border-color: var(--gold); box-shadow: 0 0 15px rgba(212,168,83,0.3); }
  .sound-toggle.muted { opacity: 0.5; }

  /* 拼图游戏 */
  .puzzle-container { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .puzzle-grid { display: grid; gap: 4px; justify-content: center; }
  .puzzle-tile { aspect-ratio: 1; border-radius: 8px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700; }
  .puzzle-tile.empty { background: rgba(255,255,255,0.03); cursor: default; }
  .puzzle-tile:hover:not(.empty):not(.matched) { transform: scale(1.05); }

  /* 记忆翻牌 */
  .memory-card { aspect-ratio: 1; border-radius: 8px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; font-size: 2rem; perspective: 600px; }
  .memory-card .inner { width: 100%; height: 100%; transition: transform 0.4s; transform-style: preserve-3d; position: relative; }
  .memory-card.flipped .inner { transform: rotateY(180deg); }
  .memory-card .front, .memory-card .back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .memory-card .front { background: linear-gradient(135deg, #5b7fef, #7c3aed); color: #fff; font-size: 1.5rem; }
  .memory-card .back { background: linear-gradient(135deg, rgba(20,20,40,0.9), rgba(30,30,60,0.9)); border: 2px solid rgba(212,168,83,0.4); transform: rotateY(180deg); }
  .memory-card.matched { opacity: 0.5; cursor: default; pointer-events: none; }

  /* 颜色匹配 */
  .color-target { width: 80px; height: 80px; border-radius: 50%; margin: 10px auto; border: 3px solid rgba(255,255,255,0.2); }
  .color-slider-group { display: flex; gap: 10px; align-items: center; margin: 6px 0; }
  .color-slider-group label { width: 20px; color: var(--text); font-weight: 700; }
  .color-slider-group input[type="range"] { flex: 1; accent-color: var(--gold); }

  /* 迷宫 */
  .maze-cell { aspect-ratio: 1; border-radius: 2px; transition: all 0.1s; }
  .maze-cell.wall { background: rgba(91,127,239,0.4); }
  .maze-cell.path { background: rgba(212,168,83,0.3); }
  .maze-cell.start { background: var(--green); }
  .maze-cell.end { background: var(--gold); }
  .maze-cell.player { background: var(--cyan); animation: pulse 0.8s infinite; }

  /* 图案序列 */
  .sequence-display { display: flex; gap: 12px; justify-content: center; margin: 16px 0; }
  .sequence-item { font-size: 2.5rem; animation: seqPop 0.3s ease-out; }
  @keyframes seqPop { 0% { transform: scale(1.5); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }
  .pattern-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pattern-btn { padding: 16px; font-size: 2rem; border-radius: 12px; cursor: pointer; background: rgba(20,20,40,0.8); border: 2px solid rgba(212,168,83,0.2); transition: all 0.2s; }
  .pattern-btn:hover { border-color: var(--gold); background: rgba(212,168,83,0.1); }
  .pattern-btn.wrong { animation: shake 0.4s; border-color: #e74c3c; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  .hidden { display: none !important; }

  @media (max-width: 500px) {
    .game-title { font-size: 2rem; }
    .panel { padding: 16px; }
    .layer-card { padding: 14px 8px; }
    .layer-card .layer-num { font-size: 1.8rem; }
    .level-btn { width: 90px; height: 90px; }
    .story-box { padding: 24px; }
    .story-box .story-title { font-size: 1.2rem; }
    .btn { padding: 10px 20px; font-size: 0.85rem; }
    .clear-anim-ring { width: 140px; height: 140px; }
  }
</style>
</head>
<body>
<canvas id="particles"></canvas>
<button class="sound-toggle" id="soundToggle" title="音效开关">🔊</button>
<div id="saveIndicator">💾 已保存</div>
<div id="app"></div>
<div id="storyOverlay" class="story-overlay hidden"></div>
<div id="clearAnimOverlay"></div>
<div id="modalOverlay" class="modal-overlay hidden"><div class="modal-box" id="modalBox"></div></div>

<script>
// ============================================================
// 音效系统 (Web Audio API)
// ============================================================
const AudioFX = (() => {
  let ctx = null;
  let muted = false;
  
  function getCtx() {
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function play(freq, type, duration, vol = 0.15, ramp = true) {
    if (muted) return;
    const c = getCtx();
    if (!c) return;
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, c.currentTime);
    gain.gain.setValueAtTime(vol, c.currentTime);
    if (ramp) gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);
    else gain.gain.setValueAtTime(0, c.currentTime + duration);
    osc.connect(gain);
    gain.connect(c.destination);
    osc.start(c.currentTime);
    osc.stop(c.currentTime + duration);
  }

  function playMelody(notes) {
    if (muted) return;
    const c = getCtx();
    if (!c) return;
    let t = c.currentTime;
    notes.forEach(([freq, dur, vol = 0.12]) => {
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(gain);
      gain.connect(c.destination);
      osc.start(t);
      osc.stop(t + dur);
      t += dur;
    });
  }

  return {
    muted: () => muted,
    toggle() { muted = !muted; return muted; },
    init() { getCtx(); },
    click() { play(800, 'sine', 0.08, 0.1); },
    pathWalk(step) {
      const baseFreq = 300 + step * 50;
      play(baseFreq, 'sine', 0.12, 0.1);
      setTimeout(() => play(baseFreq * 1.5, 'sine', 0.08, 0.06), 60);
    },
    error() { play(150, 'square', 0.2, 0.08); },
    levelClear() {
      playMelody([
        [523, 0.1], [659, 0.1], [784, 0.1], [1047, 0.2],
        [784, 0.1], [1047, 0.3]
      ]);
    },
    layerClear() {
      playMelody([
        [523, 0.12], [659, 0.12], [784, 0.12], [1047, 0.15],
        [1319, 0.12], [1568, 0.15], [1047, 0.1], [1319, 0.1], [1568, 0.4]
      ]);
    },
    fail() {
      playMelody([
        [400, 0.15], [350, 0.15], [300, 0.2], [200, 0.3]
      ]);
    },
    storyOpen() { play(600, 'sine', 0.5, 0.06); },
    buttonHover() { play(1000, 'sine', 0.05, 0.04); },
    magicActivate() {
      playMelody([
        [440, 0.08], [554, 0.08], [659, 0.08], [880, 0.08],
        [1109, 0.08], [1319, 0.08], [1760, 0.2]
      ]);
    },
    puzzleClick() { play(600, 'sine', 0.1, 0.08); },
    puzzleMatch() { playMelody([[523, 0.1], [659, 0.1], [784, 0.15]]); },
    puzzleWrong() { play(200, 'triangle', 0.3, 0.08); }
  };
})();

// 音效按钮
const soundToggle = document.getElementById('soundToggle');
soundToggle.addEventListener('click', () => {
  AudioFX.init();
  const muted = AudioFX.toggle();
  soundToggle.textContent = muted ? '🔇' : '🔊';
  soundToggle.classList.toggle('muted', muted);
});

// ============================================================
// 保存指示器
// ============================================================
const saveIndicator = document.getElementById('saveIndicator');
let saveTimeout;
function showSaveIndicator() {
  saveIndicator.classList.add('show');
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => saveIndicator.classList.remove('show'), 1500);
}

// ============================================================
// 语音系统 (Web Speech API)
// ============================================================
const VoiceSystem = (() => {
  let enabled = true;
  let speaking = false;

  function speak(text, rate = 0.9) {
    if (!enabled || speaking || !window.speechSynthesis) return;
    try {
      speaking = true;
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'zh-CN';
      utter.rate = rate;
      utter.pitch = 1;
      utter.volume = 0.7;
      utter.onend = () => { speaking = false; };
      utter.onerror = () => { speaking = false; };
      speechSynthesis.speak(utter);
    } catch(e) { speaking = false; }
  }

  function stop() {
    if (window.speechSynthesis) {
      speechSynthesis.cancel();
      speaking = false;
    }
  }

  return {
    speak, stop,
    toggle() { enabled = !enabled; return enabled; },
    get enabled() { return enabled; }
  };
})();

// ============================================================
// 粒子背景
// ============================================================
(function() {
  const c = document.getElementById('particles');
  const ctx = c.getContext('2d');
  let pts = [];
  function rs() { c.width = window.innerWidth; c.height = window.innerHeight; }
  rs(); window.addEventListener('resize', rs);
  class P {
    constructor() { this.reset(); this.y = Math.random() * c.height; }
    reset() { this.x = Math.random() * c.width; this.y = -10; this.s = Math.random() * 2 + 0.5; this.sp = Math.random() * 0.4 + 0.1; this.op = Math.random() * 0.5 + 0.1; this.dft = Math.random() * 0.3 - 0.15; }
    up() { this.y += this.sp; this.x += this.dft; if (this.y > c.height + 10) this.reset(); if (this.x < -10) this.x = c.width + 10; if (this.x > c.width + 10) this.x = -10; }
    draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.s, 0, Math.PI * 2); ctx.fillStyle = `rgba(212,168,83,${this.op})`; ctx.fill(); }
  }
  for (let i = 0; i < 80; i++) pts.push(new P());
  (function anim() { ctx.clearRect(0, 0, c.width, c.height); pts.forEach(p => { p.up(); p.draw(); }); requestAnimationFrame(anim); })();
})();

// ============================================================
// 8个独特一笔画结构（使用Hierholzer算法生成，确保欧拉图）

      const emojis = ['⭐','🌙','🔥','💎','🍀','⚡','🦋','🌸'];
      const pairs = [...emojis, ...emojis];
      // Fisher-Yates shuffle
      for (let i = pairs.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
      }
      let flipped = [];
      let matched = 0;
      let locked = false;

      container.innerHTML = `
        <div class="puzzle-container">
          <p style="color:var(--cyan);">翻牌找到所有配对 · 无限尝试</p>

        </div>`;

      const grid = container.querySelector('#memGrid');
      pairs.forEach((emoji, idx) => {
        const card = document.createElement('div');
        card.className = 'memory-card';
        card.dataset.emoji = emoji;
        card.dataset.idx = idx;
        card.innerHTML = `<div class="inner"><div class="front">?</div><div class="back">${emoji}</div></div>`;
        card.addEventListener('click', () => {
          if (locked || card.classList.contains('flipped') || card.classList.contains('matched')) return;
          AudioFX.puzzleClick();
          card.classList.add('flipped');
          flipped.push(card);
          if (flipped.length === 2) {
            locked = true;
            if (flipped[0].dataset.emoji === flipped[1].dataset.emoji) {
              AudioFX.puzzleMatch();
              flipped.forEach(c => c.classList.add('matched'));
              matched += 2;
              flipped = [];
              locked = false;
              if (matched === pairs.length) {
                setTimeout(() => onComplete(), 400);
              }
            } else {
              AudioFX.puzzleWrong();
              setTimeout(() => {
                flipped.forEach(c => c.classList.remove('flipped'));
                flipped = [];
                locked = false;
              }, 600);
            }
          }
        });
        grid.appendChild(card);
      });
    }
  },

  // 类型2: 滑动拼图（无限尝试）
  slidingPuzzle: {
    name: '滑动拼图',
    icon: '🧩',
    init(container, onComplete, onFail) {
      // Create solvable 3x3 puzzle
      const tiles = [1,2,3,4,5,6,7,8,0]; // 0 = empty
      // Shuffle by making random moves from solved state (guarantees solvability)
      let emptyIdx = 8;
      for (let m = 0; m < 100; m++) {
        const moves = [];
        const row = Math.floor(emptyIdx / 3), col = emptyIdx % 3;
        if (row > 0) moves.push(emptyIdx - 3);
        if (row < 2) moves.push(emptyIdx + 3);
        if (col > 0) moves.push(emptyIdx - 1);
        if (col < 2) moves.push(emptyIdx + 1);
        const swap = moves[Math.floor(Math.random() * moves.length)];
        [tiles[emptyIdx], tiles[swap]] = [tiles[swap], tiles[emptyIdx]];
        emptyIdx = swap;
      }
      let moves = 0;

      container.innerHTML = `
        <div class="puzzle-container">
          <p style="color:var(--cyan);">将数字按顺序排列 · 已走 <span id="slideMoves">0</span> 步</p>
          <div class="puzzle-grid" style="grid-template-columns:repeat(3,70px);" id="slideGrid"></div>

        </div>`;

      const grid = container.querySelector('#slideGrid');
      function render() {
        grid.innerHTML = '';
        tiles.forEach((t, i) => {
          const tile = document.createElement('div');
          tile.className = 'puzzle-tile' + (t === 0 ? ' empty' : '');
          tile.style.background = t === 0 ? 'transparent' : 'linear-gradient(135deg, #5b7fef, #7c3aed)';
          tile.textContent = t === 0 ? '' : t;
          if (t !== 0) {
            tile.addEventListener('click', () => {
              const ei = tiles.indexOf(0);
              const row = Math.floor(ei / 3), col = ei % 3;
              const tiRow = Math.floor(i / 3), tiCol = i % 3;
              if (Math.abs(row - tiRow) + Math.abs(col - tiCol) === 1) {
                AudioFX.puzzleClick();
                [tiles[i], tiles[ei]] = [tiles[ei], tiles[i]];
                moves++;
                container.querySelector('#slideMoves').textContent = moves;
                render();
                if (tiles.join(',') === '1,2,3,4,5,6,7,8,0') {
                  setTimeout(() => onComplete(), 300);
                }
              }
            });
          }
          grid.appendChild(tile);
        });
      }
      render();
      
      document.getElementById('slideRetry').addEventListener('click', () => {
        AudioFX.puzzleClick();
        // Reshuffle
        let ei = tiles.indexOf(0);
        for (let m = 0; m < 100; m++) {
          const moves2 = [];
          const row = Math.floor(ei / 3), col = ei % 3;
          if (row > 0) moves2.push(ei - 3);
          if (row < 2) moves2.push(ei + 3);
          if (col > 0) moves2.push(ei - 1);
          if (col < 2) moves2.push(ei + 1);
          const swap = moves2[Math.floor(Math.random() * moves2.length)];
          [tiles[ei], tiles[swap]] = [tiles[swap], tiles[ei]];
          ei = swap;
        }
        moves = 0;
        container.querySelector('#slideMoves').textContent = '0';
        render();
      });
    }
  },

  // 类型4: 迷宫（无限尝试）
  mazeRunner: {
    name: '迷宫逃脱',
    icon: '🏃',
    init(container, onComplete, onFail) {
      const size = 7;
      // Simple maze generation using recursive backtracking
      const maze = Array(size).fill(null).map(() => Array(size).fill(1));
      function carve(x, y) {
        maze[y][x] = 0;
        const dirs = [[0,-2],[2,0],[0,2],[-2,0]];
        // Shuffle
        for (let i = dirs.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
        }
        for (const [dx, dy] of dirs) {
          const nx = x + dx, ny = y + dy;
          if (nx > 0 && nx < size - 1 && ny > 0 && ny < size - 1 && maze[ny][nx] === 1) {
            maze[y + dy/2][x + dx/2] = 0;
            carve(nx, ny);
          }
        }
      }
      carve(1, 1);
      maze[1][1] = 2; // start
      maze[size-2][size-2] = 3; // end
      let px = 1, py = 1;
      let steps = 0;

      container.innerHTML = `
        <div class="puzzle-container">
          <p style="color:var(--cyan);">用方向键或点击移动 · 已走 <span id="mazeSteps">0</span> 步</p>
          <div class="puzzle-grid" style="grid-template-columns:repeat(${size},40px);" id="mazeGrid"></div>
          <div style="display:flex;gap:4px;margin-top:8px;">
            <button class="btn btn-sm" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;" id="mzUp">↑</button>
          </div>
          <div style="display:flex;gap:4px;">
            <button class="btn btn-sm" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;" id="mzLeft">←</button>
            <button class="btn btn-sm" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;" id="mzDown">↓</button>
            <button class="btn btn-sm" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;" id="mzRight">→</button>
          </div>
          <button class="btn btn-sm btn-magic" id="mzRetry" style="margin-top:8px;">🔄 回到起点</button>
        </div>`;

      const grid = container.querySelector('#mazeGrid');
      function render() {
        grid.innerHTML = '';
        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            const cell = document.createElement('div');
            cell.className = 'maze-cell';
            if (maze[y][x] === 1) cell.classList.add('wall');
            else if (maze[y][x] === 2) cell.classList.add('start');
            else if (maze[y][x] === 3) cell.classList.add('end');
            if (x === px && y === py && maze[y][x] !== 3) cell.classList.add('player');
            grid.appendChild(cell);
          }
        }
      }

      function move(dx, dy) {
        const nx = px + dx, ny = py + dy;
        if (nx < 0 || nx >= size || ny < 0 || ny >= size || maze[ny][nx] === 1) return;
        AudioFX.puzzleClick();
        px = nx; py = ny;
        steps++;
        container.querySelector('#mazeSteps').textContent = steps;
        render();
        if (maze[ny][nx] === 3) {
          setTimeout(() => onComplete(), 300);
        }
      }

      render();
      document.getElementById('mzUp').addEventListener('click', () => move(0, -1));
      document.getElementById('mzDown').addEventListener('click', () => move(0, 1));
      document.getElementById('mzLeft').addEventListener('click', () => move(-1, 0));
      document.getElementById('mzRight').addEventListener('click', () => move(1, 0));
      document.getElementById('mzRetry').addEventListener('click', () => {
        AudioFX.puzzleClick();
        px = 1; py = 1; steps = 0;
        container.querySelector('#mazeSteps').textContent = '0';
        render();
      });

      // Keyboard controls
      const keyHandler = (e) => {
        switch(e.key) {
          case 'ArrowUp': e.preventDefault(); move(0, -1); break;
          case 'ArrowDown': e.preventDefault(); move(0, 1); break;
          case 'ArrowLeft': e.preventDefault(); move(-1, 0); break;
          case 'ArrowRight': e.preventDefault(); move(1, 0); break;
        }
      };
      document.addEventListener('keydown', keyHandler);
      container._cleanup = () => document.removeEventListener('keydown', keyHandler);
    },
    cleanup(container) { if (container._cleanup) container._cleanup(); }
  },

      for (let i = 0; i < seqLen; i++) {

      let showingSequence = true;

      container.innerHTML = `

          if (showingSequence) return;
          AudioFX.puzzleClick();
          if (s === sequence[userIdx]) {
            userIdx++;
            const items = container.querySelectorAll('.sequence-item');
            if (items[userIdx - 1]) items[userIdx - 1].textContent = s;
            if (userIdx === seqLen) {
              AudioFX.puzzleMatch();
              setTimeout(() => onComplete(), 400);
            }
          } else {
            AudioFX.puzzleWrong();
            btn.classList.add('wrong');
            setTimeout(() => btn.classList.remove('wrong'), 400);

            showingSequence = true;
            const items = container.querySelectorAll('.sequence-item');
            items.forEach(item => item.textContent = '❓');
            container.querySelector('#patStatus').textContent = '记错了……再看一遍！';
            setTimeout(() => {
              let si = 0;
              function resh() {
                if (si < seqLen) { items[si].textContent = sequence[si]; si++; setTimeout(resh, 500); }
                else {
                  setTimeout(() => { items.forEach(item => item.textContent = '❓'); showingSequence = false; container.querySelector('#patStatus').textContent = '请按顺序点击图案！'; }, 800);
                }
              }
              resh();
            }, 800);
          }
        });
        btnsDiv.appendChild(btn);
      });

      // Show sequence one by one
      const items = container.querySelectorAll('.sequence-item');
      let showIdx = 0;
      function showNext() {
        if (showIdx < seqLen) {
          items[showIdx].textContent = sequence[showIdx];
          showIdx++;
          setTimeout(showNext, 500);
        } else {
          // Hide after a moment
          setTimeout(() => {
            items.forEach(item => item.textContent = '❓');
            showingSequence = false;
            container.querySelector('#patStatus').textContent = '请按顺序点击图案！';
            container.querySelector('#patRetry').classList.remove('hidden');
          }, 800);
        }
      }
      setTimeout(showNext, 500);

      container.querySelector('#patRetry').addEventListener('click', () => {
        if (showingSequence) return;
        AudioFX.puzzleClick();
        showingSequence = true;
        userIdx = 0;
        const its = container.querySelectorAll('.sequence-item');
        its.forEach(item => item.textContent = '❓');
        container.querySelector('#patStatus').textContent = '正在展示序列...';
        container.querySelector('#patRetry').classList.add('hidden');

              container.querySelector('#patRetry').classList.remove('hidden');
            }, 800);
          }
        }
        resh2();
      });
    }

            hintEl.innerHTML = `🎉 猜对了！就是 <b>${answer}</b>（猜了${attempts}次）`;
            // Disable all buttons

          } else if (i < answer) {

  // 类型9: 快速点击 — 超简单，在星星消失前点击
  quickTap: {
    name: '追星逐月',
    icon: '⭐',
    init(container, onComplete, onFail) {
      const totalTargets = 5;
      let caught = 0;
      let timeout = null;

      container.innerHTML = `
        <div class="puzzle-container">
          <p style="color:var(--cyan);">抓住 <b>${totalTargets}</b> 颗流星！已抓：<span id="caughtCount">0</span></p>
          <div style="position:relative;width:100%;height:300px;background:rgba(10,10,30,0.5);border-radius:16px;overflow:hidden;cursor:crosshair;" id="tapArea">
            <p style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#555;pointer-events:none;" id="tapHint">点击出现的星星 ⭐</p>
          </div>
        </div>`;

      const area = container.querySelector('#tapArea');
      const caughtEl = container.querySelector('#caughtCount');
      const hintEl = container.querySelector('#tapHint');

      function spawnStar() {
        if (caught >= totalTargets) return;
        hintEl.textContent = '';
        const star = document.createElement('div');
        const x = 20 + Math.random() * (area.clientWidth - 60);
        const y = 20 + Math.random() * (area.clientHeight - 60);
        const size = 40 + Math.random() * 20;
        star.style.cssText = `
          position:absolute;left:${x}px;top:${y}px;
          width:${size}px;height:${size}px;
          font-size:${size-8}px;
          line-height:${size}px;text-align:center;
          cursor:pointer;user-select:none;
          animation: starPop 0.3s ease-out;
          z-index:10;
        `;
        star.textContent = '⭐';
        star.addEventListener('click', (e) => {
          e.stopPropagation();
          AudioFX.puzzleClick();
          caught++;
          caughtEl.textContent = caught;
          star.remove();
          clearTimeout(timeout);
          if (caught >= totalTargets) {
            AudioFX.puzzleMatch();
            hintEl.textContent = '全部抓住！';
            setTimeout(() => onComplete(), 500);
          } else {
            setTimeout(spawnStar, 400 + Math.random() * 600);
          }
        });
        area.appendChild(star);
        // Auto-disappear after 3 seconds
        timeout = setTimeout(() => {
          if (star.parentNode) {
            star.remove();
            setTimeout(spawnStar, 300);
          }
        }, 3000);
      }

      // Add keyframe
      if (!document.getElementById('starPopStyle')) {
        const style = document.createElement('style');
        style.id = 'starPopStyle';
        style.textContent = '@keyframes starPop{0%{transform:scale(0)rotate(-180deg);opacity:0}100%{transform:scale(1)rotate(0deg);opacity:1}}';
        document.head.appendChild(style);
      }

      setTimeout(spawnStar, 500);
    }
  }
};

const STATE_KEY = 'feng_stroke_save_v4';

function loadState() {
  try {
    const raw = localStorage.getItem(STATE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { currentLayer:0, layerProgress:{}, currentLevel:null, hearts:3, unlockedLayer:1, completedLayers:[], firstTime:true };
}

function saveState(s) {
  localStorage.setItem(STATE_KEY, JSON.stringify(s));
  showSaveIndicator();
}

function startLevel(layerId, levelIdx) {
  const layer = LAYER_DATA[layerId - 1];
  const level = layer.levels[levelIdx];
  G.currentLevel = { layerId, levelIdx };
  saveState(G);
  const progress = G.layerProgress[layerId] || [];
  const isFirstTime = !progress[levelIdx];

  function beginGame() {
    if (level.type === 'stroke') {
      initStrokeGame(layerId, levelIdx, level);
    } else {
      initPuzzleGame(layerId, levelIdx, level);
    }
  }

  if (isFirstTime) {
    if (levelIdx === 0 && layer.story.intro) {
      showStory(layer.story.intro, beginGame);
    } else {
      showStory({
        title: `第${layerId}层 · 第${levelIdx+1}关`,
        text: `你继续在${layer.name}中前行。新的挑战「${level.name}」已经出现。${level.type === 'puzzle' ? '这次的考验与以往不同——智慧与观察力将是你最好的武器。' : '魔法阵的结构变得更加复杂。集中精神，风会指引你的方向。'}`,
        speaker: '——风之低语', icon: layer.icon, voice: false
      }, beginGame);
    }
  } else { beginGame(); }
}

// ============================================================
// 一笔画游戏核心
// ============================================================
let strokeState = null;
let puzzleActive = false;

function initStrokeGame(layerId, levelIdx, levelData) {
  puzzleActive = false;
  const graph = UNIQUE_GRAPHS[levelData.graphIdx];
  const nodes = graph.nodes;
  const edges = graph.edges;
  const cx = 250, cy = 250, r = 180;
  const nodePositions = [];
  for (let i = 0; i < nodes; i++) {
    const angle = (2 * Math.PI * i / nodes) - Math.PI / 2;
    nodePositions.push({ x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) });
  }
  strokeState = { layerId, levelIdx, levelData, nodes, edges, nodePositions, currentNode: null, visitedEdges: {}, path: [], completed: false, canvasWidth: 500, canvasHeight: 500 };
  renderStrokeGame();
}

function edgeKey(a, b) { return a < b ? `${a}-${b}` : `${b}-${a}`; }

function renderStrokeGame() {
  const gs = strokeState;
  const layer = LAYER_DATA[gs.layerId - 1];
  const progress = G.layerProgress[gs.layerId] || [];

  app.innerHTML = `
    <div class="top-nav">
      <button class="back-btn" onclick="AudioFX.click();backToLayer(${gs.layerId})">← 返回关卡选择</button>
      <span style="color:var(--gold);">❤️ <span class="hearts">${'❤️'.repeat(G.hearts)}<span style="opacity:0.25">${'🖤'.repeat(3-G.hearts)}</span></span></span>
    </div>
    <div style="text-align:center;">
      <span style="color:var(--gold-light);font-size:1.1rem;">${layer.icon} ${layer.name}</span>
      <span style="color:#888;"> · 第${gs.levelIdx+1}关 · </span>
      <span style="color:var(--cyan);">${gs.levelData.name}</span>
      <span style="color:#888;font-size:0.8rem;"> (一笔画)</span>
    </div>
    <div class="game-info">
      <div class="info-item"><span style="color:#888;">关卡进度：</span><div class="progress-dots">${[0,1,2].map(i => `<div class="progress-dot ${progress[i] ? 'done' : (i === gs.levelIdx ? 'current' : '')}"></div>`).join('')}</div></div>
      <div class="info-item"><span style="color:#888;">路径：</span><span style="color:var(--cyan);" id="edgeCount">${Object.keys(gs.visitedEdges).length}/${gs.edges.length} 条边</span></div>
    </div>
    <div class="game-canvas-wrap"><canvas id="gameCanvas" width="${gs.canvasWidth}" height="${gs.canvasHeight}"></canvas></div>
    <div style="text-align:center;margin-top:8px;color:#888;font-size:0.85rem;">📖 ${gs.levelData.hint}</div>
    <div style="text-align:center;margin-top:12px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
      <button class="btn btn-sm btn-danger" onclick="AudioFX.click();giveUpLevel()">🏳️ 放弃</button>
    </div>
    <div id="pathDisplay" class="path-hint" style="margin-top:12px;"></div>
    <div style="text-align:center;margin-top:4px;color:#e74c3c;font-size:0.75rem;">⚠ 点击错误的节点将直接消耗一次挑战机会</div>
  `;

  const canvas = document.getElementById('gameCanvas');
  drawStrokeGame(canvas);
  updatePathDisplay();
  canvas.addEventListener('click', (e) => handleStrokeClick(e, canvas));
  canvas.addEventListener('mousemove', (e) => handleStrokeHover(e, canvas));
}

function drawStrokeGame(canvas) {
  const gs = strokeState;
  const ctx = canvas.getContext('2d');
  const W = gs.canvasWidth, H = gs.canvasHeight;
  ctx.clearRect(0, 0, W, H);

  for (const [a, b] of gs.edges) {
    const key = edgeKey(a, b);
    const visited = gs.visitedEdges[key];
    const pa = gs.nodePositions[a], pb = gs.nodePositions[b];
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y);
    ctx.lineWidth = visited ? 3 : 1.5;
    ctx.strokeStyle = visited ? 'rgba(240,215,140,0.9)' : 'rgba(255,255,255,0.12)';
    if (visited) { ctx.shadowColor = 'rgba(240,215,140,0.5)'; ctx.shadowBlur = 6; }
    ctx.stroke(); ctx.shadowBlur = 0;
  }

  if (gs.path.length >= 2) {
    ctx.beginPath();
    ctx.moveTo(gs.nodePositions[gs.path[0]].x, gs.nodePositions[gs.path[0]].y);
    for (let i = 1; i < gs.path.length; i++) ctx.lineTo(gs.nodePositions[gs.path[i]].x, gs.nodePositions[gs.path[i]].y);
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(91,127,239,0.8)';
    ctx.shadowColor = 'rgba(91,127,239,0.6)'; ctx.shadowBlur = 10;
    ctx.stroke(); ctx.shadowBlur = 0;
  }

  for (let i = 0; i < gs.nodes; i++) {
    const p = gs.nodePositions[i];
    const isCurrent = gs.currentNode === i;
    const isStart = gs.path.length > 0 && gs.path[0] === i;
    const isLast = gs.path.length > 0 && gs.path[gs.path.length - 1] === i;

    if (isCurrent || isLast) {
      ctx.beginPath(); ctx.arc(p.x, p.y, 22, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(240,215,140,0.15)'; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(p.x, p.y, 16, 0, Math.PI * 2);
    const grad = ctx.createRadialGradient(p.x-3, p.y-3, 2, p.x, p.y, 16);
    if (isCurrent) { grad.addColorStop(0,'#fff'); grad.addColorStop(0.5,'#f0d78c'); grad.addColorStop(1,'#b8860b'); }
    else if (isLast) { grad.addColorStop(0,'#f0d78c'); grad.addColorStop(1,'#7c3aed'); }
    else if (isStart) { grad.addColorStop(0,'#22d3ee'); grad.addColorStop(1,'#0e7490'); }
    else { grad.addColorStop(0,'#c8c8d4'); grad.addColorStop(1,'#4a4a6a'); }
    ctx.fillStyle = grad; ctx.fill();
    ctx.strokeStyle = isCurrent ? '#f0d78c' : 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px "STSong","SimSun","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(i + 1, p.x, p.y);
  }

  if (gs.currentNode !== null) {
    const p = gs.nodePositions[gs.currentNode];
    ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, Math.PI * 2);
    ctx.strokeStyle = '#f0d78c'; ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
  }
}

function handleStrokeClick(e, canvas) {
  if (strokeState.completed) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = strokeState.canvasWidth / rect.width;
  const scaleY = strokeState.canvasHeight / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;

  let clickedNode = null;
  for (let i = 0; i < strokeState.nodes; i++) {
    if (Math.sqrt((mx - strokeState.nodePositions[i].x) ** 2 + (my - strokeState.nodePositions[i].y) ** 2) < 24) {
      clickedNode = i; break;
    }
  }
  if (clickedNode === null) return;

  const gs = strokeState;

  // First click: select start node
  if (gs.path.length === 0) {
    gs.path.push(clickedNode);
    gs.currentNode = clickedNode;
    AudioFX.click();
    drawStrokeGame(canvas);
    updatePathDisplay();
    return;
  }

  // Subsequent clicks: attempt to draw edge
  if (gs.currentNode !== null) {
    const from = gs.currentNode, to = clickedNode;
    if (from === to) return; // Same node, ignore
    
    const key = edgeKey(from, to);
    const edgeExists = gs.edges.some(([a,b]) => (a===from&&b===to)||(a===to&&b===from));
    
    // Check for invalid move: no edge OR edge already visited
    if (!edgeExists || gs.visitedEdges[key]) {
      // Mistake! Lose a life immediately
      AudioFX.error();
      handleStrokeMistake(canvas);
      return;
    }

    // Valid move
    gs.visitedEdges[key] = true;
    gs.path.push(to);
    gs.currentNode = to;
    AudioFX.pathWalk(gs.path.length);

    drawStrokeGame(canvas);
    updatePathDisplay();
    checkStrokeCompletion();
  }
}

function handleStrokeMistake(canvas) {
  const gs = strokeState;
  // Flash red on canvas
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(231,76,60,0.3)';
  ctx.fillRect(0, 0, gs.canvasWidth, gs.canvasHeight);
  setTimeout(() => drawStrokeGame(canvas), 200);

  // Lose a life
  G.hearts--;
  AudioFX.fail();

  if (G.hearts <= 0) {
    G.hearts = 3;
    G.layerProgress[gs.layerId] = [];
    saveState(G);
    strokeState = null;
    showModal('💔 挑战失败', `一步走错，魔法阵崩溃了！\n「${LAYER_DATA[gs.layerId-1].name}」的进度已被重置。\n请重新挑战这一层。`, [
      { label: '重新开始', cls: 'btn-danger', action: () => enterLayer(gs.layerId) }
    ]);
  } else {
    saveState(G);
    strokeState = null;
    showModal('⚠️ 走错了！', `你触发了魔法阵的反噬！\n剩余挑战机会：${G.hearts} 次。\n请重新尝试本关卡。`, [
      { label: '重试', cls: 'btn-magic', action: () => initStrokeGame(gs.layerId, gs.levelIdx, gs.levelData) }
    ]);
  }
}

function handleStrokeHover(e, canvas) {
  if (strokeState.completed) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = strokeState.canvasWidth / rect.width;
  const scaleY = strokeState.canvasHeight / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;

  let hoveringNode = null;
  for (let i = 0; i < strokeState.nodes; i++) {
    if (Math.sqrt((mx - strokeState.nodePositions[i].x) ** 2 + (my - strokeState.nodePositions[i].y) ** 2) < 24) {
      hoveringNode = i; break;
    }
  }

  if (strokeState.currentNode !== null && hoveringNode !== null && hoveringNode !== strokeState.currentNode) {
    const key = edgeKey(strokeState.currentNode, hoveringNode);
    const edgeExists = strokeState.edges.some(([a,b]) => (a===strokeState.currentNode&&b===hoveringNode)||(a===hoveringNode&&b===strokeState.currentNode));
    canvas.style.cursor = (edgeExists && !strokeState.visitedEdges[key]) ? 'pointer' : 'not-allowed';
  } else if (hoveringNode !== null && strokeState.path.length === 0) {
    canvas.style.cursor = 'pointer';
  } else {
    canvas.style.cursor = hoveringNode !== null ? 'pointer' : 'default';
  }
}

function updatePathDisplay() {
  const gs = strokeState;
  const display = document.getElementById('pathDisplay');
  const countEl = document.getElementById('edgeCount');
  if (!display) return;
  let html = '';
  for (let i = 0; i < gs.path.length; i++) {
    if (i > 0) html += '<span class="path-arrow">→</span>';
    html += `<span class="path-step ${i === gs.path.length-1 ? 'active' : ''}">${gs.path[i]+1}</span>`;
  }
  display.innerHTML = html || '<span style="color:#888;">👆 点击节点开始绘制路径</span>';
  if (countEl) countEl.textContent = `${Object.keys(gs.visitedEdges).length}/${gs.edges.length} 条边`;
}

function checkStrokeCompletion() {
  const gs = strokeState;
  if (Object.keys(gs.visitedEdges).length === gs.edges.length) {
    gs.completed = true;
    setTimeout(() => levelComplete(), 500);
  }
}

// ============================================================
// 解谜小游戏
// ============================================================
function initPuzzleGame(layerId, levelIdx, levelData) {
  strokeState = null;
  puzzleActive = true;
  const layer = LAYER_DATA[layerId - 1];
  const progress = G.layerProgress[layerId] || [];
  const puzzleDef = PuzzleGames[levelData.puzzleType];

  app.innerHTML = `
    <div class="top-nav">
      <button class="back-btn" onclick="AudioFX.click();backToLayer(${layerId})">← 返回关卡选择</button>
      <span style="color:var(--cyan);font-size:0.85rem;">🧩 解谜试炼 · 无限尝试</span>
    </div>
    <div style="text-align:center;">
      <span style="color:var(--gold-light);font-size:1.1rem;">${layer.icon} ${layer.name}</span>
      <span style="color:#888;"> · 第${levelIdx+1}关 · </span>
      <span style="color:var(--cyan);">${levelData.name}</span>
      <span style="color:#888;font-size:0.8rem;"> (${puzzleDef.icon} ${puzzleDef.name})</span>
    </div>
    <div class="game-info">
      <div class="info-item"><span style="color:#888;">关卡进度：</span><div class="progress-dots">${[0,1,2].map(i => `<div class="progress-dot ${progress[i] ? 'done' : (i === levelIdx ? 'current' : '')}"></div>`).join('')}</div></div>
    </div>
    <div class="panel">
      <div id="puzzleContainer" class="puzzle-container"></div>
    </div>
    <div style="text-align:center;margin-top:8px;color:#888;font-size:0.85rem;">📖 ${levelData.hint}</div>
  `;

  const container = document.getElementById('puzzleContainer');
  const puzzleState = { layerId, levelIdx, levelData };
  
  puzzleDef.init(container, 
    () => {
      // onComplete
      puzzleActive = false;
      levelComplete();
    },
    () => {
      // onFail
      puzzleActive = false;
      handlePuzzleFail(puzzleState);
    }
  );
}

function handlePuzzleFail(ps) {
  // 解谜小游戏不消耗爱心，可以无限重试
  AudioFX.fail();
  showModal('⚠️ 未能通过', `试炼失败……\n别灰心，解谜试炼可以无限次尝试！\n再试一次吧。`, [
    { label: '重试', cls: 'btn-magic', action: () => startLevel(ps.layerId, ps.levelIdx) },
    { label: '返回关卡选择', cls: 'btn-gold', action: () => enterLayer(ps.layerId) }
  ]);
}

// ============================================================
// 关卡完成
// ============================================================
function levelComplete() {
  const cl = G.currentLevel;
  const layerId = cl.layerId;
  const levelIdx = cl.levelIdx;

  if (!G.layerProgress[layerId]) G.layerProgress[layerId] = [];
  G.layerProgress[layerId][levelIdx] = true;
  const progress = G.layerProgress[layerId];
  const allDone = progress.length === 3 && progress.every(Boolean);
  saveState(G);

  AudioFX.levelClear();
  spawnVictoryParticles();

  const levelData = LAYER_DATA[layerId - 1].levels[levelIdx];

  showClearAnimation(levelData, () => {
    if (allDone) {
      if (!G.completedLayers.includes(layerId)) G.completedLayers.push(layerId);
      if (layerId < 8) G.unlockedLayer = Math.max(G.unlockedLayer, layerId + 1);
      saveState(G);
      AudioFX.layerClear();
      spawnVictoryParticles();

      const layer = LAYER_DATA[layerId - 1];
      setTimeout(() => {
        showStory(layer.story.clear, () => renderLobby());
      }, 500);
    } else {
      showModal('✨ 关卡通过！', `「${levelData.name}」完成！\n继续挑战下一关吧！`, [
        { label: '继续', cls: 'btn-gold', action: () => { G.hearts = 3; saveState(G); enterLayer(layerId); }}
      ]);
    }
  });
}

function backToLayer(layerId) {
  strokeState = null;
  puzzleActive = false;
  G.currentLevel = null;
  saveState(G);
  enterLayer(layerId);
}

function giveUpLevel() {
  showModal('🤔 确认放弃？', '放弃本关将消耗一次挑战机会。\n如果机会用完，本层进度将被重置。', [
    { label: '取消', cls: 'btn-gold', action: () => {} },
    { label: '确认放弃', cls: 'btn-danger', action: () => failLevel() }
  ]);
}

function failLevel() {
  const cl = G.currentLevel;
  G.hearts--;
  AudioFX.fail();

  if (G.hearts <= 0) {
    G.hearts = 3;
    G.layerProgress[cl.layerId] = [];
    saveState(G);
    strokeState = null;
    puzzleActive = false;
    showModal('💔 挑战失败', `你已经用完了所有挑战机会！\n「${LAYER_DATA[cl.layerId-1].name}」的进度已被重置。\n请重新挑战这一层。`, [
      { label: '重新开始', cls: 'btn-danger', action: () => enterLayer(cl.layerId) }
    ]);
  } else {
    saveState(G);
    showModal('⚠️ 路径未完成', `你还有 ${G.hearts} 次挑战机会。\n请重新尝试本关卡。`, [
      { label: '重试', cls: 'btn-magic', action: () => startLevel(cl.layerId, cl.levelIdx) }
    ]);
  }
}

function resetGame() {
  showModal('⚠️ 重置游戏', '确定要重置所有游戏进度吗？此操作不可撤销。', [
    { label: '取消', cls: 'btn-gold', action: () => {} },
    { label: '确认重置', cls: 'btn-danger', action: () => {
      G = { currentLayer:0, layerProgress:{}, currentLevel:null, hearts:3, unlockedLayer:1, completedLayers:[], firstTime:true };
      saveState(G);
      strokeState = null;
      puzzleActive = false;
      renderLobby();
    }}
  ]);
}

// ============================================================
// 初始化
// ============================================================
function init() {
  if (G.firstTime) {
    G.firstTime = false;
    saveState(G);
    showStory({
      title: '序章 · 风之觉醒',
      text: '在这片名为"风之大陆"的传奇之地上，风是万物之源。千年前，风之精灵希尔芙用她的力量创造了这片广袤的世界，并在其中埋藏了八道试炼。只有通过全部试炼的勇者，才能获得风之精灵的祝福，成为大陆的守护者。\n\n如今，黑暗领主艾瑞波斯正在吞噬这片大陆的光明。风在呼唤，命运之轮已经开始转动。你，被选中的勇者，将踏上这段充满魔法与奇迹的旅程。',
      speaker: '——风之精灵 · 希尔芙',
      icon: '🧚',
      voice: true
    }, () => renderLobby());
  } else {
    renderLobby();
  }
}

init();
</script>
