<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>裂土擂台 - 实时格斗</title>
<style>
:root{--bg:#1a1a2e;--panel:#16213e;--gold:#e2b04a;--red:#c0392b;--green:#27ae60;--blue:#2980b9;--text:#d4d4d4;--text-bright:#f0e6d3;--border:#3d3d5c;}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a14;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Microsoft YaHei',sans-serif;overflow:hidden}
#game-container{width:1200px;height:800px;position:relative;overflow:hidden}
.screen{position:absolute;top:0;left:0;width:100%;height:100%;display:none;}
.screen.active{display:flex;flex-direction:column;align-items:center;}
#title-screen{background:linear-gradient(135deg,#0a0a14,#1a1a2e,#0a0a14);justify-content:center;gap:20px;color:var(--text);}
.title-main{font-size:64px;font-weight:900;background:linear-gradient(180deg,#f0d78c,#b8860b,#8b6914);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:8px;}
.title-sub{font-size:18px;color:#888;letter-spacing:4px;margin-top:-10px;}
.btn-row{display:flex;gap:20px;}
.btn{padding:12px 40px;font-size:18px;font-weight:700;border:2px solid var(--gold);background:linear-gradient(180deg,rgba(226,176,74,0.2),rgba(139,105,20,0.2));color:var(--gold);cursor:pointer;border-radius:4px;letter-spacing:2px;transition:all 0.3s;font-family:inherit;}
.btn:hover{background:linear-gradient(180deg,rgba(226,176,74,0.4),rgba(139,105,20,0.4));box-shadow:0 0 20px rgba(226,176,74,0.3);transform:translateY(-2px);}
.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.btn-small{padding:6px 16px;font-size:13px;letter-spacing:1px}
.btn-blue{border-color:var(--blue);background:linear-gradient(180deg,rgba(41,128,185,0.2),rgba(36,113,163,0.2));color:#5dade2;}
.btn-blue:hover{box-shadow:0 0 20px rgba(41,128,185,0.4);}

#select-screen,#duo-select-screen{background:linear-gradient(180deg,#1a1a2e,#0f0f23);padding:15px;color:var(--text);overflow-y:auto;}
.select-title{font-size:26px;color:var(--gold);letter-spacing:3px;margin:8px 0;}
.select-subtitle{font-size:13px;color:#888;margin-bottom:10px;}
.profession-grid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:1140px;}
.prof-card{width:135px;background:var(--panel);border:2px solid var(--border);border-radius:8px;padding:8px;cursor:pointer;transition:all 0.3s;text-align:center;color:var(--text);}
.prof-card:hover{border-color:var(--gold);box-shadow:0 0 18px rgba(226,176,74,0.2);transform:translateY(-3px)}
.prof-card.selected{border-color:var(--gold);box-shadow:0 0 22px rgba(226,176,74,0.4);background:#1e2d3d}
.prof-avatar{width:55px;height:55px;margin:0 auto 5px;border-radius:6px;}
.prof-name{font-size:12px;font-weight:700;color:var(--text-bright);margin-bottom:2px}
.prof-desc{font-size:8px;color:#999;margin-bottom:3px;line-height:1.2}
.prof-stats{font-size:8px;color:#888;margin-bottom:3px}
.skill-mini{font-size:7px;color:#aaa;text-align:left;padding:1px 0}
.skill-mini .sname{color:var(--text-bright)}.skill-mini.ult .sname{color:#ff6b6b}
.player-info-row{display:flex;gap:15px;align-items:center;margin:8px 0;}
.player-info-row input{padding:8px 12px;font-size:14px;background:var(--panel);border:1px solid var(--border);color:var(--text-bright);border-radius:4px;width:180px;font-family:inherit;}

.duo-players{display:flex;gap:25px;width:100%;max-width:1140px;}
.duo-panel{flex:1;background:var(--panel);border:2px solid var(--border);border-radius:8px;padding:12px;}
.duo-panel.p1{border-color:rgba(226,176,74,0.3)}.duo-panel.p2{border-color:rgba(41,128,185,0.3)}
.duo-panel h3{text-align:center;margin-bottom:6px;font-size:15px}
.duo-panel.p1 h3{color:var(--gold)}.duo-panel.p2 h3{color:#5dade2}
.duo-panel input{width:100%;padding:7px;margin-bottom:6px;background:#1a1a2e;border:1px solid var(--border);border-radius:4px;font-family:inherit;text-align:center;color:var(--text-bright);}
.duo-prof-grid{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;}
.duo-prof{width:100px;background:#1a1a2e;border:2px solid var(--border);border-radius:6px;padding:6px;cursor:pointer;transition:all 0.2s;text-align:center;font-size:9px;color:var(--text);}
.duo-prof:hover{transform:translateY(-2px)}
.duo-prof.p1-sel{border-color:var(--gold);box-shadow:0 0 12px rgba(226,176,74,0.3)}
.duo-prof.p2-sel{border-color:#5dade2;box-shadow:0 0 12px rgba(41,128,185,0.3)}

#hub-screen{background:linear-gradient(180deg,#1a1a2e,#0f0f23);padding:0;color:var(--text);}
.hub-header{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 20px;background:var(--panel);border-bottom:2px solid var(--border);}
.hub-title{font-size:20px;color:var(--gold);letter-spacing:2px}
.hub-stats{display:flex;gap:20px;font-size:14px}
.hub-stat{color:var(--text-bright)}.hub-stat span{color:var(--gold)}
.hub-content{display:flex;flex:1;width:100%;min-height:0;}
.hub-sidebar{width:180px;background:var(--panel);border-right:1px solid var(--border);padding:10px;display:flex;flex-direction:column;gap:5px;}
.hub-main{flex:1;padding:20px;overflow-y:auto;color:var(--text);min-height:0;}
.nav-btn{padding:9px 14px;font-size:13px;background:transparent;border:1px solid transparent;color:#aaa;cursor:pointer;text-align:left;border-radius:4px;transition:all 0.2s;font-family:inherit;}
.nav-btn:hover{background:rgba(226,176,74,0.1);color:var(--text-bright)}
.nav-btn.active{background:rgba(226,176,74,0.2);border-color:var(--gold);color:var(--gold);font-weight:700}

.shop-grid,.talent-grid{display:flex;gap:10px;flex-wrap:wrap;}
.shop-item,.talent-item{width:170px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:10px;text-align:center;transition:all 0.2s;color:var(--text);}
.shop-item:hover{border-color:var(--gold)}.talent-item:hover{border-color:var(--blue)}
.shop-item.owned{opacity:0.6;border-color:var(--green)}
.shop-item.owned::after{content:'已拥有';color:var(--green);font-size:10px;display:block}
.status-grid{display:flex;gap:12px;flex-wrap:wrap;}
.status-card{width:235px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:12px;color:var(--text);}
.status-card h3{font-size:14px;color:var(--gold);margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:6px}
.stat-row{display:flex;justify-content:space-between;padding:2px 0;font-size:12px}
.stat-label{color:#888}.stat-value{color:var(--text-bright);font-weight:700}.stat-value.bonus{color:var(--green)}
.equip-slot{display:flex;justify-content:space-between;padding:2px 0;font-size:11px}
.equip-slot .slot-name{color:#888}.equip-slot .slot-item{color:var(--gold)}.equip-slot .slot-empty{color:#555}

#battle-hud{position:absolute;top:0;left:0;width:100%;pointer-events:none;z-index:10;display:none;padding:8px 16px;}
#battle-hud.active{display:block;}
.hud-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
.hud-player{display:flex;align-items:center;gap:8px;}
.hud-info{text-align:left;}.hud-name{font-size:13px;font-weight:700;color:var(--text-bright)}.hud-class{font-size:9px;color:#888}
.hud-bars{width:240px;}
.hud-hp,.hud-mp,.hud-stamina{height:13px;background:#222;border-radius:2px;margin:1px 0;position:relative;overflow:hidden}
.hud-hp-fill{height:100%;background:linear-gradient(90deg,#c0392b,#e74c3c);transition:width 0.3s;border-radius:2px}
.hud-mp-fill{height:100%;background:linear-gradient(90deg,#2471a3,#3498db);transition:width 0.3s;border-radius:2px}
.hud-stamina-fill{height:100%;background:linear-gradient(90deg,#b7950b,#f39c12);transition:width 0.3s;border-radius:2px}
.hud-bar-label{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.5)}
.hud-center{text-align:center;color:var(--gold);font-size:22px;font-weight:900;text-shadow:0 0 12px rgba(226,176,74,0.5)}
.hud-timer{font-size:16px;color:#888;margin-top:1px}
.hud-controls{text-align:center;color:#555;font-size:9px;margin-top:3px;}
.hud-controls span{color:#888;margin:0 6px;}
.hud-cd-row{display:flex;gap:20px;margin-top:2px;font-size:9px;}
.hud-cd-item{display:flex;align-items:center;gap:4px;color:#888;}
.hud-cd-item .ready{color:var(--green)}.hud-cd-item .cooling{color:#c0392b}

#battle-result-overlay{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);z-index:20;justify-content:center;align-items:center;flex-direction:column;}
#battle-result-overlay.active{display:flex}
.result-big{font-size:44px;font-weight:900;margin-bottom:12px}
.result-big.win{color:#f0d78c}.result-big.lose{color:#c0392b}
.result-sub{font-size:16px;color:#aaa;margin-bottom:18px}

#battle-canvas{display:none;width:100%;height:100%;}
#battle-canvas.active{display:block;}
</style>
</head>
<body>
<div id="game-container">
<div id="title-screen" class="screen active">
  <div class="title-main">裂土擂台</div><div class="title-sub">五国争霸 · 外传</div>
  <div class="btn-row"><button class="btn" onclick="G.goSelect()">⚔️ 开始游戏</button><button class="btn btn-blue" id="continue-btn" style="display:none" onclick="G.continueGame()">📂 继续游戏</button></div>
  <div style="color:#555;font-size:12px;margin-top:10px;">WASD移动 | J普攻 I技能1 K技能2 L大招 | 空格跳跃</div>
  <div style="color:#666;font-size:11px;margin-top:4px;" id="save-hint"></div>
</div>
<div id="select-screen" class="screen">
  <div class="select-title">选择你的职业</div>
  <div class="select-subtitle">J普攻 · I技能1 · K技能2 · L大招 · 近战技能需特效命中才造成伤害</div>
  <div class="profession-grid" id="prof-grid"></div>
  <div class="player-info-row"><input id="pname" placeholder="输入名字" maxlength="8" value="勇士"><button class="btn" id="confirm-prof-btn" disabled onclick="G.confirmProf()">确认职业</button></div>
</div>
<div id="duo-select-screen" class="screen">
  <div class="select-title">👥 双人对战 - 选择职业</div>
  <div class="select-subtitle">P1: WASD移动 J普攻 I技能1 K技能2 L大招 | P2: ↑↓←→移动 1普攻 2技能1 3技能2 0大招</div>
  <div class="duo-players">
    <div class="duo-panel p1"><h3>🟡 玩家一</h3><input id="dp1name" placeholder="玩家一名字" maxlength="8" value="挑战者"><div class="duo-prof-grid" id="dp1grid"></div></div>
    <div class="duo-panel p2"><h3>🔵 玩家二</h3><input id="dp2name" placeholder="玩家二名字" maxlength="8" value="应战者"><div class="duo-prof-grid" id="dp2grid"></div></div>
  </div>
  <button class="btn" style="margin-top:12px" id="duo-confirm" disabled onclick="G.confirmDuo()">双方准备完毕，开始对决！</button>
</div>
<div id="hub-screen" class="screen">
  <div class="hub-header"><div class="hub-title">⚔️ 裂土擂台</div>
    <div class="hub-stats"><div class="hub-stat">💰 <span id="hg">500</span></div><div class="hub-stat">🏆 <span id="hw">0</span>胜</div><div class="hub-stat">💀 <span id="hl">0</span>败</div></div></div>
  <div class="hub-content">
    <div class="hub-sidebar">
      <button class="nav-btn active" data-p="arena">⚔️ 挑战</button>
      <button class="nav-btn" data-p="moba" style="color:#ff6600;">🏟️ 多人模式</button>
      <button class="nav-btn" data-p="boss" style="color:#ff6666;">👑 Boss</button>
      <button class="nav-btn" data-p="timechallenge" style="color:#ffaa00;">⏱️ 限时挑战</button>
      <button class="nav-btn" data-p="shop">🛒 商店</button>
      <button class="nav-btn" data-p="talent">⭐ 天赋</button>
      <button class="nav-btn" data-p="status">📋 状态</button>
      <button class="nav-btn" data-p="compendium">📖 图鉴</button>
      <div style="flex:1"></div>
      <button class="nav-btn" id="sfx-toggle" style="color:#5dade2;" onclick="G.toggleSfx()">🔊 音效</button>
      <button class="nav-btn" style="color:#c0392b" onclick="G.toTitle()">🚪 退出</button></div>
    <div class="hub-main" id="hub-main"></div></div>
</div>
<canvas id="battle-canvas"></canvas>
<div id="battle-hud"></div>
<div id="battle-result-overlay"></div>
</div>

// 商城圆角矩形辅助
function roundRect(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

class MobaMonster{
  constructor(camp){
    this.camp=camp;
    this.x=camp.x;this.y=camp.y;
    const isBear=camp.type==='bear';
    this.type=camp.type;
    this.maxHp=isBear?600:350;this.hp=this.maxHp;
    this.atk=isBear?28:18;
    this.def=isBear?10:6;
    this.w=isBear?40:28;this.h=isBear?40:28;
    this.spd=0.8;this.goldValue=isBear?60:35;
    this.respawnTimer=0;this.respawnMax=15000;
    this.active=false; // 未被打扰时静止
    this.atkTimer=0;this.atkCooldown=1200;
    this.followTarget=null;
    this.team='neutral';
    this.isMonster=true;
    this.leashX=camp.x;this.leashY=camp.y; // 拉回点（防止拉怪太远）
  }
  getStat(s){ if(s==='def')return this.def; return 0; }
  takeDamage(dmg,attacker){
    this.hp-=dmg;
    if(this.hp<=0){
      this.hp=0;
      this.active=false;this.followTarget=null;
      this.respawnTimer=this.respawnMax;
      if(attacker){
        if(attacker===G.p1){G.mobaGold=(G.mobaGold||0)+this.goldValue;G.spawnHitEffect(this.x,this.y-20,this.goldValue,'#ffd700');}
        G.addBattleLog((attacker.name||'英雄')+' 击杀野怪 +'+this.goldValue+'金币');
      }
    }else{
      // 被打扰后追击攻击者
      if(attacker&&attacker.hp>0)this.followTarget=attacker;
      this.active=true;
    }
  }
  update(dt){
    if(this.respawnTimer>0){this.respawnTimer-=dt;if(this.respawnTimer<=0){this.hp=this.maxHp;this.active=false;this.followTarget=null;}return;}
    if(this.hp<=0)return;
    // 寻找最近的敌对目标（英雄/小兵）
    if(!this.followTarget||this.followTarget.hp<=0){
      this.followTarget=this.findNearestEnemy();
    }
    if(this.followTarget){
      this.active=true;
      const dx=this.followTarget.x-this.x,dy=this.followTarget.y-this.y;
      const d=Math.sqrt(dx*dx+dy*dy)||1;
      // 拉回范围限制（避免拉野怪太远）
      const leashD=Math.hypot(this.x-this.leashX,this.y-this.leashY);
      if(leashD>260){this.followTarget=null;this.active=false;return;}
      if(d>45){
        this.x+=dx/d*this.spd*(dt/16);
        this.y+=dy/d*this.spd*(dt/16);
      }else{
        this.atkTimer-=dt;
        if(this.atkTimer<=0){this.atkTimer=this.atkCooldown;this.attack(this.followTarget);}
      }
    }
  }
  findNearestEnemy(){
    let best=null,bestD=200;
    // 小兵
    for(const m of G.minions){if(m.hp<=0)continue;const d=Math.hypot(m.x-this.x,m.y-this.y);if(d<bestD){bestD=d;best=m;}}
    // 英雄（红蓝都算敌对）
    for(const f of [...G.mobaTeams.blue.fighters,...G.mobaTeams.red.fighters]){if(f.hp<=0)continue;const d=Math.hypot(f.x+f.w/2-this.x,f.y+f.h/2-this.y);if(d<bestD){bestD=d;best=f;}}
    return best;
  }
  attack(target){
    const dmg=this.atk;
    if(target.takeDamage){
      target.takeDamage(dmg,this);
      G.spawnHitEffect(target.x+target.w/2,target.y+target.h/2,dmg);
    }else if(target.hp!==undefined){target.hp-=dmg;}
  }
}

class MobaDragon{
  constructor(){
    this.x=MOBA_DRAGON_SPAWN.x;this.y=MOBA_DRAGON_SPAWN.y;
    this.maxHp=2500;this.hp=this.maxHp;
    this.atk=55;this.def=15;
    this.w=70;this.h=70;
    this.goldValue=200;
    this.alive=true;
    this.respawnTimer=0;this.respawnMax=45000;
    this.team='neutral';
    this.isDragon=true;
    this.followTarget=null;
    this.atkTimer=0;this.atkCooldown=900;
    this.leashX=this.x;this.leashY=this.y;
    this.berserk=false; // 血量低时狂暴
  }
  getStat(s){ if(s==='def')return this.def; return 0; }
  takeDamage(dmg,attacker){
    this.hp-=dmg;
    if(this.hp<=0){
      this.hp=0;this.alive=false;
      this.respawnTimer=this.respawnMax;
      this.followTarget=null;
      if(attacker){
        // 击杀者所属队伍全队获得增益（金币仅本局玩家获得）
        const team=attacker.team==='blue'?'blue':'red';
        if(attacker===G.p1)G.mobaGold=(G.mobaGold||0)+this.goldValue;
        G.spawnHitEffect(this.x,this.y-30,this.goldValue,'#ffd700');
        G.addBattleLog('巨龙被击败！击杀者所属队伍获得'+this.goldValue+'金币');
        // 全队增益：攻击力提升
        for(const f of G.mobaTeams[team].fighters){
          if(f.hp<=0)continue;
          if(!f.effects)f.effects=[];
          f.addEffect({name:'龙之祝福',duration:20000,icon:'🐲',color:'#ff9900',stat:'atk',value:25});
        }
        G.shockwaves.push({x:this.x,y:this.y,radius:5,maxRadius:300,speed:20,color:'#ff9900',alpha:0.9});
        G.playSfx('ultimate_impact',{fx:'rage'});
      }
    }else{
      this.followTarget=attacker;this.alive=true;
      if(this.hp<this.maxHp*0.3)this.berserk=true;
    }
  }
  update(dt){
    if(!this.alive){
      if(this.respawnTimer>0){this.respawnTimer-=dt;if(this.respawnTimer<=0){this.hp=this.maxHp;this.alive=true;this.berserk=false;this.followTarget=null;}}
      return;
    }
    if(!this.followTarget||this.followTarget.hp<=0)this.followTarget=this.findNearestEnemy();
    if(this.followTarget){
      const dx=this.followTarget.x-this.x,dy=this.followTarget.y-this.y;
      const d=Math.sqrt(dx*dx+dy*dy)||1;
      const leashD=Math.hypot(this.x-this.leashX,this.y-this.leashY);
      if(leashD>320){this.followTarget=null;return;}
      const spd=this.berserk?1.8:1.1;
      if(d>55){
        this.x+=dx/d*spd*(dt/16);this.y+=dy/d*spd*(dt/16);
      }else{
        this.atkTimer-=dt;
        if(this.atkTimer<=0){this.atkTimer=this.atkCooldown;this.attack(this.followTarget);}
      }
    }
  }
  findNearestEnemy(){
    let best=null,bestD=250;
    for(const m of G.minions){if(m.hp<=0)continue;const d=Math.hypot(m.x-this.x,m.y-this.y);if(d<bestD){bestD=d;best=m;}}
    for(const f of [...G.mobaTeams.blue.fighters,...G.mobaTeams.red.fighters]){if(f.hp<=0)continue;const d=Math.hypot(f.x+f.w/2-this.x,f.y+f.h/2-this.y);if(d<bestD){bestD=d;best=f;}}
    return best;
  }
  attack(target){
    const dmg=this.atk+(this.berserk?20:0);
    if(target.takeDamage){target.takeDamage(dmg,this);G.spawnHitEffect(target.x+target.w/2,target.y+target.h/2,dmg);}
    else if(target.hp!==undefined){target.hp-=dmg;}
  }
}

    if(this.hp<=0){this.hp=0;this.alive=false;if(G.addBattleLog)G.addBattleLog((attacker?attacker.name:'')+' 摧毁了 '+(this.laneName||'')+' 防御塔！');if(attacker===G.p1){G.mobaGold=(G.mobaGold||0)+150;G.spawnHitEffect(this.x,this.y-20,150,'#ffd700');}}

    if(G.onStructureAttacked)G.onStructureAttacked(this,attacker);

}

    this.hp-=dmg;
    if(this.hp<=0&&!this.alive){return;} // 已摧毁
    if(this.hp<=0){this.hp=0;this.alive=false;if(G.addBattleLog)G.addBattleLog((attacker?attacker.name:'')+' 摧毁了敌方水晶！！');if(attacker===G.p1){G.mobaGold=(G.mobaGold||0)+300;G.spawnHitEffect(this.x,this.y-30,300,'#ffd700');}}
    // 水晶被攻击时向全队发出警报，号召回防
    if(G.onStructureAttacked)G.onStructureAttacked(this,attacker);
  }
}

class Minion {
  constructor(x, y, team, laneY) {
    this.x = x; this.y = y;
    this.team = team;
    this.laneY = laneY;
    this.hp = 80; this.maxHp = 80;
    this.atk = 10; this.def = 5;
    this.spd = 1.5;
    this.w = 16; this.h = 16;
    this.vx = team === 'blue' ? 1 : -1;
    this.vy = 0;
    this.state = 'marching';
    this.target = null;
    this.atkTimer = 0;
    this.atkCooldown = 1500;
    this.goldValue = 20;
    this.spawnWave = 0;
  }
  getStat(stat){ if(stat==='def')return this.def; return 0; }
  takeDamage(dmg,attacker){
    this.hp-=dmg;
    if(this.hp<=0){
      this.hp=0;
      // 金币奖励（本局金币）
      if(attacker&&attacker===G.p1)G.mobaGold=(G.mobaGold||0)+this.goldValue;
      if(attacker&&G.spawnHitEffect)G.spawnHitEffect(this.x+this.w/2,this.y+this.h/2,this.goldValue,'#ffd700');
    }
  }
  findTarget() {
    let closest = null, minDist = 80;
    for (const other of G.minions) {
      if (other === this || other.team === this.team || other.hp <= 0) continue;
      const d = Math.hypot(this.x - other.x, this.y - other.y);
      if (d < minDist) { minDist = d; closest = other; }
    }
    const enemies = this.team === 'blue' ? G.mobaTeams.red.fighters : G.mobaTeams.blue.fighters;
    for (const e of enemies) {
      if (e.hp <= 0) continue;
      const d = Math.hypot(this.x - e.x, this.y - e.y);
      if (d < minDist) { minDist = d; closest = e; }
    }
    const enemyTowers = this.team === 'blue' ? G.mobaTeams.red.towers : G.mobaTeams.blue.towers;
    for (const t of enemyTowers) {
      if (!t.alive) continue;
      const d = Math.hypot(this.x - t.x, this.y - t.y);
      if (d < minDist) { minDist = d; closest = t; }
    }
    // 敌方水晶：当水晶非无敌且小兵推进到附近时，水晶成为最终目标（检测范围更大，让小兵有目标地推进）
    const enemyCrystal = this.team === 'blue' ? G.mobaTeams.red.crystal : G.mobaTeams.blue.crystal;
    if (enemyCrystal && enemyCrystal.alive && !enemyCrystal.invincible) {
      const d = Math.hypot(this.x - enemyCrystal.x, this.y - enemyCrystal.y);
      const crystalRange = 320; // 水晶锁定范围更大，引导小兵朝水晶推进
      if (d < crystalRange && (closest === null || d < minDist)) { minDist = d; closest = enemyCrystal; }
    }
    return closest;
  }
  distanceTo(target) {
    const tx = target.x + (target.w || 0) / 2;
    const ty = target.y + (target.h || 0) / 2;
    return Math.hypot(this.x - tx, this.y - ty);
  }
}

// ============ FIGHTER ============
class Fighter{
  constructor(prof,x,y,faceRight,name,extraStats,mobaTeam){
    const b=prof.base;this.prof=prof;this.name=name||prof.name;this.x=x;this.y=y;this.vx=0;this.vy=0;this.faceRight=faceRight;this.w=44;this.h=72;
    let hp=b.hp,mp=b.mp,stam=b.stamina,atk=b.atk,def=b.def,spd=b.spd;
    if(extraStats){for(const[k,v]of Object.entries(extraStats)){if(k==='maxHp')hp+=v;else if(k==='atk')atk+=v;else if(k==='def')def+=v;else if(k==='spd')spd+=v;else if(k==='maxMp')mp+=v;else if(k==='maxStamina')stam+=v;else if(k==='hp')hp+=v;}}
    this.maxHp=hp;this.hp=hp;this.maxMp=mp;this.mp=mp;this.maxStamina=stam;this.stamina=stam;this.atk=atk;this.def=def;this.spd=spd;
    this.state='idle';this.stateTimer=0;this.animFrame=0;this.animTimer=0;this.invincible=0;this.grounded=true;
    this.cooldowns={};this.effects=[];this.nextAtkBoost=false;this.comboCount=0;this.comboTimer=0;
    this.aiTimer=0;this.walkBob=0;this.footstepTimer=0;
    // MOBA 商城额外属性（仅本局生效，非 MOBA 模式全为默认值不受影响）
    this.mobaStats={crit:0,critMult:1.5,lifeSteal:0,atkSpeed:0,cdr:0,flatPen:0};
    this.atkTimer=0; // 普攻间隔计时（攻速）
    this.mobaAttackCooldown=0;
    // MOBA mode fields
    this.moba = !!mobaTeam;
    this.team = mobaTeam || null;
    this.respawnTimer = 0;
    this.respawnMax = 5000;
    this.growthTimer = 0;
    this.growthInterval = 30000;
    this.targetDir = faceRight ? 0 : Math.PI;
    this.skillPreview = null;
    this.skillPending = null;
    // Override size for top-down view
    if (mobaTeam) { this.w = 32; this.h = 32; }
    // Active melee hitbox: {x,y,w,h,owner,dmg,crit,pierce,life,hitTargets:Set,color,icon,...}
    this.activeHitbox=null;
  }
  getStat(stat){
    let v=this[stat]||0;
    for(const e of this.effects){if(e.stat===stat){if(e.multiplier)v=Math.round(v*e.multiplier);if(e.value!==undefined)v+=e.value;}}
    return v;
  }
  update(dt){
    if(this.stateTimer>0)this.stateTimer-=dt;else if(this.state!=='idle'){this.state='idle';this.animFrame=0;this.activeHitbox=null;}
    if(this.invincible>0)this.invincible-=dt;
    if(this.comboTimer>0){this.comboTimer-=dt;if(this.comboTimer<=0)this.comboCount=0;}
    for(const k in this.cooldowns){if(this.cooldowns[k]>0)this.cooldowns[k]-=dt;}
    for(let i=this.effects.length-1;i>=0;i--){this.effects[i].duration-=dt;if(this.effects[i].duration<=0)this.effects.splice(i,1);}
    if(this.stamina<this.maxStamina)this.stamina=Math.min(this.maxStamina,this.stamina+dt*0.025);
    if(this.mp<this.maxMp)this.mp=Math.min(this.maxMp,this.mp+dt*0.02);
    // MOBA mode: no gravity, top-down movement
    if(this.moba){
      this.grounded=true;
      // Growth system
      this.growthTimer+=dt;
      if(this.growthTimer>=this.growthInterval){
        this.growthTimer-=this.growthInterval;
        this.maxHp+=15;this.hp=Math.min(this.maxHp,this.hp+15);
        this.atk+=3;this.def+=1;
        this.respawnMax+=2000;
      }
      // Boundary: full MOBA map
      if(this.x<0){this.x=0;this.vx=0;}
      if(this.x+this.w>MOBA_MAP.width){this.x=MOBA_MAP.width-this.w;this.vx=0;}
      if(this.y<0){this.y=0;this.vy=0;}
      if(this.y+this.h>MOBA_MAP.height){this.y=MOBA_MAP.height-this.h;this.vy=0;}
      // Wall collisions
      for(const wall of MOBA_MAP.walls){
        if(G.rectCollide(this.x,this.y,this.w,this.h,wall.x,wall.y,wall.w,wall.h)){
          // Push out of wall based on overlap
          const ox=(this.x+this.w/2)-(wall.x+wall.w/2);
          const oy=(this.y+this.h/2)-(wall.y+wall.h/2);
          const overlapX=(this.w/2+wall.w/2)-Math.abs(ox);
          const overlapY=(this.h/2+wall.h/2)-Math.abs(oy);
          if(overlapX<overlapY){this.x+=ox>0?overlapX:-overlapX;this.vx=0;}
          else{this.y+=oy>0?overlapY:-overlapY;this.vy=0;}
        }
      }
    }
    const spd=this.getStat('spd');
    if(!this.grounded)this.vy+=0.8*(dt/16);
    if(this.moba){
      // MOBA mode: clean top-down movement using raw vx/vy (spd not multiplied)
      this.x+=this.vx*(dt/16);
      this.y+=this.vy*(dt/16);
    }else{
      this.x+=this.vx*spd*(dt/16);
      this.y+=this.vy*(dt/16);
      // Normal 2D mode: ground gravity snap
      if(this.y>=G.groundY){
        const wasAir=!this.grounded;this.y=G.groundY;this.vy=0;this.grounded=true;
        if(wasAir&&this===G.p1)G.playSfx('land');
      }
    }
    const arenaW=G.arenaW,arenaX=G.arenaX;
    if(!this.moba){
      if(this.x<arenaX){this.x=arenaX;this.vx=0;}if(this.x+this.w>arenaX+arenaW){this.x=arenaX+arenaW-this.w;this.vx=0;}
    }
    if(this.grounded&&this.state==='idle'&&!this.moba){this.vx*=0.85;}
    if(this.moba){/* movement speed handled by handleInput each frame */}
    if(Math.abs(this.vx)<0.1)this.vx=0;
    if(this.moba&&Math.abs(this.vy)<0.1)this.vy=0;
    if(Math.abs(this.vx)>0.5&&this.grounded)this.walkBob=(this.walkBob+dt*0.01)%(Math.PI*2);
    else this.walkBob*=0.9;
    // Footsteps (player only)
    if(Math.abs(this.vx)>0.5&&this.grounded&&this===G.p1){
      this.footstepTimer-=dt;if(this.footstepTimer<=0){this.footstepTimer=280;G.playSfx('footstep');}
    }else if(Math.abs(this.vx)<=0.5)this.footstepTimer=0;
    this.animTimer+=dt;if(this.animTimer>150){this.animTimer=0;this.animFrame=(this.animFrame+1)%4;}
    // Tick active hitbox
    if(this.activeHitbox){this.activeHitbox.life-=dt;if(this.activeHitbox.life<=0)this.activeHitbox=null;}
  }
  canAct(){return this.state==='idle'&&this.invincible<=0;}
  canUseSkill(s){return (this.cooldowns[s.id]||0)<=0&&(!s.cost||!s.cost.stamina||this.stamina>=s.cost.stamina)&&(!s.cost||!s.cost.mp||this.mp>=s.cost.mp);}
  getCD(s){return Math.max(0,Math.ceil((this.cooldowns[s.id]||0)/1000));}

  basicAttack(target){
    if(!this.canAct())return null;
    const dx=Math.abs(this.x+this.w/2-target.x-target.w/2);const dy=Math.abs(this.y+this.h/2-target.y-target.h/2);
    if(dx>75||dy>90)return null;
    this.state='attacking';this.stateTimer=260;this.animFrame=0;this.stamina=Math.max(0,this.stamina-10);
    let rawDmg=Math.round(this.getStat('atk')*1.0);
    // MOBA 暴击
    const ms=this.mobaStats||{};
    let isCrit=false;
    if(ms.crit>0&&Math.random()*100<ms.crit){isCrit=true;rawDmg=Math.round(rawDmg*(ms.critMult||1.5));}
    // MOBA 固定穿透
    if(ms.flatPen>0)rawDmg+=ms.flatPen;
    let finalDmg=Math.max(3,rawDmg-Math.round(target.getStat('def')*0.5));
    G.playSfx('attack',{fx:this.prof.fx});
    target.takeDamage(finalDmg,this);this.comboCount++;this.comboTimer=2500;
    // MOBA 吸血
    if(ms.lifeSteal>0&&target.hp>=0&&this.hp>0){const heal=Math.round(finalDmg*ms.lifeSteal/100);this.hp=Math.min(this.maxHp,this.hp+heal);if(heal>0&&this===G.p1)G.spawnHitEffect(this.x,this.y-30,'+'+heal,'#2ecc71');}
    // Basic attack particles
    const hx=target.x+target.w/2,hy=target.y+target.h/2;
    for(let i=0;i<5;i++){const angle=Math.random()*Math.PI*2;const spd=1+Math.random()*4;G.particles.push({x:hx,y:hy,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd-2,life:150+Math.random()*200,color:isCrit?'#ffd700':'#fff',size:(isCrit?2:1)+Math.random()*2,type:'spark'});}
    if(isCrit&&this===G.p1){G.addBattleLog('⚡ 暴击！造成 '+finalDmg+' 伤害');G.playSfx('hit',{dmg:50,crit:true});}
    return {dmg:finalDmg,crit:isCrit};
  }

  // useSkill creates hitbox for melee, projectile for ranged
  useSkill(skill,target){
    if(!this.canAct()||!this.canUseSkill(skill))return null;
    if(skill.cost){if(skill.cost.stamina)this.stamina-=skill.cost.stamina;if(skill.cost.mp)this.mp-=skill.cost.mp;}
    // MOBA 减CD：降低技能冷却
    let cd=skill.cd;
    if((this.mobaStats||{}).cdr>0)cd=Math.max(300,Math.round(cd/(1+(this.mobaStats.cdr))));
    this.cooldowns[skill.id]=cd;
    this.state='skill';this.stateTimer=skill.duration||380;this.animFrame=0;
    if(skill.self==='half_def')this.addEffect({name:'防御减半',duration:skill.sd,icon:'🔻',color:'#c0392b',stat:'def',multiplier:0.5});
    if(skill.self==='dodge_atk'){this.addEffect({name:'闪避',duration:skill.sd,icon:'🌫️',color:'#8e44ad',stat:'dodge',value:45});this.nextAtkBoost=true;}
    if(skill.shield)this.addEffect({name:'护盾',duration:skill.sd,icon:'🛡️',color:'#3498db',shield:skill.shield});
    if(skill.dash){
      if(G.mode==='moba'&&this.moba){
        const dirX=Math.cos(this.targetDir),dirY=Math.sin(this.targetDir);
        this.x+=dirX*skill.dash;this.y+=dirY*skill.dash;
      }else{
        this.x+=(this.faceRight?1:-1)*skill.dash;
      }
    }
    if(skill.heal){const amt=Math.round(this.maxHp*skill.heal);this.hp=Math.min(this.maxHp,this.hp+amt);}
    if(skill.selfDmg)this.hp-=skill.selfDmg;
    if(skill.selfDmgPct)this.hp-=Math.round(this.maxHp*skill.selfDmgPct);
    if(skill.buff==='atk_up'){if(target&&target!==this)target.addEffect({name:'攻击提升',duration:skill.bd,icon:'⬆️',color:'#ff69b4',stat:'atk',value:skill.bv});this.addEffect({name:'攻击提升',duration:skill.bd,icon:'⬆️',color:'#ff69b4',stat:'atk',value:skill.bv});}

    const result={skill:skill.id,name:skill.name,icon:skill.icon};

    if(skill.melee&&skill.range>0){
      // Create visible melee hitbox — damage applied when hitbox collides with target
      let hbX,hbY;
      if(G.mode==='moba'&&this.moba){
        // MOBA: hitbox in targetDir direction
        const dirX=Math.cos(this.targetDir),dirY=Math.sin(this.targetDir);
        hbX=this.x+this.w/2+dirX*skill.range/2-skill.range/2;
        hbY=this.y+this.h/2+dirY*skill.range/2-skill.width/2;
      }else{
        hbX=this.faceRight?this.x+this.w:this.x-skill.range;
        hbY=this.y+this.h/2-skill.width/2;
      }
      this.activeHitbox={x:hbX,y:hbY,w:skill.range,h:skill.width,owner:this,dmg:Math.round(this.getStat('atk')*skill.dmg),crit:skill.crit,pierce:skill.pierce||0,life:skill.duration||400,hitOnce:skill.hitOnce,hitTargets:new Set(),color:skill.color,icon:skill.icon,effect:skill.effect,ev:skill.ev,ed:skill.ed,effect2:skill.effect2,ev2:skill.ev2,ed2:skill.ed2,hits:skill.hits||1};
      // Skill use particles — unique per profession FX style
      const scx=this.x+this.w/2,scy=this.y+this.h/2;
      const fx=this.prof.fx||'slash';
      G.playSfx('skill',{fx});
      G.spawnSkillFX(fx,scx,scy,this.faceRight,skill.color,skill);
      // Small shockwave for impactful skills
      if(skill.dmg>=1.4)G.shockwaves.push({x:scx,y:scy,radius:5,maxRadius:skill.range*0.7,speed:14,color:skill.color,alpha:0.5});
    }else if(skill.proj&&skill.dmg>0&&target){
      G.playSfx('projectile',{fx:this.prof.fx||'magic'});
      G.spawnProjectile(this,target,skill);
    }
    return result;
  }

  takeDamage(dmg,attacker){
    if(this.invincible>0)return;
    // MOBA 护盾：优先吸收伤害
    const ms=this.mobaStats||{};
    if(ms.shield>0){
      const absorbed=Math.min(ms.shield,dmg);
      ms.shield-=absorbed;dmg-=absorbed;
      if(this===G.p1)G.spawnHitEffect(this.x,this.y-30,'-'+absorbed+' 🛡','#5dade2');
    }
    // MOBA 反伤：对攻击者反弹伤害（直接扣血避免递归）
    if(ms.thorns>0&&attacker&&attacker!==this&&attacker.hp>0&&dmg>0){
      const reflect=Math.max(1,Math.round(dmg*ms.thorns/100));
      attacker.hp=Math.max(0,attacker.hp-reflect);
      if(attacker===G.p1)G.spawnHitEffect(attacker.x,attacker.y-30,'荆棘反伤 '+reflect,'#27ae60');
      if(attacker.hp<=0&&attacker.lastAttacker!==undefined)attacker.lastAttacker=this;
    }
    // MOBA 闪避
    if(ms.dodge>0&&attacker&&attacker!==this&&attacker.hp>0){
      if(Math.random()*100<ms.dodge){this.invincible=120;if(this===G.p1)G.spawnHitEffect(this.x,this.y-30,'MISS','#fff');return;}
    }
    this.hp-=dmg;const dead=this.hp<=0;if(dead)this.hp=0;
    // 记录最近攻击者（用于击杀判定）
    if(attacker)this.lastAttacker=attacker;
    // 只有 Fighter 才做受击反馈（避免对塔/水晶/小兵等触发异常）
    if(this.state!==undefined&&this.prof!==undefined){
      G.playSfx('hit',{dmg,crit:dmg>40});
      if(dead)G.playSfx('death');
      this.state='hit';this.stateTimer=200;this.invincible=160;
      if(attacker){const dir=attacker.x<this.x?1:-1;this.vx=dir*7;this.vy=-4;this.grounded=false;}
    }
  }
  addEffect(e){this.effects=this.effects.filter(x=>x.name!==e.name);this.effects.push(e);}
  removeEffect(name){this.effects=this.effects.filter(e=>e.name!==name);}
}

const G={
  mode:null,
  // MOBA fields
  mobaTeams: { blue: { fighters: [], towers: [], crystal: null, alive: true }, red: { fighters: [], towers: [], crystal: null, alive: true } },
  mobaPlayersPerTeam: 2,
  minions: [],
  // 本局 MOBA 金币（只能用于本局商城，结束后清零，不可带出）

  // 本局商城状态
  mobaShopOpen: false,
  mobaBoughtItems: {}, // 已购买的道具（限购道具）
  mobaShopHover: -1,   // 鼠标悬停的道具索引
  mobaShopPage: 0,     // 商城当前页（每页12个道具）
  mobaShopHoverNav: -1, // 悬停的分页/分类按钮

  // 建筑警报全局冷却，防止刷屏
  structureAlertCooldown: 0,
  minionWaveTimer: 0,
  minionWaveInterval: 25000,
  minionWaveCount: 0,
  towerProjectiles: [],
  jungleMonsters: [], // 丛林野怪
  dragon: null,       // 巨龙
  camera: { x: 0, y: 0 }, // MOBA camera
  canvas:null,ctx:null,arenaX:50,arenaW:1100,groundY:620,
  p1:null,p2:null,battleActive:false,battleEnded:false,timer:99,
  particles:[],projectiles:[],hitEffects:[],battleLog:[],keys:{},keyPressed:{},
  gold:500,wins:0,losses:0,equipment:{},talents:{},
  bossCards:0,bossCardUses:0, // Boss体验卡
  selectedBossCard:null, // 选中的Boss卡角色
  playerProf:null,playerName:'',selectedOpp:null,selectedBoss:null,
  dp1prof:null,dp2prof:null,
  // Ultimate animation system
  ultimateAnim:null, // {caster,skill,phase,timer,maxTime,particles:[],rings:[]}
  screenShake:0,shakeX:0,shakeY:0,flashAlpha:0,flashColor:'#fff',
  shockwaves:[], // [{x,y,radius,maxRadius,speed,color,alpha}]
  screenFlash:0, // duration of full screen flash

  playSfx(type,params){if(AudioManager.enabled)AudioManager.playSfx(type,params);},
  toggleSfx(){const on=AudioManager.toggle();const btn=document.getElementById('sfx-toggle');btn.textContent=on?'🔊 音效':'🔇 静音';btn.style.color=on?'#5dade2':'#888';},
  init(){
    this.canvas=document.getElementById('battle-canvas');this.ctx=this.canvas.getContext('2d');this.resizeCanvas();
    window.addEventListener('resize',()=>this.resizeCanvas());
    // Initialize audio on first user interaction (click or keypress)
    const initAudio=()=>{AudioManager.init();document.removeEventListener('click',initAudio);document.removeEventListener('keydown',initAudio);};
    document.addEventListener('click',initAudio,{once:true});
    document.addEventListener('keydown',initAudio,{once:true});
    window.addEventListener('keydown',e=>{
      if(!this.keyPressed[e.code]){this.keyPressed[e.code]=true;this.keys[e.code]=true;}
      e.preventDefault();
    });
    window.addEventListener('keyup',e=>{this.keys[e.code]=false;this.keyPressed[e.code]=false;e.preventDefault();});
    // MOBA 本局商城的鼠标交互
    this.canvas.addEventListener('mousemove',e=>{
      if(!this.mobaShopOpen)return;
      const r=this.canvas.getBoundingClientRect();
      const mx=e.clientX-r.left,my=e.clientY-r.top;

    this.p2.w=64;this.p2.h=100;this.p2.x=this.arenaX+this.arenaW-180;
    this.p2.maxHp=bossData.hp;this.p2.hp=bossData.hp;this.p2.maxMp=200;this.p2.mp=200;this.p2.maxStamina=200;this.p2.stamina=200;
    this.bossData=bossData;
    this.startBattle('boss');
  },
  startBattle(mode){
    this.mode=mode;this.battleActive=true;this.battleEnded=false;this.timer=mode==='moba'?9999:(mode==='timeChallenge'?(this._timedBossData?this._timedBossData.timeLimit:30):(mode==='boss'?120:99));
    this.particles=[];this.projectiles=[];this.hitEffects=[];this.shockwaves=[];this.battleLog=[];
    // 本局 MOBA 金币：开局清零，结束时不带入全局金币
    if(mode==='moba'){this.mobaGold=0;this.mobaBoughtItems={};this.mobaShopPage=0;this.mobaShopCat='all';this.mobaShopOpen=false;this.mobaShopHover=-1;this.mobaShopHoverNav=-1;}
    this.ultimateAnim=null;this.screenShake=0;this.shakeX=0;this.shakeY=0;this.flashAlpha=0;this.screenFlash=0;
    this.p1.cooldowns={};this.p2.cooldowns={};this.p1.effects=[];this.p2.effects=[];this.p1.activeHitbox=null;this.p2.activeHitbox=null;
    this.switchScreen('hub');document.getElementById('hub-screen').style.display='none';
    this.canvas.classList.add('active');document.getElementById('battle-hud').classList.add('active');
    document.getElementById('battle-result-overlay').classList.remove('active');
    this.resizeCanvas();if(mode!=='moba'){this.p1.y=this.groundY;this.p2.y=this.groundY;}
    this.playSfx('battle_start');
    this.loop();
  },
  endBattle(winner){
    this.battleEnded=true;this.battleActive=false;
    const overlay=document.getElementById('battle-result-overlay');overlay.classList.add('active');
    let won=false,goldEarned=0;
    if((this.mode==='single'||this.mode==='bossCard')&&winner===this.p1){won=true;goldEarned=this.mode==='bossCard'&&this.bossData?this.bossData.gold:(AI_OPPS[this.selectedOpp||0]?AI_OPPS[this.selectedOpp||0].gold:300);this.wins++;this.gold+=goldEarned;}
    else if(this.mode==='single'||this.mode==='bossCard')this.losses++;
    else if(this.mode==='boss'&&winner===this.p1){won=true;goldEarned=this.bossData?this.bossData.gold:600;this.wins++;this.gold+=goldEarned;}
    else if(this.mode==='boss')this.losses++;
    else if(this.mode==='timeChallenge'&&winner===this.p1){won=true;goldEarned=this._timedBossData?this._timedBossData.gold:400;this.wins++;this.gold+=goldEarned;}
    else if(this.mode==='timeChallenge')this.losses++;
    else if(this.mode==='duo')won=winner===this.p1;
    else if(this.mode==='moba'){won=winner===this.p1;if(won)this.wins++;else this.losses++;goldEarned=0;} // 金币仅本局用，不结算为全局金币
    const name=winner?winner.name:'';
    this.playSfx(won?'victory':'defeat');
    // MOBA 对局结束：本局金币清零（不可带出）
    if(this.mode==='moba'){this.mobaGold=0;}
    overlay.innerHTML=`<div class="result-big ${won?'win':'lose'}">${won?'🏆 胜利！':'💀 败北...'}</div><div class="result-sub">${name} 获得胜利${(won&&goldEarned>0)?' | 💰 +'+goldEarned+' 金币':''}${this.mode==='bossCard'?`<br><span style="color:#ff6666;">Boss体验卡剩余: ${this.bossCards*2-this.bossCardUses}次</span>`:''}</div><button class="btn" onclick="G.returnFromBattle()">返回</button>`;
    this.saveGame();
  },
  returnFromBattle(){
    // 停止游戏循环与心跳，防止多次进出战斗导致循环叠加
    if(this._rafId)cancelAnimationFrame(this._rafId);
    if(this._heartbeat){clearInterval(this._heartbeat);this._heartbeat=null;}
    this._loopRunning=false;
    this.canvas.classList.remove('active');document.getElementById('battle-hud').classList.remove('active');
    document.getElementById('battle-result-overlay').classList.remove('active');
    document.getElementById('hub-screen').style.display='';this.battleActive=false;this.battleEnded=false;this.p1=null;this.p2=null;this.bossData=null;
    if(this.mode==='moba'){this.minions=[];this.towerProjectiles=[];this.jungleMonsters=[];this.dragon=null;this.mobaTeams.blue={fighters:[],towers:[],crystal:null,alive:true};this.mobaTeams.red={fighters:[],towers:[],crystal:null,alive:true};this.updateHubStats();this.renderHub('arena');this.resetHubNav();}
    else if(this.mode==='single'||this.mode==='boss'||this.mode==='bossCard'||this.mode==='timeChallenge'){this.updateHubStats();this.renderHub('arena');this.resetHubNav();}else this.toTitle();
  },

  loop(){
    // 稳健主循环：单帧异常不中断游戏，自动继续下一帧，避免“卡死就永远动不了”
    if(!this.battleActive){this.renderFrame();return;}
    this._lastTick=Date.now();
    try{this.update();}catch(e){this._loopError=e;this._loopErrorStack=e&&e.stack?String(e.stack):String(e);if(console&&console.warn)console.warn('update err',e);}
    try{this.renderFrame();}catch(e){this._loopError=e;this._loopErrorStack=e&&e.stack?String(e.stack):String(e);if(console&&console.warn)console.warn('render err',e);}
    // 主循环由 requestAnimationFrame 自链接驱动；同时用独立心跳兜底，
    // 一旦 RAF 因标签页后台/渲染异常长时间未回调，自动用定时器恢复，避免永久卡死。
    const self=this;
    const tick=()=>self.loop();
    if(window.requestAnimationFrame){
      this._rafId=requestAnimationFrame(tick);
      if(!this._heartbeat){
        this._heartbeat=setInterval(()=>{
          if(self.battleActive && (!self._lastTick || Date.now()-self._lastTick>500)){
            // RAF 长时间未回调：取消残留 RAF 并用定时器恢复循环（保持单实例）
            cancelAnimationFrame(self._rafId);
            setTimeout(tick,16);
          }
        },400);
      }
    }else{
      setTimeout(tick,16);
    }
  },

  update(){
    const dt=16;
    // MOBA mode update
    if(this.mode==='moba'){
      // E 键：打开/关闭本局商城
      if(this.keyPressed['KeyE']){
        this.keyPressed['KeyE']=false;
        this.mobaShopOpen=!this.mobaShopOpen;
        this.playSfx(this.mobaShopOpen?'ui_confirm':'ui_back');
      }
      // Player input (WASD move, G attack, I/K/L skills)
      if(this.p1&&this.p1.hp>0&&this.p1.respawnTimer<=0&&!this.mobaShopOpen){
        this.handleInput(this.p1,{left:'KeyA',right:'KeyD',up:'KeyW',down:'KeyS',jump:'Space',atk:'KeyG',skill1:'KeyI',skill2:'KeyK',ult:'KeyL'});
      }
      // Camera follow player (死亡时跟随存活的队友观战)
      let camTarget=null;
      if(this.p1&&this.p1.hp>0&&this.p1.respawnTimer<=0){
        camTarget=this.p1;
      }else if(this.p1&&this.p1.hp<=0){
        // 观战：跟随最近存活的蓝方队友
        for(const f of this.mobaTeams.blue.fighters){
          if(f.hp>0&&f.respawnTimer<=0){camTarget=f;break;}
        }
      }
      if(camTarget){
        this.camera.x+=(camTarget.x-600-this.camera.x)*0.1;
        this.camera.y+=(camTarget.y-400-this.camera.y)*0.1;
        this.camera.x=Math.max(0,Math.min(MOBA_MAP.width-1200,this.camera.x));
        this.camera.y=Math.max(0,Math.min(MOBA_MAP.height-800,this.camera.y));
      }
      this.updateTowers(dt);
      this.updateCrystalAttack(dt);
      // 建筑警告横幅计时
      for(let i=this.structureAlerts.length-1;i>=0;i--){this.structureAlerts[i].timer-=dt;if(this.structureAlerts[i].timer<=0)this.structureAlerts.splice(i,1);}
      this.updateRespawns(dt);
      this.updateMinions(dt);
      // 更新丛林野怪与巨龙
      for(const m of this.jungleMonsters)m.update(dt);
      if(this.dragon)this.dragon.update(dt);
      this.updateMobaAI(dt);
      this.updateMobaProjectiles(dt);
      this.checkMobaWin();
      // Update all fighters
      const allF=[...this.mobaTeams.blue.fighters,...this.mobaTeams.red.fighters];
      for(const f of allF)f.update(dt);
      // MOBA 商城被动效果（回血等）
      for(const f of allF){
        if(f.hp<=0||f.hp>=f.maxHp)continue;
        const ms=f.mobaStats||{};
        if(ms.regen>0){f.hp=Math.min(f.maxHp,f.hp+ms.regen*dt/1000);}
      }
      // MOBA: melee hitbox collision (hero skills hit enemies, minions, towers, crystal)
      for(const f of allF){
        if(f.hp<=0||!f.activeHitbox)continue;
        this.checkMobaHitbox(f);
      }
      // Update particles
      for(let i=this.particles.length-1;i>=0;i--){const p=this.particles[i];p.x+=p.vx*dt/16;p.y+=p.vy*dt/16;p.life-=dt;if(p.life<=0)this.particles.splice(i,1);}
      for(let i=this.hitEffects.length-1;i>=0;i--){this.hitEffects[i].life-=dt;this.hitEffects[i].y-=1.5*dt/16;if(this.hitEffects[i].life<=0)this.hitEffects.splice(i,1);}
      return;
    }
    // Screen shake decay
    if(this.screenShake>0){this.screenShake=Math.max(0,this.screenShake-dt*0.06);this.shakeX=(Math.random()-0.5)*this.screenShake*12;this.shakeY=(Math.random()-0.5)*this.screenShake*8;}
    if(this.flashAlpha>0)this.flashAlpha=Math.max(0,this.flashAlpha-dt*0.025);
    if(this.screenFlash>0)this.screenFlash=Math.max(0,this.screenFlash-dt);
    // Shockwaves
    for(let i=this.shockwaves.length-1;i>=0;i--){const sw=this.shockwaves[i];sw.radius+=sw.speed*dt/16;sw.alpha=Math.max(0,1-sw.radius/sw.maxRadius);if(sw.radius>=sw.maxRadius)this.shockwaves.splice(i,1);}
    // Ultimate animation - pause game logic
    if(this.ultimateAnim){
      this.ultimateAnim.timer-=dt;
      this.updateUltimateAnim(dt);
      if(this.ultimateAnim.timer<=0){this.ultimateAnim=null;}
      this.p1.update(dt);this.p2.update(dt);
      for(let i=this.particles.length-1;i>=0;i--){const p=this.particles[i];p.x+=p.vx*dt/16;p.y+=p.vy*dt/16;p.life-=dt;if(p.life<=0)this.particles.splice(i,1);}
      for(let i=this.hitEffects.length-1;i>=0;i--){this.hitEffects[i].life-=dt;this.hitEffects[i].y-=1.5*dt/16;if(this.hitEffects[i].life<=0)this.hitEffects.splice(i,1);}
      return;
    }
    if(!this.battleEnded){
      this.timer-=dt/1000;if(this.timer<=0){this.timer=0;this.endBattle(this.p1.hp>this.p2.hp?this.p1:this.p2);return;}
      this.processDoT(this.p1);this.processDoT(this.p2);
      if(this.p1.hp<=0){this.p1.hp=0;this.endBattle(this.p2);return;}
      if(this.p2.hp<=0){this.p2.hp=0;this.endBattle(this.p1);return;}
      // Input
      if(this.mode==='single'||this.mode==='bossCard'){this.handleInput(this.p1,{left:'KeyA',right:'KeyD',up:'KeyW',down:'KeyS',jump:'Space',atk:'KeyJ',skill1:'KeyI',skill2:'KeyK',ult:'KeyL'});this.updateSmartAI(this.p2,this.p1,false);}
      else if(this.mode==='boss'||this.mode==='timeChallenge'){this.handleInput(this.p1,{left:'KeyA',right:'KeyD',up:'KeyW',down:'KeyS',jump:'Space',atk:'KeyJ',skill1:'KeyI',skill2:'KeyK',ult:'KeyL'});this.updateSmartAI(this.p2,this.p1,true);}
      else{this.handleInput(this.p1,{left:'KeyA',right:'KeyD',up:'KeyW',down:'KeyS',jump:'Space',atk:'KeyJ',skill1:'KeyI',skill2:'KeyK',ult:'KeyL'});this.handleInput(this.p2,{left:'ArrowLeft',right:'ArrowRight',up:'ArrowUp',down:'ArrowDown',jump:'ShiftRight',atk:'Numpad1',skill1:'Numpad2',skill2:'Numpad3',ult:'Numpad0'});}
      // Check melee hitbox collisions
      this.checkHitboxCollision(this.p1,this.p2);
      this.checkHitboxCollision(this.p2,this.p1);
    }
    this.p1.update(dt);this.p2.update(dt);
    // Projectiles
    for(let i=this.projectiles.length-1;i>=0;i--){const p=this.projectiles[i];p.x+=p.vx*dt/16;p.y+=p.vy*dt/16;p.life-=dt;const target=p.owner===this.p1?this.p2:this.p1;if(target&&this.rectCollide(p.x,p.y,p.w||20,p.h||20,target.x,target.y,target.w,target.h)){let dmg=p.dmg;if(p.crit&&Math.random()<0.5)dmg=Math.round(dmg*1.8);dmg=Math.max(3,dmg-Math.round(target.getStat('def')*0.5));if(dmg>0)target.takeDamage(dmg,this.p1);this.spawnHitEffect(target.x+target.w/2,target.y+target.h/2,dmg);this.playSfx('projectile_hit',{big:p.big});
      // Projectile impact explosion
      for(let j=0;j<20;j++){const angle=Math.random()*Math.PI*2;const spd=2+Math.random()*9;this.particles.push({x:p.x,y:p.y,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd,life:200+Math.random()*400,color:p.color||'#ffaa00',size:1+Math.random()*5,type:'burst'});}
      if(p.big)this.shockwaves.push({x:p.x,y:p.y,radius:5,maxRadius:200,speed:20,color:p.color||'#ff4400',alpha:0.8});
      // Ultimate projectile impact
      if(p.big&&p.dmg>50){const bs=(this.mode==='boss'&&p.owner===this.p2&&this.bossData)?this.bossData.bossStyle:null;this.playSfx('ultimate_impact',{fx:p.owner.prof.fx,bossStyle:bs});}
      this.projectiles.splice(i,1);continue;}if(p.life<=0||p.x<this.arenaX||p.x>this.arenaX+this.arenaW){this.projectiles.splice(i,1);}}
    for(let i=this.particles.length-1;i>=0;i--){const p=this.particles[i];p.x+=p.vx*dt/16;p.y+=p.vy*dt/16;p.life-=dt;if(p.life<=0)this.particles.splice(i,1);}
    for(let i=this.hitEffects.length-1;i>=0;i--){this.hitEffects[i].life-=dt;this.hitEffects[i].y-=1.5*dt/16;if(this.hitEffects[i].life<=0)this.hitEffects.splice(i,1);}
    if(this.p1.canAct()&&this.p2.canAct()){this.p1.faceRight=this.p1.x<this.p2.x;this.p2.faceRight=this.p2.x<this.p1.x;}
  },

  checkHitboxCollision(attacker,target){
    const hb=attacker.activeHitbox;if(!hb||hb.life<=0)return;
    if(!this.rectCollide(hb.x,hb.y,hb.w,hb.h,target.x,target.y,target.w,target.h))return;
    if(hb.hitOnce&&hb.hitTargets.has(target))return;
    hb.hitTargets.add(target);
    // Apply damage
    let rawDmg=hb.dmg;
    if(hb.pierce){const d=target.getStat('def');rawDmg=Math.round(rawDmg-d*0.5*(1-hb.pierce));}
    const dodgeEff=target.effects.find(e=>e.stat==='dodge');
    if(dodgeEff&&Math.random()*100<dodgeEff.value){this.spawnHitEffect(target.x+target.w/2,target.y+target.h/2,0,'#aaa');this.addBattleLog(target.name+' 闪避！');this.playSfx('dodge');return;}
    if(hb.crit&&Math.random()<0.5)rawDmg=Math.round(rawDmg*1.8);
    if(attacker.nextAtkBoost){rawDmg=Math.round(rawDmg*1.5);attacker.nextAtkBoost=false;}
    let finalDmg=Math.max(3,rawDmg-Math.round(target.getStat('def')*0.5));
    const shieldEff=target.effects.find(e=>e.name==='护盾');
    if(shieldEff&&finalDmg>0){if(shieldEff.shield>=finalDmg){shieldEff.shield-=finalDmg;finalDmg=0;if(shieldEff.shield<=0)target.removeEffect('护盾');}else{finalDmg-=shieldEff.shield;target.removeEffect('护盾');}}
    if(finalDmg>0){target.takeDamage(finalDmg,attacker);this.spawnHitEffect(target.x+target.w/2,target.y+target.h/2,finalDmg);this.addBattleLog(attacker.name+' '+hb.icon+' 命中 '+finalDmg+'伤害');
      // Ultimate impact sound
      if(hb.dmg>=attacker.getStat('atk')*2.0){const bs=(this.mode==='boss'&&attacker===this.p2&&this.bossData)?this.bossData.bossStyle:null;this.playSfx('ultimate_impact',{fx:attacker.prof.fx,bossStyle:bs});}
      // Extra hit particles
      const hx=target.x+target.w/2,hy=target.y+target.h/2;
      for(let i=0;i<12;i++){const angle=Math.random()*Math.PI*2;const spd=2+Math.random()*8;this.particles.push({x:hx,y:hy,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd-3,life:250+Math.random()*400,color:hb.color,size:1+Math.random()*4,type:'spark'});}
      // Shockwave on big hits
      if(finalDmg>30)this.shockwaves.push({x:hx,y:hy,radius:5,maxRadius:80+finalDmg,speed:12,color:hb.color,alpha:0.7});
    }
    // Debuffs
    if(hb.effect==='atk_down')target.addEffect({name:'攻击降低',duration:hb.ed,icon:'🔻',color:'#c0392b',stat:'atk',value:-hb.ev});
    if(hb.effect==='spd_down')target.addEffect({name:'速度降低',duration:hb.ed,icon:'🐌',color:'#2980b9',stat:'spd',value:-hb.ev});
    if(hb.effect==='poison')target.addEffect({name:'中毒',duration:hb.ed,icon:'☠️',color:'#8e44ad',dot:hb.ev});
    if(hb.effect==='bleed')target.addEffect({name:'流血',duration:hb.ed,icon:'🩸',color:'#c0392b',dot:hb.ev});
    if(hb.effect==='def_down')target.addEffect({name:'防御降低',duration:hb.ed,icon:'🔻',color:'#8e44ad',stat:'def',value:-hb.ev});
    if(hb.effect2==='def_down')target.addEffect({name:'防御降低',duration:hb.ed2,icon:'🔻',color:'#8e44ad',stat:'def',value:-hb.ev2});
    attacker.comboCount++;attacker.comboTimer=2500;
    // Multi-hit via hits
    if(hb.hits>1){for(let h=1;h<hb.hits;h++){let hdmg=Math.max(3,Math.round(attacker.getStat('atk')*(hb.dmg/attacker.getStat('atk')))-Math.round(target.getStat('def')*0.5));target.takeDamage(hdmg,attacker);this.spawnHitEffect(target.x+target.w/2,target.y+target.h/2,hdmg);}}
  },
  // MOBA 模式近战技能 hitbox 碰撞检测（可攻击英雄/小兵/塔/水晶）
  checkMobaHitbox(attacker){
    const hb=attacker.activeHitbox;if(!hb||hb.life<=0)return;
    if(!hb.hitTargets)hb.hitTargets=new Set();
    const enemyTeam=attacker.team==='blue'?'red':'blue';
    // 候选目标
    const candidates=[];
    for(const m of this.minions)if(m.team===attacker.team){continue;}else candidates.push(m);
    // 敌方英雄
    for(const e of this.mobaTeams[enemyTeam].fighters)if(e.hp>0)candidates.push(e);
    // 敌方塔
    for(const t of this.mobaTeams[enemyTeam].towers)if(t.alive)candidates.push(t);
    // 敌方水晶
    const ec=this.mobaTeams[enemyTeam].crystal;
    if(ec&&ec.alive&&!ec.invincible)candidates.push(ec);
    // 野怪与龙（中立，可被任意英雄近战技能攻击）
    for(const m of this.jungleMonsters)if(m.hp>0&&m.respawnTimer<=0)candidates.push(m);
    if(this.dragon&&this.dragon.alive)candidates.push(this.dragon);
    for(const target of candidates){
      if(target.hp<=0)continue;
      if(hb.hitOnce&&hb.hitTargets.has(target))continue;
      const tx=target.x+(target.w||16)/2,ty=target.y+(target.h||16)/2;
      if(!this.rectCollide(hb.x,hb.y,hb.w,hb.h,target.x,target.y,target.w||16,target.h||16))continue;
      hb.hitTargets.add(target);
      let rawDmg=hb.dmg;
      if(hb.pierce){const d=target.getStat?target.getStat('def'):0;rawDmg=Math.round(rawDmg-d*0.5*(1-hb.pierce));}
      if(hb.crit&&Math.random()<0.5)rawDmg=Math.round(rawDmg*1.8);
      // MOBA 商城暴击
      const ams=attacker.mobaStats||{};
      let skillCrit=false;
      if(ams.crit>0&&Math.random()*100<ams.crit){skillCrit=true;rawDmg=Math.round(rawDmg*(ams.critMult||1.5));}
      if(ams.flatPen>0)rawDmg+=ams.flatPen;
      if(attacker.nextAtkBoost){rawDmg=Math.round(rawDmg*1.5);attacker.nextAtkBoost=false;}
      let finalDmg=Math.max(3,rawDmg-Math.round((target.getStat?target.getStat('def'):0)*0.5));
      // 塔/水晶减伤
      if(target.team!==undefined&&target.laneName!==undefined)finalDmg=Math.max(1,Math.round(finalDmg*0.5));
      if(finalDmg>0){
        if(target.takeDamage)target.takeDamage(finalDmg,attacker);
        this.spawnHitEffect(tx,ty,finalDmg,hb.color);
        // MOBA 商城吸血（技能命中回血）
        if(ams.lifeSteal>0&&attacker.hp>0){const heal=Math.round(finalDmg*ams.lifeSteal/100);attacker.hp=Math.min(attacker.maxHp,attacker.hp+heal);}
        if(skillCrit&&attacker===this.p1){this.addBattleLog('⚡ 技能暴击！'+finalDmg+'伤害');}
        if(attacker===this.p1)this.addBattleLog(attacker.name+' '+hb.icon+' 命中 '+finalDmg+'伤害');
      }
      // 对英雄目标应用减益/多段
      if(target.effects&&target.team){
        if(hb.effect==='atk_down')target.addEffect({name:'攻击降低',duration:hb.ed,icon:'🔻',color:'#c0392b',stat:'atk',value:-hb.ev});
        if(hb.effect==='poison')target.addEffect({name:'中毒',duration:hb.ed,icon:'☠️',color:'#8e44ad',dot:hb.ev});
        if(hb.effect==='bleed')target.addEffect({name:'流血',duration:hb.ed,icon:'🩸',color:'#c0392b',dot:hb.ev});
        if(hb.effect==='def_down')target.addEffect({name:'防御降低',duration:hb.ed,icon:'🔻',color:'#8e44ad',stat:'def',value:-hb.ev});
      }
      if(hb.hits>1&&target.takeDamage){
        for(let h=1;h<hb.hits;h++){
          let hdmg=Math.max(3,Math.round(attacker.getStat('atk')*(hb.dmg/attacker.getStat('atk')))-Math.round((target.getStat?target.getStat('def'):0)*0.5));
          target.takeDamage(hdmg,attacker);this.spawnHitEffect(tx,ty,hdmg,hb.color);
        }
      }
    }
  },

  handleInput(fighter,keys){
    // === MOBA MODE: full directional movement + skill preview ===
    if(G.mode==='moba'&&fighter.moba&&fighter===G.p1){
      if(fighter.state==='hit'||fighter.state==='dead'){fighter.skillPreview=null;fighter.skillPending=null;return;}
      let mx=0,my=0;
      if(G.keys[keys.up])my-=1;
      if(G.keys[keys.down])my+=1;
      if(G.keys[keys.left])mx-=1;
      if(G.keys[keys.right])mx+=1;
      if(mx!==0||my!==0){
        const len=Math.sqrt(mx*mx+my*my);
        fighter.vx=mx/len*MOBA_MOVE_SPEED;fighter.vy=my/len*MOBA_MOVE_SPEED;
        fighter.targetDir=Math.atan2(my,mx);
        if(fighter.state==='idle')fighter.faceRight=mx>=0;
      }else{fighter.vx*=0.85;fighter.vy*=0.85;}
      // Skill system: press to preview, release to fire
      const skillKeys=[keys.skill1,keys.skill2,keys.ult];
      for(let si=0;si<3;si++){
        const sk=fighter.prof.skills[si];
        const keyDown=G.keys[skillKeys[si]];
        // While holding: update preview position continuously
        if(keyDown&&fighter.canAct()&&fighter.canUseSkill(sk)){
          if(fighter.skillPending!==si){
            fighter.skillPending=si;
            G.playSfx('ui_click');
          }
          const dirX=Math.cos(fighter.targetDir),dirY=Math.sin(fighter.targetDir);
          const rng=sk.range||120,wid=sk.width||80;
          const px=fighter.x+fighter.w/2+dirX*rng/2;
          const py=fighter.y+fighter.h/2+dirY*rng/2;
          fighter.skillPreview={skill:sk,skillIndex:si,x:px-rng/2,y:py-wid/2,w:rng,h:wid,color:sk.color};
        }
        // Release: fire skill
        if(!keyDown&&fighter.skillPending===si){
          fighter.skillPreview=null;fighter.skillPending=null;
          // For projectile skills: always fire in targetDir direction
          // For melee skills: check if enemies are in preview range
          if(sk.proj){
            // Projectile: fire towards targetDir (create a fake target in that direction)
            const dirX=Math.cos(fighter.targetDir),dirY=Math.sin(fighter.targetDir);
            const fakeTarget={x:fighter.x+dirX*400,y:fighter.y+dirY*400,w:10,h:10,getStat:s=>10};
            const r=fighter.useSkill(sk,fakeTarget);
            if(r){G.addBattleLog(fighter.name+' '+sk.icon+sk.name);}
          }else{
            // Melee: find targets in preview
            const target=G.findTargetInPreview(fighter,sk);
            const r=fighter.useSkill(sk,target);
            if(r){
              if(si===2){G.playSfx('ultimate',{fx:fighter.prof.fx});}
              G.addBattleLog(fighter.name+' '+sk.icon+sk.name);
            }
          }
        }
      }
      // Basic attack (G key) — 支持攻速
      // 注意：handleInput 是独立方法，访问不到 update() 的局部变量 dt，这里用固定帧时长 16ms
      if(fighter.atkTimer>0)fighter.atkTimer-=16;
      if(G.keyPressed[keys.atk]&&fighter.canAct()&&fighter.atkTimer<=0){
        G.keyPressed[keys.atk]=false;
        // 优先攻击最近的目标（英雄/小兵/防御塔/水晶）
        const target=G.findNearestMobaEnemy(fighter,80);
        if(target){const r=fighter.basicAttack(target);if(r)G.addBattleLog(fighter.name+' 攻击 '+r.dmg+'伤害');}
        // 攻速：基础 480ms，每点攻速% 减少
        const ms=fighter.mobaStats||{};
        const baseCD=480,cd=Math.max(120,baseCD/(1+(ms.atkSpeed||0)));
        fighter.atkTimer=cd;
      }
      return;
    }
    if(!fighter.canAct()&&fighter.state!=='idle')return;
    if(fighter.state==='hit'||fighter.state==='knocked')return;
    let moving=false;
    if(this.keys[keys.left]){fighter.vx=-4;moving=true;if(fighter.state==='idle')fighter.faceRight=false;}
    if(this.keys[keys.right]){fighter.vx=4;moving=true;if(fighter.state==='idle')fighter.faceRight=true;}
    if(!moving&&fighter.grounded)fighter.vx*=0.85;
    if(this.keyPressed[keys.jump]&&fighter.grounded&&fighter.canAct()){fighter.vy=-13;fighter.grounded=false;this.keyPressed[keys.jump]=false;this.playSfx('jump');}
    // Basic attack
    if(this.keyPressed[keys.atk]&&fighter.canAct()){this.keyPressed[keys.atk]=false;const target=fighter===this.p1?this.p2:this.p1;const r=fighter.basicAttack(target);if(r)this.addBattleLog(fighter.name+' 普攻 '+r.dmg+'伤害');}
    // Skill 1 (I)
    if(this.keyPressed[keys.skill1]&&fighter.canAct()){this.keyPressed[keys.skill1]=false;const skill=fighter.prof.skills[0];if(fighter.canUseSkill(skill)){const target=fighter===this.p1?this.p2:this.p1;const r=fighter.useSkill(skill,target);if(r)this.addBattleLog(fighter.name+' '+skill.icon+skill.name+(skill.melee?' [近战特效]':' [远程]'));else this.addBattleLog(fighter.name+' 冷却中('+fighter.getCD(skill)+'s)');}}
    // Skill 2 (K)
    if(this.keyPressed[keys.skill2]&&fighter.canAct()){this.keyPressed[keys.skill2]=false;const skill=fighter.prof.skills[1];if(fighter.canUseSkill(skill)){const target=fighter===this.p1?this.p2:this.p1;const r=fighter.useSkill(skill,target);if(r)this.addBattleLog(fighter.name+' '+skill.icon+skill.name+(skill.melee?' [近战特效]':' [远程]'));else this.addBattleLog(fighter.name+' 冷却中('+fighter.getCD(skill)+'s)');}}
    // Ultimate (L) - triggers full screen animation
    if(this.keyPressed[keys.ult]&&fighter.canAct()){this.keyPressed[keys.ult]=false;const skill=fighter.prof.skills[2];if(fighter.canUseSkill(skill)){const target=fighter===this.p1?this.p2:this.p1;fighter.useSkill(skill,target);const bs=(this.mode==='boss'&&fighter===this.p2&&this.bossData)?this.bossData.bossStyle:null;this.playSfx('ultimate',{fx:fighter.prof.fx,bossStyle:bs});this.triggerUltimateAnim(fighter,skill);}else this.addBattleLog(fighter.name+' 大招冷却中('+fighter.getCD(skill)+'s)');}
  },

  updateAI(ai,target){
    if(!ai.canAct()||ai.state!=='idle')return;
    ai.aiTimer--;if(ai.aiTimer>0)return;
    ai.aiTimer=8+Math.floor(Math.random()*14);
    const dx=target.x-ai.x;const dist=Math.abs(dx);ai.faceRight=dx>0;
    const roll=Math.random();
    if(dist<70&&roll<0.35){const r=ai.basicAttack(target);if(r)this.addBattleLog(ai.name+' 攻击 '+r.dmg+'伤害');}
    else if(dist<130&&roll<0.2){const s=ai.prof.skills[0];if(ai.canUseSkill(s)){ai.useSkill(s,target);this.addBattleLog(ai.name+' '+s.icon+s.name);}}
    else if(dist<150&&roll<0.18){const s=ai.prof.skills[1];if(ai.canUseSkill(s)){ai.useSkill(s,target);this.addBattleLog(ai.name+' '+s.icon+s.name);}}
    else if(roll<0.1){const s=ai.prof.skills[2];if(ai.canUseSkill(s)){ai.useSkill(s,target);this.triggerUltimateAnim(ai,s);}}
    else{if(dist>110)ai.vx=(dx>0?1:-1)*4;else if(dist<45)ai.vx=(dx>0?-1:1)*3;else ai.vx=(Math.random()-0.5)*3;if(roll<0.1&&ai.grounded){ai.vy=-12;ai.grounded=false;}}
  },

  // Boss AI - more aggressive, uses skills more often
  updateBossAI(ai,target){
    if(!ai.canAct()||ai.state!=='idle')return;
    ai.aiTimer--;if(ai.aiTimer>0)return;
    ai.aiTimer=5+Math.floor(Math.random()*8);
    const dx=target.x-ai.x;const dist=Math.abs(dx);ai.faceRight=dx>0;
    const roll=Math.random();
    // Boss is more aggressive with skills
    if(dist<100&&roll<0.25){const r=ai.basicAttack(target);if(r)this.addBattleLog(ai.name+' 攻击 '+r.dmg+'伤害');}
    else if(roll<0.28){const s=ai.prof.skills[0];if(ai.canUseSkill(s)){ai.useSkill(s,target);this.addBattleLog(ai.name+' '+s.icon+s.name);}}
    else if(roll<0.22){const s=ai.prof.skills[1];if(ai.canUseSkill(s)){ai.useSkill(s,target);this.addBattleLog(ai.name+' '+s.icon+s.name);}}
    else if(roll<0.14){const s=ai.prof.skills[2];if(ai.canUseSkill(s)){ai.useSkill(s,target);this.triggerUltimateAnim(ai,s);}}
    else{if(dist>130)ai.vx=(dx>0?1:-1)*3.5;else if(dist<50)ai.vx=(dx>0?-1:1)*2.5;else ai.vx=(Math.random()-0.5)*2;if(roll<0.12&&ai.grounded){ai.vy=-11;ai.grounded=false;}}
  },

  updateSmartAI(ai,target,isBoss){
    if(!ai.canAct()||ai.state!=='idle')return;
    ai.aiTimer--;
    if(ai.aiTimer>0)return;
    ai.aiTimer=isBoss?(4+Math.floor(Math.random()*6)):(6+Math.floor(Math.random()*10));
    const dx=(target.x+(target.w||0)/2)-(ai.x+ai.w/2);
    const dy=(target.y+(target.h||0)/2)-(ai.y+ai.h/2);
    const dist=Math.sqrt(dx*dx+dy*dy);
    ai.faceRight=dx>0;
    if(this.mode==='moba'&&ai.moba)ai.targetDir=Math.atan2(dy,dx);
    const hpPct=ai.hp/ai.maxHp;
    const targetHpPct=(target.hp||target.maxHp)/(target.maxHp||1);
    const roll=Math.random();
    // 1. Low HP retreat（MOBA：若敌方目标更残，尝试拼一波再撤；否则果断撤退）
    if(hpPct<0.2&&dist<200){
      const targetLow=targetHpPct<0.15; // 敌方快死了
      // MOBA 下若敌方可一击击杀则继续打，否则撤退
      if(this.mode==='moba'&&targetLow){
        const r=ai.basicAttack(target);
        if(r){this.addBattleLog(ai.name+' 追击 '+target.name);return;}
        // 打不死就继续贴脸攻击
        const dxb=target.x-ai.x,dyb=target.y-ai.y;const dl=Math.sqrt(dxb*dxb+dyb*dyb)||1;
        ai.vx=dxb/dl*MOBA_MOVE_SPEED;ai.vy=dyb/dl*MOBA_MOVE_SPEED;
        return;
      }
      if(this.mode==='moba'){
        const baseX=ai.team==='blue'?MOBA_MAP.baseBlue.x:MOBA_MAP.baseRed.x;
        const baseY=ai.team==='blue'?MOBA_MAP.baseBlue.y:MOBA_MAP.baseRed.y;
        const dxb=baseX-ai.x,dyb=baseY-ai.y;
        const dlen=Math.sqrt(dxb*dxb+dyb*dyb)||1;
        ai.vx=dxb/dlen*MOBA_MOVE_SPEED;ai.vy=dyb/dlen*MOBA_MOVE_SPEED;
      }else{ai.vx=(dx>0?-1:1)*3.5;}
      return;
    }
    // 2. Ultimate usage (greatly increased probability)
    const ult=ai.prof.skills[2];
    if(ai.canUseSkill(ult)){
      const ultThreshold=isBoss?0.35:0.30;
      const desperateUlt=hpPct<ultThreshold;
      const executeUlt=targetHpPct<0.30&&dist<250;
      const aggressiveUlt=targetHpPct>0.70&&dist<180&&roll<0.20;
      const randomUlt=roll<(isBoss?0.22:0.18);
      if(desperateUlt||executeUlt||aggressiveUlt||randomUlt){
        ai.useSkill(ult,target);
        if(this.mode!=='moba')this.triggerUltimateAnim(ai,ult);
        const bs=(this.mode==='boss'&&ai===this.p2&&this.bossData)?this.bossData.bossStyle:null;
        this.playSfx('ultimate',{fx:ai.prof.fx,bossStyle:bs});
        this.addBattleLog(ai.name+' '+ult.icon+ult.name+' (大招!)');
        return;
      }
    }
    // 3. Skill 2
    const s2=ai.prof.skills[1];
    if(ai.canUseSkill(s2)){
      const s2Range=s2.range||(s2.proj?300:150);
      if(dist<s2Range&&roll<(isBoss?0.35:0.25)){
        ai.useSkill(s2,target);
        this.playSfx('skill',{fx:ai.prof.fx});
        this.addBattleLog(ai.name+' '+s2.icon+s2.name);
        return;
      }
    }
    // 4. Skill 1
    const s1=ai.prof.skills[0];
    if(ai.canUseSkill(s1)){
      const s1Range=s1.range||(s1.proj?300:120);
      if(dist<s1Range&&roll<(isBoss?0.40:0.30)){
        ai.useSkill(s1,target);
        this.playSfx('skill',{fx:ai.prof.fx});
        this.addBattleLog(ai.name+' '+s1.icon+s1.name);
        return;
      }
    }
    // 5. Basic attack
    if(dist<75&&roll<0.40){
      const r=ai.basicAttack(target);
      if(r)this.addBattleLog(ai.name+' 攻击 '+r.dmg+'伤害');
      return;
    }
    // 6. Movement
    if(this.mode==='moba'&&ai.moba){
      if(dist>100){ai.vx=(dx/dist)*MOBA_MOVE_SPEED;ai.vy=(dy/dist)*MOBA_MOVE_SPEED;}
      else if(dist<50){ai.vx=-(dx/dist)*MOBA_MOVE_SPEED;ai.vy=-(dy/dist)*MOBA_MOVE_SPEED;}
      else{ai.vx=(Math.random()-0.5)*2;ai.vy=(Math.random()-0.5)*2;}
    }else{
      if(dist>110)ai.vx=(dx>0?1:-1)*3.5;
      else if(dist<45)ai.vx=(dx>0?-1:1)*2.5;
      else ai.vx=(Math.random()-0.5)*2;
      if(roll<0.1&&ai.grounded){ai.vy=-11;ai.grounded=false;}
    }
    // Boss berserk
    if(isBoss&&hpPct<0.5&&!ai.effects.find(e=>e.name==='狂暴')){
      ai.addEffect({name:'狂暴',duration:5000,icon:'😡',color:'#ff0000',stat:'atk',value:15});
      this.addBattleLog(ai.name+' 进入狂暴状态！');
    }
  },

  processDoT(f){for(const e of f.effects){if(e.dot){f.hp-=e.dot;this.spawnHitEffect(f.x+f.w/2,f.y+20,e.dot,'#8e44ad');}}},
  spawnHitEffect(x,y,dmg,color){
    this.hitEffects.push({x,y,dmg,color:color||'#e74c3c',life:800});
    // Mini particles on hit
    for(let i=0;i<8;i++){
      const angle=Math.random()*Math.PI*2;const spd=1+Math.random()*5;
      this.particles.push({x,y,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd-2,life:200+Math.random()*300,color:color||'#e74c3c',size:1+Math.random()*3,type:'spark'});
    }
    // Mini screen shake on big hits
    if(dmg>20)this.screenShake=Math.max(this.screenShake,0.2);
    if(dmg>40)this.screenShake=Math.max(this.screenShake,0.4);
    if(dmg>60)this.screenShake=Math.max(this.screenShake,0.6);
  },

  // ============ PROFESSION-SPECIFIC FX SYSTEM ============
  // Each profession has unique particle shapes, hit effects, and skill visuals
  spawnSkillFX(fx,x,y,faceRight,color,skill){
    const dir=faceRight?1:-1;
    switch(fx){
      case 'slash': // Warrior — crescent slashes, metallic sparks
        for(let i=0;i<18;i++){
          const angle=(faceRight?-0.6:Math.PI-0.6)+Math.random()*1.2;
          const spd=4+Math.random()*10;
          this.particles.push({x:x+Math.cos(angle)*15,y:y+Math.sin(angle)*15,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd,life:200+Math.random()*400,color:color,size:2+Math.random()*3,type:'line',angle});
        }
        // Arc slash lines
        for(let i=0;i<5;i++){
          this.particles.push({x:x+dir*10,y:y-10+i*12,vx:dir*(4+Math.random()*8),vy:(Math.random()-0.5)*3,life:250+Math.random()*300,color:'#fff',size:1+Math.random()*2,type:'spark'});

          }

        break;
      case 'rage': // Berserker — blood splatter, red shockwaves
