  // ============ ULTIMATE ANIMATION SYSTEM ============
  triggerUltimateAnim(caster,skill){
    this.ultimateAnim={caster,skill,timer:skill.animDuration||1400,maxTime:skill.animDuration||1400,phase:0};
    this.screenShake=1.0;this.flashAlpha=0.7;this.flashColor=skill.color||'#fff';this.screenFlash=300;
    // Spawn initial burst particles — use profession FX style
    const cx=caster.x+caster.w/2,cy=caster.y+caster.h/2;
    const fx=caster.prof.fx||'slash';
    this.spawnUltimateFX(fx,cx,cy,skill.color,60);
    // Special: Dragoon "Dragon God" — spawn a dragon flying across the screen
    if(caster.prof.fx==='pierce'&&skill.id==='d_dragon'){
      const dir=caster.faceRight?1:-1;
      const dragonStartX=cx-dir*200,dragonEndX=cx+dir*this.arenaW;
      // Dragon body segments — stored for rendering in updateUltimateAnim
      this.ultimateAnim.dragonData={startX:dragonStartX,endX:dragonEndX,cy:cy,color:skill.color,dir:dir};
    }
    // Shockwave
    this.shockwaves.push({x:cx,y:cy,radius:5,maxRadius:350,speed:18,color:skill.color,alpha:1});
    // Delayed second shockwave
    setTimeout(()=>{if(this.ultimateAnim)this.shockwaves.push({x:cx,y:cy,radius:5,maxRadius:280,speed:22,color:'#fff',alpha:0.8});},200);
    // Add battle log
    this.addBattleLog('⚡ '+caster.name+' 释放终极奥义 —— '+skill.icon+' '+skill.name+'！！');
  },
  spawnUltimateFX(fx,cx,cy,color,count){
    // Reuse spawnSkillFX logic but with bigger scale for ultimate
    for(let i=0;i<count;i++){
      const angle=Math.random()*Math.PI*2;const spd=5+Math.random()*16;
      let type='spark',size=2+Math.random()*6;
      switch(fx){
        case 'slash':type='line';size=3+Math.random()*4;break;
        case 'magic':type=i%3===0?'orb':'spark';size=3+Math.random()*6;break;
        case 'arrow':type='streak';size=2+Math.random()*3;break;
        case 'holy':type='rise';size=2+Math.random()*5;break;
        case 'shadow':type=i%2===0?'smoke':'spark';size=2+Math.random()*5;break;
        case 'fist':type='spark';size=2+Math.random()*4;break;
        case 'rage':type='splatter';size=3+Math.random()*6;break;
        case 'dark':type='orb';size=3+Math.random()*5;break;
        case 'pierce':type='streak';size=2+Math.random()*3;break;
        case 'music':type='note';size=2+Math.random()*5;break;
        case 'blood':type=i%2===0?'splatter':'bat';size=3+Math.random()*5;break;
        case 'elemental':type='orb';size=3+Math.random()*6;break;
        case 'ninja':type=i%3===0?'streak':'smoke';size=2+Math.random()*3;break;
        default:type='spark';size=2+Math.random()*5;
      }
      this.particles.push({x:cx,y:cy,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd,life:600+Math.random()*800,color:color,size,type});
    }
  },
  updateUltimateAnim(dt){
    const ua=this.ultimateAnim;const caster=ua.caster;const cx=caster.x+caster.w/2,cy=caster.y+caster.h/2;
    const progress=1-(ua.timer/ua.maxTime);
    const fx=caster.prof.fx||'slash';
    // Phase 0 (0-30%): energy gathering
    if(progress<0.3){
      if(Math.random()<0.7){
        const angle=Math.random()*Math.PI*2;const dist=30+Math.random()*60;
        let type='rise';
        if(fx==='shadow')type='smoke';else if(fx==='dark')type='orb';else if(fx==='music')type='note';
        this.particles.push({x:cx+Math.cos(angle)*dist,y:cy+Math.sin(angle)*dist,vx:(Math.random()-0.5)*2,vy:-2-Math.random()*6,life:400+Math.random()*500,color:ua.skill.color,size:2+Math.random()*5,type});
      }
      if(progress>0.15&&ua.phase===0){ua.phase=1;this.screenShake=0.5;this.shockwaves.push({x:cx,y:cy,radius:5,maxRadius:200,speed:15,color:ua.skill.color,alpha:0.7});}
    }
    // Phase 1 (30-80%): explosion
    else if(progress<0.8){
      if(ua.phase===1){ua.phase=2;this.screenShake=1.2;this.flashAlpha=0.5;this.flashColor='#fff';this.screenFlash=200;
        this.spawnUltimateFX(fx,cx,cy,ua.skill.color,80);
        this.shockwaves.push({x:cx,y:cy,radius:5,maxRadius:400,speed:25,color:ua.skill.color,alpha:1});
        // Dragon God: spawn dragon trail particles during explosion
        if(ua.dragonData){
          const dd=ua.dragonData;const dx=dd.startX+(dd.endX-dd.startX)*progress;
          for(let i=0;i<40;i++){const s=1-i/40;this.particles.push({x:dx-dd.dir*(i*6),y:dd.cy+Math.sin(i*0.4)*15,vx:dd.dir*(3+Math.random()*8),vy:(Math.random()-0.5)*3,life:300+Math.random()*500,color:['#ff0000','#ff4400','#ff8800','#ffcc00'][i%4],size:4+Math.random()*4,type:'burst'});}
          this.shockwaves.push({x:dx,y:dd.cy,radius:5,maxRadius:300,speed:20,color:'#ff4400',alpha:0.9});
        }
      }
      if(Math.random()<0.5){
        const angle=Math.random()*Math.PI*2;
        let type='burst';
        if(fx==='slash')type='line';else if(fx==='rage')type='splatter';else if(fx==='music')type='note';
        this.particles.push({x:cx+Math.cos(angle)*50,y:cy+Math.sin(angle)*50,vx:Math.cos(angle)*(5+Math.random()*10),vy:Math.sin(angle)*(5+Math.random()*10),life:300+Math.random()*600,color:ua.skill.color,size:2+Math.random()*4,type});
      }
    }
    // Phase 2 (80-100%): fade
    else{
      if(ua.phase===2){ua.phase=3;this.flashAlpha=0.2;this.flashColor='#fff';}
    }
  },
  spawnProjectile(owner,target,skill){
    if(G.mode==='moba'&&owner.moba){
      // MOBA: fire in targetDir direction
      const dirX=Math.cos(owner.targetDir),dirY=Math.sin(owner.targetDir);
      const sx=owner.x+owner.w/2+dirX*16,sy=owner.y+owner.h/2+dirY*16;
      const spd=skill.projSpd||8;
      this.projectiles.push({x:sx,y:sy,vx:dirX*spd,vy:dirY*spd,owner,target:null,dmg:Math.round(owner.getStat('atk')*skill.dmg),crit:skill.crit,life:2200,w:skill.big?34:18,h:skill.big?34:18,icon:skill.icon,big:skill.big,color:skill.color});
      G.playSfx('projectile',{fx:owner.prof.fx||'magic'});
    }else{
      const sx=owner.x+(owner.faceRight?owner.w:0),sy=owner.y+owner.h/2-10;const dx=target.x+target.w/2-sx,dy=target.y+target.h/2-sy;const dist=Math.sqrt(dx*dx+dy*dy)||1;const spd=skill.projSpd||8;this.projectiles.push({x:sx,y:sy,vx:dx/dist*spd,vy:dy/dist*spd,owner,target,dmg:Math.round(owner.getStat('atk')*skill.dmg),crit:skill.crit,life:2200,w:skill.big?34:18,h:skill.big?34:18,icon:skill.icon,big:skill.big,color:skill.color});
    }
  },
  addBattleLog(msg){this.battleLog.push(msg);if(this.battleLog.length>6)this.battleLog.shift();},
  // 防御塔或水晶被攻击时：向全队发出警告并召唤 AI 回防
  onStructureAttacked(structure,attacker){
    if(!structure||structure.team===undefined)return;
    // 防止刷屏：全局短冷却
    if(Date.now()<this._lastStructureAlert)return;
    this._lastStructureAlert=Date.now()+900;
    const team=structure.team;
    const isCrystal=!structure.laneName; // 塔有 laneName，水晶没有
    const structName=structure.laneName||(isCrystal?'我方水晶':'防御塔');
    const attackerName=attacker&&attacker.name?attacker.name:'敌方';
    const text=(team==='blue'?'🔵':'🔴')+(isCrystal?' 我方水晶正被攻击！':' '+structName+' 正被攻击！')+' 请回防支援';
    // 屏幕警告横幅（顶部显示）
    this.structureAlerts.push({text,team,color:team==='blue'?'#3498db':'#e74c3c',timer:3500});
    if(this.structureAlerts.length>3)this.structureAlerts.shift();
    // 战斗日志
    this.addBattleLog((team==='blue'?'蓝方':'红方')+' 警告：'+structName+' 正被'+attackerName+'攻击！');
    // 同阵营 AI 英雄回防支援
    const myAI=this.mobaTeams[team].fighters.filter(f=>f!==this.p1&&f.hp>0&&f.respawnTimer<=0);
    for(const ai of myAI){
      ai.defendTarget=structure;
      ai.defendUntil=Date.now()+6000; // 回防6秒
    }
    this.playSfx('hit',{dmg:10});
  },
  findTargetInPreview(fighter,skill){
    const sp=fighter.skillPreview;if(!sp)return null;
    // 小兵
    for(const m of G.minions){if(m.team===fighter.team||m.hp<=0)continue;if(G.rectCollide(sp.x,sp.y,sp.w,sp.h,m.x,m.y,m.w,m.h))return m;}
    const enemies=fighter.team==='blue'?G.mobaTeams.red.fighters:G.mobaTeams.blue.fighters;
    for(const e of enemies){if(e.hp<=0)continue;if(G.rectCollide(sp.x,sp.y,sp.w,sp.h,e.x,e.y,e.w,e.h))return e;}
    const enemyTowers=fighter.team==='blue'?G.mobaTeams.red.towers:G.mobaTeams.blue.towers;
    for(const t of enemyTowers){if(!t.alive)continue;if(G.rectCollide(sp.x,sp.y,sp.w,sp.h,t.x-t.w/2,t.y-t.h/2,t.w,t.h))return{isStructure:true,tower:t,x:t.x,y:t.y,w:t.w,h:t.h,hp:t.hp,maxHp:t.maxHp,getStat:s=>20};}
    const enemyCrystal=(fighter.team==='blue'?G.mobaTeams.red.crystal:G.mobaTeams.blue.crystal);
    if(enemyCrystal&&enemyCrystal.alive&&!enemyCrystal.invincible&&G.rectCollide(sp.x,sp.y,sp.w,sp.h,enemyCrystal.x-enemyCrystal.w/2,enemyCrystal.y-enemyCrystal.h/2,enemyCrystal.w,enemyCrystal.h))return enemyCrystal;
    return null;
  },
  updateTowers(dt){
    const allTowers=[...this.mobaTeams.blue.towers,...this.mobaTeams.red.towers];
    for(const tower of allTowers){
      if(!tower.alive)continue;
      tower.atkTimer-=dt;
      if(tower.atkTimer>0)continue;
      const enemyTeam=tower.team==='blue'?'red':'blue';
      let target=null;
      // 1. Priority: enemy hero who is attacking our hero within tower range
      const myHeroes=this.mobaTeams[tower.team].fighters;
      const enemyHeroes=this.mobaTeams[enemyTeam].fighters;
      for(const eh of enemyHeroes){
        if(eh.hp<=0)continue;
        const d=Math.hypot(eh.x+eh.w/2-tower.x,eh.y+eh.h/2-tower.y);
        if(d>tower.range)continue;
        // Check if this enemy is attacking our hero
        if(eh.activeHitbox){
          for(const mh of myHeroes){
            if(mh.hp<=0)continue;
            if(this.rectCollide(eh.activeHitbox.x,eh.activeHitbox.y,eh.activeHitbox.w,eh.activeHitbox.h,mh.x,mh.y,mh.w,mh.h)){
              target={isHero:true,fighter:eh,x:eh.x+eh.w/2,y:eh.y+eh.h/2};
              break;
            }
          }
        }
        if(target)break;
      }
      // 2. Default: minions first, then heroes
      if(!target){
        let minDist=tower.range;
        for(const m of this.minions){
          if(m.team===tower.team||m.hp<=0)continue;
          const d=Math.hypot(m.x-tower.x,m.y-tower.y);
          if(d<minDist){minDist=d;target={isMinion:true,minion:m,x:m.x,y:m.y};}
        }
        if(!target){
          for(const f of enemyHeroes){
            if(f.hp<=0)continue;
            const d=Math.hypot(f.x+f.w/2-tower.x,f.y+f.h/2-tower.y);
            if(d<minDist){minDist=d;target={isHero:true,fighter:f,x:f.x+f.w/2,y:f.y+f.h/2};}
          }
        }
      }
      if(target){
        this.towerProjectiles.push({x:tower.x,y:tower.y,tx:target.x,ty:target.y,life:400,color:tower.team==='blue'?'#3498db':'#e74c3c',dmg:tower.atk,owner:tower,target});
        tower.atkTimer=tower.atkCooldown;
        this.playSfx('hit',{dmg:20});
      }
    }
  },
  // 水晶像防御塔一样发射炮弹（伤害更高）
  updateCrystalAttack(dt){
    const allCrystals=[this.mobaTeams.blue.crystal,this.mobaTeams.red.crystal];
    for(const crystal of allCrystals){
      if(!crystal.alive||crystal.invincible)continue; // 无敌期间不攻击
      crystal.atkTimer-=dt;
      if(crystal.atkTimer>0)continue;
      const enemyTeam=crystal.team==='blue'?'red':'blue';
      // 目标：范围内敌方小兵优先，其次敌方英雄
      let target=null,minDist=crystal.range;
      for(const m of this.minions){
        if(m.team===crystal.team||m.hp<=0)continue;
        const d=Math.hypot(m.x-crystal.x,m.y-crystal.y);
        if(d<minDist){minDist=d;target={isMinion:true,minion:m,x:m.x,y:m.y};}
      }
      if(!target){
        for(const f of this.mobaTeams[enemyTeam].fighters){
          if(f.hp<=0)continue;
          const d=Math.hypot(f.x+f.w/2-crystal.x,f.y+f.h/2-crystal.y);
          if(d<minDist){minDist=d;target={isHero:true,fighter:f,x:f.x+f.w/2,y:f.y+f.h/2};}
        }
      }
      if(target){
        // 水晶弹道：更大更快、伤害更高、带水晶特有的光芒
        this.towerProjectiles.push({x:crystal.x,y:crystal.y,tx:target.x,ty:target.y,life:450,color:crystal.team==='blue'?'#5dade2':'#e74c3c',dmg:crystal.atk,owner:crystal,target,isCrystal:true});
        crystal.atkTimer=crystal.atkCooldown;
        this.playSfx('hit',{dmg:30});
        // 发射粒子特效
        for(let j=0;j<6;j++){const a=Math.random()*Math.PI*2;this.particles.push({x:crystal.x,y:crystal.y,vx:Math.cos(a)*4,vy:Math.sin(a)*4,life:200,color:crystal.team==='blue'?'#5dade2':'#e74c3c',size:2,type:'spark'});}
      }
    }
  },
  updateRespawns(dt){
    const allF=[...this.mobaTeams.blue.fighters,...this.mobaTeams.red.fighters];
    for(const f of allF){
      // 英雄死亡且尚未开始复活计时 → 启动复活
      if(f.hp<=0&&f.respawnTimer===0){
        // 本局金币：击杀敌方英雄获得金币（击杀者若为玩家）
        if(f.team!==undefined&&f.lastAttacker===this.p1&&f!==this.p1){
          this.mobaGold=(this.mobaGold||0)+120;
          this.spawnHitEffect(f.x,f.y-20,120,'#ffd700');
          this.addBattleLog('击杀 '+f.name+'！ +120金币');
        }
        f.respawnTimer=f.respawnMax;
        f.state='dead';
        f.x=f.y=0; // 移出视野（隐藏尸体位置）
        this.addBattleLog(f.name+' 阵亡，'+Math.ceil(f.respawnMax/1000)+'秒后复活');
      }
      if(f.respawnTimer>0){
        f.respawnTimer-=dt;
        if(f.respawnTimer<=0){
          const base=f.team==='blue'?MOBA_MAP.baseBlue:MOBA_MAP.baseRed;
          f.x=base.x+(Math.random()-0.5)*80;
          f.y=base.y+(Math.random()-0.5)*80;
          f.hp=f.maxHp;f.mp=f.maxMp;f.stamina=f.maxStamina;
          f.state='idle';f.respawnTimer=0;f.invincible=2000;
          f.effects=[];f.cooldowns={};
          this.spawnHitEffect(f.x+f.w/2,f.y+f.h/2,0,'#00ff00');
          this.addBattleLog(f.name+' 已复活！');
        }
      }
    }
  },
  updateMinions(dt){
    this.minionWaveTimer-=dt;
    if(this.minionWaveTimer<=0){this.minionWaveTimer=this.minionWaveInterval;this.spawnMinionWave();}
    for(let i=this.minions.length-1;i>=0;i--){
      const m=this.minions[i];
      if(m.hp<=0){this.minions.splice(i,1);continue;}
      const target=m.findTarget();
      if(target&&m.distanceTo(target)<60){
        m.state='attacking';m.target=target;m.vx=0;m.vy=0;
        m.atkTimer-=dt;
        if(m.atkTimer<=0){
          m.atkTimer=m.atkCooldown;
          const dmg=Math.max(3,m.atk-(target.def||5));
          if(target.isStructure||target.tower!==undefined){
            // Attacking tower or crystal
            const t=target.tower||target;
            if(t.hp!==undefined)t.hp-=Math.max(5,m.atk*0.3);
            // 建筑被小兵攻击同样触发全队警报
            if(G.onStructureAttacked&&t.hp>0&&(t.laneName!==undefined||t.isStructure))G.onStructureAttacked(t,m);
            if(t.alive!==undefined&&t.hp<=0){t.alive=false;t.hp=0;this.addBattleLog(m.team==='blue'?'蓝方':'红方'+' 小兵摧毁了 '+((t.laneName)||'建筑')+'！');this.playSfx('ultimate_impact',{});}
          }else if(target.hp!==undefined){
            target.hp-=dmg;
          }
          this.particles.push({x:m.x,y:m.y,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3,life:150+Math.random()*150,color:'#fff',size:1+Math.random()*2,type:'spark'});
        }
      }else{
        m.state='marching';m.target=null;
        m.vx=m.team==='blue'?m.spd:-m.spd;
        if(Math.abs(m.y-m.laneY)>5)m.vy=(m.laneY-m.y)*0.05;
        else m.vy*=0.9;
      }
      m.x+=m.vx*dt/16;m.y+=m.vy*dt/16;
      // Minion boundaries (use MOBA_MAP dimensions)
      if(m.x<0||m.x>MOBA_MAP.width){this.minions.splice(i,1);continue;}
    }
    // Cap minions to prevent too many
    if(this.minions.length>60)this.minions.splice(0,this.minions.length-60);
  },
  spawnMinionWave(){
    this.minionWaveCount++;
    const bBase=MOBA_MAP.baseBlue.x+40,rBase=MOBA_MAP.baseRed.x-40;
    for(const lane of MOBA_MAP.lanes){
      // Blue minions
      const b1=new Minion(bBase,lane.y-8,'blue',lane.y);b1.spawnWave=this.minionWaveCount;this.minions.push(b1);
      const b2=new Minion(bBase,lane.y+8,'blue',lane.y);b2.spawnWave=this.minionWaveCount;this.minions.push(b2);
      const b3=new Minion(bBase+25,lane.y,'blue',lane.y);b3.spawnWave=this.minionWaveCount;this.minions.push(b3);
      // Red minions
      const r1=new Minion(rBase,lane.y-8,'red',lane.y);r1.spawnWave=this.minionWaveCount;this.minions.push(r1);
      const r2=new Minion(rBase,lane.y+8,'red',lane.y);r2.spawnWave=this.minionWaveCount;this.minions.push(r2);
      const r3=new Minion(rBase-25,lane.y,'red',lane.y);r3.spawnWave=this.minionWaveCount;this.minions.push(r3);
      // Siege minion every 3 waves
      if(this.minionWaveCount%3===0){
        const sb=new Minion(bBase,lane.y,'blue',lane.y);sb.hp=200;sb.maxHp=200;sb.atk=25;sb.w=22;sb.h=22;sb.goldValue=45;this.minions.push(sb);
        const sr=new Minion(rBase,lane.y,'red',lane.y);sr.hp=200;sr.maxHp=200;sr.atk=25;sr.w=22;sr.h=22;sr.goldValue=45;this.minions.push(sr);
      }
    }
    this.addBattleLog('第 '+this.minionWaveCount+' 波小兵出发！');
  },
  updateMobaAI(dt){
    // 计算集火目标：找全队视野内血量最低的敌方英雄（残血收割，队友集火）
    const pickFocusTarget=(aiTeam,enemyTeam)=>{
      let focus=null,fhp=0.4; // 只在敌方有残血(<40%)时才集火
      for(const e of this.mobaTeams[enemyTeam].fighters){
        if(e.hp<=0)continue;
        const hpPct=e.hp/e.maxHp;
        // 找离己方最近的残血敌人（优先集火）
        const dMin=Math.min(...this.mobaTeams[aiTeam].fighters.filter(f=>f.hp>0).map(f=>Math.hypot(f.x-e.x,f.y-e.y)));
        if(hpPct<fhp){fhp=hpPct;focus=e;}
      }
      return focus;
    };
    // Blue AI teammates (excluding player)
    const blueAI=this.mobaTeams.blue.fighters.filter(f=>f!==this.p1&&f.hp>0&&f.respawnTimer<=0);
    const blueFocus=pickFocusTarget('blue','red');
    for(const ai of blueAI){
      if(this.runDefendBehavior(ai))continue;
      // 集火：如果全队有残血集火目标且较近，优先攻击它
      let target=null;
      if(blueFocus&&blueFocus.hp>0&&Math.hypot(blueFocus.x-ai.x,blueFocus.y-ai.y)<650){
        target=blueFocus;
      }else{
        target=this.selectMobaTarget(ai,'red');
      }
      if(target)this.updateSmartAI(ai,target,false);
    }
    // Red AI enemies
    const redAI=this.mobaTeams.red.fighters.filter(f=>f.hp>0&&f.respawnTimer<=0);
    const redFocus=pickFocusTarget('red','blue');
    for(const ai of redAI){
      if(this.runDefendBehavior(ai))continue;
      let target=null;
      if(redFocus&&redFocus.hp>0&&Math.hypot(redFocus.x-ai.x,redFocus.y-ai.y)<650){
        target=redFocus;
      }else{
        target=this.selectMobaTarget(ai,'blue');
      }
      if(target)this.updateSmartAI(ai,target,false);
    }
  },
  // AI 回防逻辑：当己方建筑被攻击时，赶回该建筑支援
  runDefendBehavior(ai){
    if(!ai.defendTarget||!ai.defendTarget.alive)return false;
    // 回防超时则取消
    if(ai.defendUntil&&Date.now()>ai.defendUntil){ai.defendTarget=null;return false;}
    const str=ai.defendTarget;
    const dx=str.x-ai.x,dy=str.y-ai.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    // 靠近结构后，攻击范围内最近的敌方目标（优先打正在攻击建筑的敌人）
    if(dist<220){
      // 已赶到，攻击范围内敌方目标
      const enemyTeam=ai.team==='blue'?'red':'blue';
      let best=null,bd=160;
      for(const e of this.mobaTeams[enemyTeam].fighters){
        if(e.hp<=0)continue;
        const d=Math.hypot(e.x-ai.x,e.y-ai.y);
        if(d<bd){bd=d;best=e;}
      }
      if(!best){for(const m of this.minions){if(m.team===ai.team||m.hp<=0)continue;const d=Math.hypot(m.x-ai.x,m.y-ai.y);if(d<bd){bd=d;best=m;}}}
      if(best){this.updateSmartAI(ai,best,false);return true;}
      // 无敌人，站定守塔
      ai.vx=0;ai.vy=0;
      return true;
    }
    // 还没到，快速朝结构移动回防
    const len=dist||1;
    ai.vx=dx/len*MOBA_MOVE_SPEED;ai.vy=dy/len*MOBA_MOVE_SPEED;
    return true;
  },
  // 增强版目标选择：优先残血收割、低血塔/水晶、攻击者；兼顾推线和打野
  selectMobaTarget(ai,enemyTeam){
    const ax=ai.x+ai.w/2,ay=ai.y+ai.h/2;
    const enemies=this.mobaTeams[enemyTeam].fighters.filter(f=>f.hp>0);
    const enemyTowers=this.mobaTeams[enemyTeam].towers.filter(t=>t.alive);
    const enemyCrystal=this.mobaTeams[enemyTeam].crystal;
    let target=null,bestScore=-Infinity;
    // 1. 低血英雄（残血收割，最高优先）
    for(const e of enemies){
      const d=Math.hypot(e.x+e.w/2-ax,e.y+e.h/2-ay);
      const hpPct=e.hp/e.maxHp;
      // 残血（<35%）目标大幅加分，可立即击杀目标最高优先
      const killBonus=hpPct<0.35?300:0;
      const score=killBonus+(1-hpPct)*150-d;
      if(score>bestScore){bestScore=score;target=e;}
    }
    // 2. 残血塔/水晶（可摧毁的推进目标）
    if(!target){
      for(const t of enemyTowers){
        const d=Math.hypot(t.x-ax,t.y-ay);
        const hpPct=t.hp/t.maxHp;
        const pushBonus=hpPct<0.4?200:0; // 残血塔优先推
        const score=pushBonus+(1-hpPct)*100-d;
        if(score>bestScore){bestScore=score;target={isStructure:true,tower:t,x:t.x,y:t.y,w:t.w,h:t.h,hp:t.hp,maxHp:t.maxHp,getStat:s=>20};}
      }
    }
    // 3. 敌方水晶（无敌解除后作为最终推进目标）
    if(enemyCrystal&&enemyCrystal.alive&&!enemyCrystal.invincible){
      const d=Math.hypot(enemyCrystal.x-ax,enemyCrystal.y-ay);
      // 靠近水晶时优先攻水晶
      const score=120-d+(d<400?150:0);
      if(score>bestScore){bestScore=score;target={isStructure:true,tower:enemyCrystal,x:enemyCrystal.x,y:enemyCrystal.y,w:enemyCrystal.w,h:enemyCrystal.h,hp:enemyCrystal.hp,maxHp:enemyCrystal.maxHp,getStat:s=>10};}
    }
    // 4. 敌方小兵（推线，清线后推进）
    if(!target){
      let bestMinion=null,bd=500;
      for(const m of this.minions){
        if(m.team===ai.team||m.hp<=0)continue;
        const d=Math.hypot(m.x-ax,m.y-ay);
        if(d<bd){bd=d;bestMinion=m;}
      }
      if(bestMinion){
        const score=80-bd;
        if(score>bestScore){bestScore=score;target=bestMinion;}
      }
    }
    // 5. 中立野怪/龙（空闲时打野发育）
    if(!target){
      let bestCamp=null,bc=550;
      for(const m of this.jungleMonsters){
        if(m.hp<=0||m.respawnTimer>0)continue;
        const d=Math.hypot(m.x-ax,m.y-ay);
        if(d<bc){bc=d;bestCamp=m;}
      }
      if(this.dragon&&this.dragon.alive&&Math.hypot(this.dragon.x-ax,this.dragon.y-ay)<bc){bestCamp=this.dragon;}
      if(bestCamp){
        const score=70-bc;
        if(score>bestScore){bestScore=score;target=bestCamp;}
      }
    }
    return target;
  },
  // 返回玩家攻击范围内最近的敌方可攻击目标（小兵/英雄/塔/水晶）
  findNearestMobaEnemy(fighter,range){
    const enemyTeam=fighter.team==='blue'?'red':'blue';
    const enemyFighters=this.mobaTeams[enemyTeam].fighters;
    const enemyTowers=this.mobaTeams[enemyTeam].towers;
    const enemyCrystal=this.mobaTeams[enemyTeam].crystal;
    const cx=fighter.x+fighter.w/2,cy=fighter.y+fighter.h/2;
    let closest=null,minD=range;
    // 小兵（优先攻击小兵，符合MOBA常规）
    for(const m of this.minions){
      if(m.team===fighter.team||m.hp<=0)continue;
      const d=Math.hypot(m.x+m.w/2-cx,m.y+m.h/2-cy);
      if(d<minD){minD=d;closest=m;}
    }
    // 英雄
    for(const e of enemyFighters){
      if(e.hp<=0)continue;
      const d=Math.hypot(e.x+e.w/2-cx,e.y+e.h/2-cy);
      if(d<minD){minD=d;closest=e;}
    }
    // 防御塔
    for(const t of enemyTowers){
      if(!t.alive)continue;
      const d=Math.hypot(t.x-cx,t.y-cy);
      if(d<minD){minD=d;closest=t;}
    }
    // 水晶
    if(enemyCrystal&&enemyCrystal.alive&&!enemyCrystal.invincible){
      const d=Math.hypot(enemyCrystal.x-cx,enemyCrystal.y-cy);
      if(d<minD){minD=d;closest=enemyCrystal;}
    }
    // 野怪（中立单位，双方都可攻击）
    for(const m of this.jungleMonsters){
      if(m.hp<=0||m.respawnTimer>0)continue;
      const d=Math.hypot(m.x-cx,m.y-cy);
      if(d<minD){minD=d;closest=m;}
    }
    // 龙（中立单位）
    if(this.dragon&&this.dragon.alive){
      const d=Math.hypot(this.dragon.x-cx,this.dragon.y-cy);
      if(d<minD){minD=d;closest=this.dragon;}
    }
    return closest;
  },
  updateMobaProjectiles(dt){
    for(let i=this.towerProjectiles.length-1;i>=0;i--){
      const tp=this.towerProjectiles[i];
      const dx=tp.tx-tp.x,dy=tp.ty-tp.y;
      const dist=Math.sqrt(dx*dx+dy*dy)||1;
      const spd=8;
      tp.x+=dx/dist*spd*dt/16;tp.y+=dy/dist*spd*dt/16;
      tp.life-=dt;
      if(dist<10||tp.life<=0){
        // Apply damage
        if(tp.target){
          if(tp.target.isMinion&&tp.target.minion){
            tp.target.minion.hp-=tp.dmg;
          }else if((tp.target.isHero||tp.target.fighter)&&tp.target.fighter&&tp.target.fighter.hp>0){
            const dmg=Math.max(10,tp.dmg-tp.target.fighter.getStat('def')*0.3);
            tp.target.fighter.hp-=dmg;
            this.spawnHitEffect(tp.target.fighter.x+tp.target.fighter.w/2,tp.target.fighter.y+tp.target.fighter.h/2,dmg);
          }
        }
        this.towerProjectiles.splice(i,1);
      }
    }
    // Player projectiles in MOBA mode
    for(let i=this.projectiles.length-1;i>=0;i--){
      const p=this.projectiles[i];
      p.x+=p.vx*dt/16;p.y+=p.vy*dt/16;p.life-=dt;
      // Check collision with all enemies
      const enemies=p.owner.team==='blue'?this.mobaTeams.red.fighters:this.mobaTeams.blue.fighters;
      let hit=false;
      // Check minions first (common target)
      if(!hit){
        for(const m of this.minions){
          if(m.team===p.owner.team||m.hp<=0)continue;
          if(this.rectCollide(p.x-p.w/2,p.y-p.h/2,p.w,p.h,m.x,m.y,m.w,m.h)){
            let dmg=p.dmg;
            if(p.crit&&Math.random()<0.5)dmg=Math.round(dmg*1.8);
            dmg=Math.max(3,dmg-Math.round((m.getStat?m.getStat('def'):0)*0.5));
            if(dmg>0){m.takeDamage(dmg,p.owner);this.spawnHitEffect(m.x+m.w/2,m.y+m.h/2,dmg);}
            for(let j=0;j<6;j++){const a=Math.random()*Math.PI*2;this.particles.push({x:p.x,y:p.y,vx:Math.cos(a)*4,vy:Math.sin(a)*4,life:200,color:p.color,size:2,type:'spark'});}
            hit=true;break;
          }
        }
      }
      for(const e of enemies){
        if(e.hp<=0)continue;
        if(this.rectCollide(p.x-p.w/2,p.y-p.h/2,p.w,p.h,e.x,e.y,e.w,e.h)){
          let dmg=p.dmg;
          if(p.crit&&Math.random()<0.5)dmg=Math.round(dmg*1.8);
          dmg=Math.max(3,dmg-Math.round(e.getStat('def')*0.5));
          if(dmg>0){e.takeDamage(dmg,p.owner);this.spawnHitEffect(e.x+e.w/2,e.y+e.h/2,dmg);}
          for(let j=0;j<8;j++){const a=Math.random()*Math.PI*2;this.particles.push({x:p.x,y:p.y,vx:Math.cos(a)*4,vy:Math.sin(a)*4,life:200,color:p.color,size:2,type:'spark'});}
          if(p.big)this.playSfx('ultimate_impact',{fx:p.owner.prof.fx});
          hit=true;break;
        }
      }
      // Check towers
      if(!hit){
        const enemyTowers=p.owner.team==='blue'?this.mobaTeams.red.towers:this.mobaTeams.blue.towers;
        for(const t of enemyTowers){
          if(!t.alive)continue;
          if(this.rectCollide(p.x-p.w/2,p.y-p.h/2,p.w,p.h,t.x-t.w/2,t.y-t.h/2,t.w,t.h)){
            const dmg=Math.max(5,p.dmg*0.5);t.hp-=dmg;
            if(t.hp<=0){t.alive=false;t.hp=0;this.addBattleLog(p.owner.name+' 摧毁了 '+t.laneName+' 防御塔！');this.playSfx('ultimate_impact',{fx:p.owner.prof.fx});}
            for(let j=0;j<12;j++){const a=Math.random()*Math.PI*2;this.particles.push({x:p.x,y:p.y,vx:Math.cos(a)*5,vy:Math.sin(a)*5,life:300,color:p.color,size:3,type:'burst'});}
            hit=true;break;
          }
        }
      }
      // Check crystal
      if(!hit){
        const enemyCrystal=p.owner.team==='blue'?this.mobaTeams.red.crystal:this.mobaTeams.blue.crystal;
        if(enemyCrystal.alive&&this.rectCollide(p.x-p.w/2,p.y-p.h/2,p.w,p.h,enemyCrystal.x-enemyCrystal.w/2,enemyCrystal.y-enemyCrystal.h/2,enemyCrystal.w,enemyCrystal.h)){
          if(!enemyCrystal.invincible){
            const dmg=Math.max(5,p.dmg*0.3);enemyCrystal.hp-=dmg;
            if(enemyCrystal.hp<=0){enemyCrystal.alive=false;enemyCrystal.hp=0;this.addBattleLog(p.owner.name+' 摧毁了敌方水晶！！');}
          }
          hit=true;
        }
      }
      // Check jungle monsters & dragon (neutral, both teams can hit)
      if(!hit){
        for(const m of this.jungleMonsters){
          if(m.hp<=0||m.respawnTimer>0)continue;
          if(this.rectCollide(p.x-p.w/2,p.y-p.h/2,p.w,p.h,m.x-m.w/2,m.y-m.h/2,m.w,m.h)){
            let dmg=p.dmg;
            if(p.crit&&Math.random()<0.5)dmg=Math.round(dmg*1.8);
            dmg=Math.max(3,dmg-Math.round(m.getStat('def')*0.5));
            if(dmg>0){m.takeDamage(dmg,p.owner);this.spawnHitEffect(m.x,m.y-10,dmg);}
            hit=true;break;
          }
        }
      }
      if(!hit&&this.dragon&&this.dragon.alive){
        const dr=this.dragon;
        if(this.rectCollide(p.x-p.w/2,p.y-p.h/2,p.w,p.h,dr.x-dr.w/2,dr.y-dr.h/2,dr.w,dr.h)){
          let dmg=p.dmg;
          if(p.crit&&Math.random()<0.5)dmg=Math.round(dmg*1.8);
          dmg=Math.max(3,dmg-Math.round(dr.getStat('def')*0.5));
          if(dmg>0){dr.takeDamage(dmg,p.owner);this.spawnHitEffect(dr.x,dr.y-15,dmg);}
          hit=true;
        }
      }
      if(hit||p.life<=0||p.x<0||p.x>MOBA_MAP.width||p.y<0||p.y>MOBA_MAP.height){
        this.projectiles.splice(i,1);
      }
    }
  },
  checkMobaWin(){
    // Crystal invincibility: 只要推掉任意一座敌方防御塔，该方水晶即解除无敌（可被攻击）
    // 红方水晶无敌 = 红方还没有任何一座塔被摧毁
    const redAnyTowerDestroyed=this.mobaTeams.red.towers.some(t=>!t.alive);
    const blueAnyTowerDestroyed=this.mobaTeams.blue.towers.some(t=>!t.alive);
    this.mobaTeams.red.crystal.invincible=!redAnyTowerDestroyed;
    this.mobaTeams.blue.crystal.invincible=!blueAnyTowerDestroyed;
    // Check win
    if(!this.mobaTeams.red.crystal.alive){
      this.endBattle(this.p1);
    }else if(!this.mobaTeams.blue.crystal.alive){
      this.endBattle(this.mobaTeams.red.fighters[0]);
    }
  },
  rectCollide(x1,y1,w1,h1,x2,y2,w2,h2){return x1<x2+w2&&x1+w1>x2&&y1<y2+h2&&y1+h1>y2;},

  // ============ RENDER ============
  renderFrame(){
    const ctx=this.ctx,W=this.canvas.width,H=this.canvas.height;
    ctx.save();
    if(this.mode==='moba'){
      // Camera offset for large map
      const cx=this.camera.x,cy=this.camera.y;
      ctx.translate(-cx,-cy);
      this.drawMOBAMap(ctx,W,H,cx,cy);

      const allTowers=[...this.mobaTeams.blue.towers,...this.mobaTeams.red.towers];
      for(const t of allTowers)this.drawTower(ctx,t);

      this.drawCrystal(ctx,this.mobaTeams.blue.crystal);
      this.drawCrystal(ctx,this.mobaTeams.red.crystal);
      // Draw minions
      for(const m of this.minions)this.drawMinion(ctx,m);
      // Draw jungle monsters
      for(const m of this.jungleMonsters)this.drawMonster(ctx,m);
      // Draw dragon
      if(this.dragon)this.drawDragon(ctx,this.dragon);
      // Draw skill previews
      const allF=[...this.mobaTeams.blue.fighters,...this.mobaTeams.red.fighters];
      for(const f of allF){if(f.skillPreview&&f.hp>0)this.drawSkillPreview(ctx,f);}

        ctx.save();ctx.fillStyle=p.big?'#ff6600':(p.color||'#ffaa00');ctx.shadowColor=p.big?'#ff4400':(p.color||'#ffaa00');ctx.shadowBlur=p.big?22:10;

        ctx.fillStyle='#fff';ctx.globalAlpha=0.6;ctx.beginPath();ctx.arc(p.x,p.y,p.big?8:4,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
        ctx.restore();
      }
      // Tower projectiles
      for(const tp of this.towerProjectiles){
        ctx.save();ctx.fillStyle=tp.color;ctx.shadowColor=tp.color;ctx.shadowBlur=8;
        ctx.beginPath();ctx.arc(tp.x,tp.y,5,0,Math.PI*2);ctx.fill();ctx.restore();
        // 水晶炮弹：更大更亮的光环
        if(tp.isCrystal){

        ctx.fillText(h.dmg===0?'闪避':'-'+h.dmg,h.x-15,h.y);ctx.restore();
      }
      // Reset camera transform for HUD (screen-space)
      ctx.setTransform(1,0,0,1,0,0);
      // Battle log (screen-space)
      ctx.save();ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(10,10,300,20+this.battleLog.length*22);
      ctx.font='12px "Microsoft YaHei"';this.battleLog.forEach((m,i)=>{ctx.fillStyle='#ddd';ctx.fillText(m,20,30+i*22);});ctx.restore();
      this.renderMOBAHUD();
      // 死亡观战：屏幕变暗 + 顶部复活倒计时
      if(this.p1&&this.p1.hp<=0&&this.p1.respawnTimer>0){
        ctx.save();
        // 半透明暗色遮罩（仍可看清战场）
        ctx.fillStyle='rgba(10,0,0,0.45)';ctx.fillRect(0,0,W,H);
        // 红边暗角
        const vg=ctx.createLinearGradient(0,0,0,H);
        vg.addColorStop(0,'rgba(100,0,0,0.35)');vg.addColorStop(0.15,'rgba(0,0,0,0)');
        vg.addColorStop(0.85,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(60,0,0,0.35)');
        ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
        // 顶部死亡倒计时面板
        const sec=Math.ceil(this.p1.respawnTimer/1000);
        ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(W/2-150,50,300,60);
        ctx.strokeStyle='#ff4444';ctx.lineWidth=2;ctx.strokeRect(W/2-150,50,300,60);
        ctx.textAlign='center';
        ctx.fillStyle='#ff5555';ctx.font='bold 20px "Microsoft YaHei"';
        ctx.fillText('💀 你已阵亡',W/2,80);
        ctx.fillStyle='#fff';ctx.font='bold 28px "Microsoft YaHei"';
        ctx.shadowColor='#ff0000';ctx.shadowBlur=15;
        ctx.fillText(sec+' 秒后复活',W/2,104);
        ctx.shadowBlur=0;
        ctx.textAlign='left';
        ctx.restore();
      }
      ctx.restore();
      return;
    }
    // Screen shake
    if(this.screenShake>0.01){ctx.translate(this.shakeX,this.shakeY);}
    if(!this.battleActive&&!this.battleEnded){ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);ctx.restore();return;}
    const bgGrad=ctx.createLinearGradient(0,0,0,H);bgGrad.addColorStop(0,'#0a0a1a');bgGrad.addColorStop(0.6,'#1a1a2e');bgGrad.addColorStop(1,'#0f1a0f');ctx.fillStyle=bgGrad;ctx.fillRect(0,0,W,H);
    const ax=this.arenaX,aw=this.arenaW,gy=this.groundY;
    ctx.fillStyle='#2d2d1a';ctx.fillRect(ax,gy+70,aw,20);ctx.fillStyle='#3d3d2a';ctx.fillRect(ax,gy+70,aw,4);
    const floorGrad=ctx.createLinearGradient(0,gy,0,gy+70);floorGrad.addColorStop(0,'#4a3728');floorGrad.addColorStop(1,'#2a1f14');ctx.fillStyle=floorGrad;ctx.fillRect(ax,gy,aw,70);
    ctx.strokeStyle='#6a5748';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ax,gy);ctx.lineTo(ax+aw,gy);ctx.stroke();
    ctx.strokeStyle='#555';ctx.lineWidth=3;ctx.strokeRect(ax-2,gy-420,aw+4,490);
    for(let i=0;i<5;i++){const px=ax+aw*(i+1)/6;ctx.fillStyle='#1a1a0a';ctx.fillRect(px-15,gy-260,30,260);ctx.fillStyle='#2a2a1a';ctx.fillRect(px-12,gy-250,24,250);}
    // Draw melee hitboxes
    if(this.p1&&this.p1.activeHitbox)this.drawHitbox(this.p1.activeHitbox);

    if(this.p1)this.drawFighter(this.p1);
    if(this.p2)this.drawFighter(this.p2);
    for(const p of this.projectiles){
      ctx.save();ctx.fillStyle=p.big?'#ff6600':'#ffaa00';ctx.shadowColor=p.big?'#ff4400':(p.color||'#ffaa00');ctx.shadowBlur=p.big?22:10;
      ctx.beginPath();ctx.arc(p.x,p.y,p.big?17:9,0,Math.PI*2);ctx.fill();
      // Inner glow
      ctx.fillStyle='#fff';ctx.globalAlpha=0.6;ctx.beginPath();ctx.arc(p.x,p.y,p.big?8:4,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
      ctx.fillStyle='#fff';ctx.font=`${p.big?20:13}px sans-serif`;ctx.fillText(p.icon,p.x-8,p.y+5);
      ctx.restore();
      // Trail particles
      if(Math.random()<0.5){
        this.particles.push({x:p.x-p.vx*0.5,y:p.y-p.vy*0.5,vx:(Math.random()-0.5)*2,vy:(Math.random()-0.5)*2,life:150+Math.random()*200,color:p.color||'#ffaa00',size:1+Math.random()*3,type:'spark'});
      }
    }
    // Particles — unique shapes per FX type
    for(const p of this.particles){
      ctx.save();
      const alpha=Math.max(0,p.life/(p.life+200));
      ctx.globalAlpha=p.alpha||alpha;
      ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=p.size*2;
      switch(p.type){
        case 'spark':case 'burst': // Round sparks
          ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();break;
        case 'rise': // Rising with bright core
          ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
          ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,p.size*0.4,0,Math.PI*2);ctx.fill();break;
        case 'line': // Directional slash line
          ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle||0);
          ctx.fillRect(-p.size*3,0,p.size*6,p.size*0.6);ctx.restore();break;
        case 'orb': // Glowing orb with ring
          ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
          ctx.strokeStyle='#fff';ctx.lineWidth=0.8;ctx.globalAlpha=alpha*0.5;
          ctx.beginPath();ctx.arc(p.x,p.y,p.size*1.4,0,Math.PI*2);ctx.stroke();break;
        case 'streak': // Fast directional streak
          ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle||0);
          ctx.fillRect(-p.size*4,0,p.size*8,p.size*0.5);
          ctx.fillStyle='#fff';ctx.fillRect(-p.size*4,0,p.size*8,p.size*0.2);ctx.restore();break;
        case 'leaf': // Leaf-shaped particle
          ctx.beginPath();ctx.ellipse(p.x,p.y,p.size,p.size*0.4,p.angle||0,0,Math.PI*2);ctx.fill();break;
        case 'smoke': // Soft smoke puff
          ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
          ctx.globalAlpha=alpha*0.4;ctx.fillStyle='#000';ctx.beginPath();ctx.arc(p.x,p.y,p.size*0.5,0,Math.PI*2);ctx.fill();break;
        case 'afterimage': // Ghost silhouette
          ctx.globalAlpha=alpha*0.4;ctx.fillRect(p.x-8,p.y-20,16,40);

          }break;

          ctx.fillText(['♪','♫','♬','🎵','🎶'][Math.floor(Math.random()*5)],p.x,p.y);break;

      ctx.fillStyle=bhpGrad;ctx.fillRect(bbX,bbY,bbW*bhpPct,bbH);
      ctx.fillStyle='#fff';ctx.font='bold 13px "Microsoft YaHei"';ctx.textAlign='center';
      ctx.fillText(`👑 ${this.p2.name}  ❤ ${Math.round(Math.max(0,this.p2.hp))}/${this.p2.maxHp}`,bbX+bbW/2,bbY+13);
      ctx.restore();
    }
    // Shockwaves
    for(const sw of this.shockwaves){
      ctx.save();ctx.globalAlpha=sw.alpha;ctx.strokeStyle=sw.color;ctx.lineWidth=4;ctx.shadowColor=sw.color;ctx.shadowBlur=18;
      ctx.beginPath();ctx.arc(sw.x,sw.y,sw.radius,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,'+(sw.alpha*0.5)+')';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(sw.x,sw.y,sw.radius*0.85,0,Math.PI*2);ctx.stroke();
      ctx.restore();

    if(this.flashAlpha>0.01){ctx.save();ctx.fillStyle=this.flashColor;ctx.globalAlpha=this.flashAlpha;ctx.fillRect(0,0,W,H);ctx.restore();}
    ctx.restore(); // end screen shake
    this.renderHUD();
    ctx.save();ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(ax+10,10,340,20+this.battleLog.length*22);ctx.font='12px "Microsoft YaHei"';this.battleLog.forEach((m,i)=>{ctx.fillStyle='#ddd';ctx.fillText(m,ax+20,30+i*22);});ctx.restore();
  },

  // ============ MOBA RENDER METHODS ============
  drawMOBAMap(ctx,W,H,cx,cy){
    const MW=MOBA_MAP.width,MH=MOBA_MAP.height;
    // Only render visible area + some margin
    const vx=Math.max(0,cx-100),vy=Math.max(0,cy-100);
    const vw=Math.min(MW-vx,W+200),vh=Math.min(MH-vy,H+200);
    // Grass background
    ctx.fillStyle='#2d5a1e';ctx.fillRect(vx,vy,vw,vh);
    // Lane roads
    ctx.fillStyle='#8B7355';
    for(const l of MOBA_MAP.lanes){ctx.fillRect(vx,l.y-30,vw,60);}
    // River
    ctx.fillStyle='rgba(30,144,255,0.35)';ctx.fillRect(vx,MOBA_MAP.riverY-22,vw,44);
    // River sparkles
    ctx.fillStyle='rgba(135,206,250,0.4)';
    for(let i=0;i<30;i++){ctx.beginPath();ctx.arc(vx+Math.random()*vw,MOBA_MAP.riverY-12+Math.random()*24,1+Math.random()*2,0,Math.PI*2);ctx.fill();}
    // Bushes
    for(const b of MOBA_MAP.bushes){
      ctx.fillStyle='rgba(34,139,34,0.7)';ctx.fillRect(b.x,b.y,b.w,b.h);
      ctx.fillStyle='rgba(0,100,0,0.3)';
      for(let j=0;j<8;j++){ctx.beginPath();ctx.arc(b.x+Math.random()*b.w,b.y+Math.random()*b.h,3+Math.random()*5,0,Math.PI*2);ctx.fill();}
    }
    // Jungle camps (simple circles) - spread across both jungles on 6000x4000 map
    const jungles=[
      {x:850,y:700},{x:850,y:3300},{x:5150,y:700},{x:5150,y:3300},
      {x:1300,y:1150},{x:1300,y:2850},{x:4700,y:1150},{x:4700,y:2850},
    ];
    for(const j of jungles){
      ctx.fillStyle='rgba(80,60,20,0.4)';ctx.beginPath();ctx.arc(j.x,j.y,30,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(60,40,10,0.5)';ctx.lineWidth=2;ctx.stroke();
    }
    // Walls
    for(const wall of MOBA_MAP.walls){
      ctx.fillStyle='#5a5a5a';ctx.fillRect(wall.x,wall.y,wall.w,wall.h);
      ctx.fillStyle='#6a6a6a';ctx.fillRect(wall.x+2,wall.y+2,wall.w-4,wall.h-4);
      ctx.strokeStyle='#444';ctx.lineWidth=1;ctx.strokeRect(wall.x,wall.y,wall.w,wall.h);
    }
    // Bases
    ctx.fillStyle='rgba(52,152,219,0.25)';ctx.beginPath();ctx.arc(MOBA_MAP.baseBlue.x,MOBA_MAP.baseBlue.y,100,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(231,76,60,0.25)';ctx.beginPath();ctx.arc(MOBA_MAP.baseRed.x,MOBA_MAP.baseRed.y,100,0,Math.PI*2);ctx.fill();
    // Base labels
    ctx.fillStyle='rgba(52,152,219,0.6)';ctx.font='bold 16px "Microsoft YaHei"';ctx.textAlign='center';
    ctx.fillText('蓝方基地',MOBA_MAP.baseBlue.x,MOBA_MAP.baseBlue.y-70);
    ctx.fillStyle='rgba(231,76,60,0.6)';
    ctx.fillText('红方基地',MOBA_MAP.baseRed.x,MOBA_MAP.baseRed.y-70);
    ctx.textAlign='left';
  },
  drawTower(ctx,t){
    if(!t.alive){ctx.fillStyle='#555';ctx.fillRect(t.x-15,t.y-15,30,30);ctx.fillStyle='#444';ctx.fillText('💥',t.x-10,t.y+5);return;}
    const col=t.team==='blue'?'#2980b9':'#c0392b',col2=t.team==='blue'?'#3498db':'#e74c3c';
    ctx.fillStyle=col;ctx.fillRect(t.x-18,t.y-18,36,36);
    ctx.fillStyle=col2;ctx.fillRect(t.x-12,t.y-12,24,24);
    ctx.fillStyle='#fff';ctx.fillRect(t.x-6,t.y-6,12,12);
    // HP bar

  drawMonster(ctx,m){

      ctx.globalAlpha=0.2;ctx.fillStyle='#888';

      ctx.fillText('刷新中',m.x,m.y+4);

    const bodyCol=m.type==='bear'?'#8B4513':'#7f8c8d';
    ctx.fillStyle=bodyCol;ctx.shadowColor='#000';ctx.shadowBlur=6;
    ctx.beginPath();ctx.arc(0,0,m.w/2,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    // 眼睛
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-m.w/5,-m.h/8,m.w/7,0,Math.PI*2);ctx.arc(m.w/5,-m.h/8,m.w/7,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#c0392b';ctx.beginPath();ctx.arc(-m.w/5,-m.h/8,m.w/12,0,Math.PI*2);ctx.arc(m.w/5,-m.h/8,m.w/12,0,Math.PI*2);ctx.fill();
    // 图标
    ctx.fillStyle='#fff';ctx.font=`${m.type==='bear'?16:12}px sans-serif`;ctx.textAlign='center';

    const hpPct=m.hp/m.maxHp;

    ctx.fillStyle=hpPct>0.5?'#e67e22':hpPct>0.25?'#e74c3c':'#c0392b';
    ctx.fillRect(-m.w/2,m.h/2+4,m.w*hpPct,4);

  },
  drawDragon(ctx,d){

  drawMOBAFighter(ctx,f){
    if(f.hp<=0)return;
    const cx=f.x+f.w/2,cy=f.y+f.h/2;
    const skin=f.prof.skin;
    const isBlue=f.team==='blue';
    const teamCol=isBlue?'#3498db':'#e74c3c';
    const teamColBright=isBlue?'#5dade2':'#ff6666';
    ctx.save();
    // 脚下阵营光圈（友方蓝/敌方红，强烈区分）
    const ringCol=isBlue?'rgba(52,152,219,0.45)':'rgba(231,76,60,0.45)';
    ctx.fillStyle=ringCol;
    ctx.beginPath();ctx.ellipse(cx,cy+3,f.w/2+8,6,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=isBlue?'rgba(93,173,226,0.9)':'rgba(255,102,102,0.9)';
    ctx.lineWidth=1.5;
    ctx.beginPath();ctx.ellipse(cx,cy+3,f.w/2+8,6,0,0,Math.PI*2);ctx.stroke();
    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(cx,cy+2,f.w/2+2,5,0,0,Math.PI*2);ctx.fill();
    // Body circle
    const flash=f.invincible>0&&Math.floor(f.invincible/40)%2===0;
    ctx.fillStyle=flash?'#fff':skin.armor;
    ctx.beginPath();ctx.arc(cx,cy,f.w/2-2,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=skin.accent;ctx.lineWidth=2;ctx.stroke();
    // Direction indicator (triangle)
    const dirX=Math.cos(f.targetDir||0),dirY=Math.sin(f.targetDir||0);
    ctx.fillStyle=skin.weapon;
    ctx.beginPath();ctx.moveTo(cx+dirX*16,cy+dirY*16);
    ctx.lineTo(cx+dirY*8-dirX*6,cy-dirX*8-dirY*6);
    ctx.lineTo(cx-dirY*8-dirX*6,cy+dirX*8-dirY*6);
    ctx.closePath();ctx.fill();
    // 头顶阵营标记 + 名称
    ctx.font='bold 10px "Microsoft YaHei"';ctx.textAlign='center';
    const isTeammate=f.team===G.p1.team;
    const labelCol=isTeammate?(isBlue?'#5dade2':'#ff6666'):(isBlue?'#ff6666':'#5dade2');
    ctx.fillStyle=labelCol;
    ctx.fillText(f.name,cx,cy-26);
    // 阵营徽标（头顶，友/敌）
    ctx.fillStyle=isTeammate?(isBlue?'#3498db':'#e74c3c'):(isBlue?'#e74c3c':'#3498db');
    ctx.beginPath();ctx.arc(cx,cy-34,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 8px "Microsoft YaHei"';
    ctx.fillText(isTeammate?'友':'敌',cx,cy-32);
    // HP bar（边框按阵营着色）
    const hpPct=f.hp/f.maxHp;
    ctx.fillStyle='#333';ctx.fillRect(cx-19,cy-18,38,5);
    ctx.fillStyle=hpPct>0.5?'#2ecc71':hpPct>0.25?'#f39c12':'#e74c3c';
    ctx.fillRect(cx-19,cy-18,38*hpPct,5);
    ctx.strokeStyle=teamCol;ctx.lineWidth=1;ctx.strokeRect(cx-19,cy-18,38,5);
    // Is this the player? Highlight
    if(f===G.p1){
      ctx.strokeStyle='#ffd700';ctx.lineWidth=2;ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.arc(cx,cy,f.w/2+5,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    }
    // Respawn countdown
    if(f.respawnTimer>0){
      const sec=Math.ceil(f.respawnTimer/1000);
      ctx.fillStyle='#ff4444';ctx.font='bold 16px "Microsoft YaHei"';
      ctx.fillText(sec+'s',cx,cy-30);
    }
    ctx.restore();
  },
  renderMOBAHUD(){

      const skillLabels=['I','K','L'];
      for(let i=0;i<3;i++){
        const sk=this.p1.prof.skills[i];
        const cd=this.p1.getCD(sk);
        const x=78+i*74;
        ctx.fillStyle=cd>0?'#555':sk.color;ctx.fillRect(x,this.canvas.height-62,66,44);
        ctx.fillStyle='#fff';ctx.font='bold 14px "Microsoft YaHei"';
        ctx.fillText(skillLabels[i],x+33,this.canvas.height-30);

        ctx.fillText(sk.icon+' '+sk.name,x+33,this.canvas.height-50);

      }

    if(this.mobaShopOpen)this.drawMobaShop(ctx,this.canvas.width,this.canvas.height);
  },
  // 本局商城面板（分页网格，每页12个道具）
  drawMobaShop(ctx,W,H){
    const pW=780,pH=560;
    const px=(W-pW)/2,py=(H-pH)/2;
    const CAT=this.mobaShopCat||'all';
    const list=MOBA_SHOP_ITEMS.filter(i=>CAT==='all'||i.cat===CAT);
    const PER=12,pageCount=Math.max(1,Math.ceil(list.length/PER));
    if(this.mobaShopPage>=pageCount)this.mobaShopPage=0;
    ctx.save();
    // 背景遮罩
    ctx.fillStyle='rgba(0,0,0,0.72)';ctx.fillRect(0,0,W,H);
    // 面板
    ctx.fillStyle='rgba(18,20,34,0.97)';ctx.fillRect(px,py,pW,pH);
    ctx.strokeStyle='#ffcc00';ctx.lineWidth=3;ctx.strokeRect(px,py,pW,pH);
    // 标题
    ctx.fillStyle='#ffd700';ctx.font='bold 24px "Microsoft YaHei"';ctx.textAlign='center';
    ctx.fillText('🏪 本局商城',px+pW/2,py+40);
    ctx.fillStyle='#fff';ctx.font='bold 17px "Microsoft YaHei"';
    ctx.fillText('💰 金币：'+Math.floor(this.mobaGold||0),px+pW/2,py+72);
    ctx.fillStyle='#aaa';ctx.font='12px "Microsoft YaHei"';
    ctx.fillText('点击购买，增幅仅本局生效 | 按 E 关闭',px+pW/2,py+92);
    // 分类标签
    const cats=[['all','全部'],['attack','攻击'],['defense','防御'],['health','生命'],['speed','移速'],['regen','回复'],['special','特殊'],['unique','神器']];
    const catY=py+110;let catX=px+24;
    ctx.textAlign='left';
    for(const c of cats){
      const cw=c[0]==='all'?60:52;
      const isOn=CAT===c[0];
      ctx.fillStyle=isOn?'rgba(255,204,0,0.25)':'rgba(45,48,70,0.8)';
      ctx.strokeStyle=isOn?'#ffcc00':'#555';ctx.lineWidth=1.5;
      const rx=catX,ry=catY-14;
      roundRect(ctx,rx,ry,cw,24,6);ctx.fill();ctx.stroke();
      ctx.fillStyle=isOn?'#ffd700':'#bbb';ctx.font='bold 13px "Microsoft YaHei"';
      ctx.fillText(c[1],rx+6,ry+17);
      catX+=cw+8;
    }
    // 道具网格（4列×3行=12个/页）
    const cols=4,rows=3,cellW=168,cellH=96,gap=14;
    const gridX=px+30,gridY=py+130;
    const pageList=list.slice(this.mobaShopPage*PER,(this.mobaShopPage+1)*PER);
    const startIdx=this.mobaShopPage*PER;
    for(let i=0;i<pageList.length;i++){
      const item=pageList[i];
      const absIdx=MOBA_SHOP_ITEMS.indexOf(item);
      const col=i%cols,row=Math.floor(i/cols);
      const x=gridX+col*(cellW+gap),y=gridY+row*(cellH+gap);
      const canBuy=(this.mobaGold||0)>=item.price&&!(item.unique&&this.mobaBoughtItems[item.id]);
      // 卡片背景
      ctx.fillStyle=this.mobaShopHover===absIdx?'rgba(70,72,105,0.95)':'rgba(35,37,55,0.92)';
      roundRect(ctx,x,y,cellW,cellH,8);ctx.fill();
      ctx.strokeStyle=canBuy?'#ffcc00':(item.unique&&this.mobaBoughtItems[item.id])?'#2ecc71':'#555';
      ctx.lineWidth=1.5;roundRect(ctx,x,y,cellW,cellH,8);ctx.stroke();
      // 类别角标
      ctx.fillStyle={attack:'#e67e22',defense:'#3498db',health:'#2ecc71',speed:'#9b59b6',regen:'#1abc9c',special:'#f1c40f',unique:'#ff5500'}[item.cat]||'#888';
      ctx.fillRect(x,y,cellW,5);
      // 图标
      ctx.font='28px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(item.icon,x+24,y+30);
      // 名称
      ctx.textBaseline='alphabetic';
      ctx.fillStyle='#fff';ctx.font='bold 14px "Microsoft YaHei"';
      ctx.fillText(item.name,x+48,y+24);
      // 描述
      ctx.fillStyle='#aab';ctx.font='11px "Microsoft YaHei"';
      ctx.fillText(item.desc,x+48,y+46);
      // 价格/已购
      ctx.font='bold 13px "Microsoft YaHei"';
      if(item.unique&&this.mobaBoughtItems[item.id]){
        ctx.fillStyle='#2ecc71';ctx.fillText('✔ 已购买',x+48,y+82);
      }else{
        ctx.fillStyle=canBuy?'#ffd700':'#ff6666';
        ctx.fillText('💰 '+item.price,x+48,y+82);
      }
    }
    // 分页按钮
    ctx.textAlign='center';
    const navY=py+pH-34;
    ctx.fillStyle='#999';ctx.font='bold 13px "Microsoft YaHei"';
    ctx.fillText('第 '+(this.mobaShopPage+1)+' / '+pageCount+' 页',px+pW/2,navY+5);
    // 上一页
    ctx.fillStyle=this.mobaShopHoverNav===0?'rgba(255,204,0,0.3)':'rgba(45,48,70,0.9)';
    roundRect(ctx,px+pW/2-150,navY-14,44,28,6);ctx.fill();ctx.strokeStyle='#ffcc00';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle=this.mobaShopPage>0?'#fff':'#666';ctx.font='bold 15px "Microsoft YaHei"';
    ctx.fillText('◀',px+pW/2-128,navY+5);
    // 下一页
    ctx.fillStyle=this.mobaShopHoverNav===1?'rgba(255,204,0,0.3)':'rgba(45,48,70,0.9)';
    roundRect(ctx,px+pW/2+106,navY-14,44,28,6);ctx.fill();ctx.stroke();
    ctx.fillStyle=this.mobaShopPage<pageCount-1?'#fff':'#666';ctx.font='bold 15px "Microsoft YaHei"';
    ctx.fillText('▶',px+pW/2+128,navY+5);
    ctx.restore();
  },
  // 检测鼠标位置对应的商城交互（道具/分类/翻页按钮）
  getMobaShopAt(mx,my){
    const W=this.canvas.width,H=this.canvas.height;
    const pW=780,pH=560;
    const px=(W-pW)/2,py=(H-pH)/2;
    const CAT=this.mobaShopCat||'all';
    const list=MOBA_SHOP_ITEMS.filter(i=>CAT==='all'||i.cat===CAT);
    const PER=12;
    // 分类标签
    const cats=[['all','全部'],['attack','攻击'],['defense','防御'],['health','生命'],['speed','移速'],['regen','回复'],['special','特殊'],['unique','神器']];
    let catX=px+24;
    for(const c of cats){
      const cw=c[0]==='all'?60:52;
      if(mx>=catX&&mx<=catX+cw&&my>=py+110-14&&my<=py+110+10)return {type:'cat',id:c[0]};
      catX+=cw+8;
    }
    // 道具网格
    const cols=4,rows=3,cellW=168,cellH=96,gap=14;
    const gridX=px+30,gridY=py+130;
    const pageList=list.slice(this.mobaShopPage*PER,(this.mobaShopPage+1)*PER);
    for(let i=0;i<pageList.length;i++){
      const item=pageList[i];
      const absIdx=MOBA_SHOP_ITEMS.indexOf(item);
      const col=i%cols,row=Math.floor(i/cols);
      const x=gridX+col*(cellW+gap),y=gridY+row*(cellH+gap);
      if(mx>=x&&mx<=x+cellW&&my>=y&&my<=y+cellH)return {type:'item',idx:absIdx};
    }
    // 分页按钮
    const navY=py+pH-34;
    if(mx>=px+pW/2-150&&mx<=px+pW/2-150+44&&my>=navY-14&&my<=navY+14)return {type:'nav',id:0};

  // 购买商城道具 / 处理分类与翻页
  buyMobaShopItem(mx,my){
    const hit=this.getMobaShopAt(mx,my);
    if(!hit||!this.p1)return;
    // 分类切换
    if(hit.type==='cat'){
      this.mobaShopCat=hit.id;
      this.mobaShopPage=0;
      this.playSfx('ui_click');
      return;
    }
    // 翻页
    if(hit.type==='nav'){
      const CAT=this.mobaShopCat||'all';
      const list=MOBA_SHOP_ITEMS.filter(i=>CAT==='all'||i.cat===CAT);
      const pageCount=Math.max(1,Math.ceil(list.length/12));
      if(hit.id===0&&this.mobaShopPage>0){this.mobaShopPage--;this.playSfx('ui_click');}
      if(hit.id===1&&this.mobaShopPage<pageCount-1){this.mobaShopPage++;this.playSfx('ui_click');}
      return;
    }
    // 购买道具
    const item=MOBA_SHOP_ITEMS[hit.idx];
    if(!item)return;
    // 限购检查
    if(item.unique&&this.mobaBoughtItems[item.id]){this.playSfx('ui_back');return;}
    // 金币检查
    if((this.mobaGold||0)<item.price){this.playSfx('ui_back');return;}
    this.mobaGold-=item.price;
    if(item.unique)this.mobaBoughtItems[item.id]=true;
    // 应用道具效果到玩家
    item.apply(this.p1);
    this.addBattleLog('💰 购买了 '+item.name);
    this.spawnHitEffect(this.p1.x,this.p1.y-30,'-'+item.price,'#ffd700');
    this.playSfx('ui_confirm');
  },
  drawMinimap(ctx,x,y,w,h){
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(x,y,w,h);
    ctx.strokeStyle='#555';ctx.lineWidth=1;ctx.strokeRect(x,y,w,h);
    const sx=w/MOBA_MAP.width,sy=h/MOBA_MAP.height;
    // Lanes
    ctx.fillStyle='rgba(139,115,85,0.5)';
    for(const l of MOBA_MAP.lanes){ctx.fillRect(x,y+l.y*sy-2,w,4);}
    // River
    ctx.fillStyle='rgba(30,144,255,0.4)';ctx.fillRect(x,y+MOBA_MAP.riverY*sy-1,w,2);
    // Camera viewport rectangle
    ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;
    ctx.strokeRect(x+this.camera.x*sx,y+this.camera.y*sy,1200*sx,800*sy);
    // Towers
    const allTowers=[...this.mobaTeams.blue.towers,...this.mobaTeams.red.towers];
    for(const t of allTowers){
      if(!t.alive)continue;
      ctx.fillStyle=t.team==='blue'?'#3498db':'#e74c3c';
      ctx.fillRect(x+t.x*sx-2,y+t.y*sy-2,4,4);
    }
    // Crystals
    if(this.mobaTeams.blue.crystal.alive){ctx.fillStyle='#3498db';ctx.fillRect(x+MOBA_MAP.baseBlue.x*sx-3,y+MOBA_MAP.baseBlue.y*sy-3,6,6);}
    if(this.mobaTeams.red.crystal.alive){ctx.fillStyle='#e74c3c';ctx.fillRect(x+MOBA_MAP.baseRed.x*sx-3,y+MOBA_MAP.baseRed.y*sy-3,6,6);}
    // Fighters
    const allF=[...this.mobaTeams.blue.fighters,...this.mobaTeams.red.fighters];
    for(const f of allF){
      if(f.hp<=0)continue;
      ctx.fillStyle=f===this.p1?'#ffd700':f.team==='blue'?'#5dade2':'#ff6666';
      ctx.fillRect(x+f.x*sx-1.5,y+f.y*sy-1.5,3,3);
    }
    // Jungle monsters
    ctx.fillStyle='#f39c12';
    for(const m of this.jungleMonsters){
      if(m.hp<=0)continue;
      ctx.fillRect(x+m.x*sx-1,y+m.y*sy-1,2,2);
    }
    // Dragon
    if(this.dragon&&this.dragon.alive){
      ctx.fillStyle='#ff4400';
      ctx.beginPath();ctx.arc(x+this.dragon.x*sx,y+this.dragon.y*sy,3,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  },

  renderHUD(){

    if(!this.p1||!this.p2){hud.innerHTML='';return;}
    const fhud=(f,side)=>{const s=f;const cd1=f.getCD(f.prof.skills[0]),cd2=f.getCD(f.prof.skills[1]),cd3=f.getCD(f.prof.skills[2]);return`<div class="hud-player" style="${side==='right'?'flex-direction:row-reverse;text-align:right':''}">

      <div class="hud-cd-row">
        <span class="hud-cd-item"><span>I:</span><span class="${cd1===0?'ready':'cooling'}">${cd1===0?'就绪':cd1+'s'}</span></span>
        <span class="hud-cd-item"><span>K:</span><span class="${cd2===0?'ready':'cooling'}">${cd2===0?'就绪':cd2+'s'}</span></span>

      </div></div>
      <div class="hud-bars">
        <div class="hud-hp"><div class="hud-hp-fill" style="width:${Math.max(0,s.hp/s.maxHp*100)}%"></div><div class="hud-bar-label">❤ ${Math.round(Math.max(0,s.hp))}/${s.maxHp}</div></div>
        <div class="hud-mp"><div class="hud-mp-fill" style="width:${Math.max(0,s.mp/s.maxMp*100)}%"></div><div class="hud-bar-label">💎 ${Math.round(Math.max(0,s.mp))}/${s.maxMp}</div></div>

        const lastName=keys[0].replace('arena_save_','');
        document.getElementById('save-hint').textContent='检测到存档: '+lastName;
      }
    }catch(e){}
  },
  continueGame(){
    try{const keys=Object.keys(localStorage).filter(k=>k.startsWith('arena_save_'));
      if(keys.length===0)return;
      const name=keys[0].replace('arena_save_','');
      if(!this.loadGame(name)){this.goSelect();return;}
      document.getElementById('pname').value=this.playerName;
      if(this.playerProf)this.selectProf(this.playerProf.id);
      this.switchScreen('hub');this.updateHubStats();this.renderHub('arena');this.resetHubNav();
    }catch(e){this.goSelect();}
  },
};

// ============ AUDIO SYSTEM ============
const AudioManager = {
  ctx: null, masterGain: null, enabled: true, _lastPlayed: {}, _initDone: false,

  init() {
    // Called on first user interaction to unlock audio
    if (this._initDone) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = 0.5;
      this.masterGain.connect(this.ctx.destination);
      this._initDone = true;
    } catch(e) { console.log('Audio init failed:', e); }
  },

  _ensureContext() {
    if (!this.ctx) this.init();
    if (!this.ctx) return false;
    if (this.ctx.state === 'suspended') {
      this.ctx.resume().catch(() => {});
    }
    return true;
  },

  _osc(type, freq, duration, vol, sweepEnd) {
    if (!this._ensureContext()) return;
    const osc = this.ctx.createOscillator();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
    if (sweepEnd) osc.frequency.linearRampToValueAtTime(sweepEnd, this.ctx.currentTime + duration);
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(vol * 0.1, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(vol, this.ctx.currentTime + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
    osc.connect(gain); gain.connect(this.masterGain);
    osc.start(); osc.stop(this.ctx.currentTime + duration);
  },

  _noise(duration, lowFreq, highFreq, vol) {
    if (!this._ensureContext()) return;
    const sr = this.ctx.sampleRate;
    const len = Math.max(1, Math.floor(sr * duration));
    const buf = this.ctx.createBuffer(1, len, sr);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = (lowFreq + highFreq) / 2;
    filter.Q.value = Math.max(0.1, Math.min(10, lowFreq / Math.max(1, highFreq - lowFreq)));
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(vol * 0.1, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(vol, this.ctx.currentTime + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
    src.connect(filter); filter.connect(gain); gain.connect(this.masterGain);
    src.start(); src.stop(this.ctx.currentTime + duration);
  },

  _impact(intensity, duration) {
    this._osc('sine', 60 + intensity * 40, duration * 0.6, 0.7 * intensity, 25);
    this._noise(duration * 0.5, 60, 500, 0.5 * intensity);
    if (intensity > 0.6) this._osc('triangle', 35, duration * 0.8, 0.5, 18);
  },

  // --- Profession attack sounds ---
  _slash(heavy) {
    const d = heavy ? 0.25 : 0.18;
    this._osc('sawtooth', heavy ? 600 : 800, d, heavy ? 0.5 : 0.35, heavy ? 150 : 200);
    this._osc('square', heavy ? 2400 : 3200, d * 0.4, 0.15, 800);
    this._noise(d * 0.4, 200, 3000, heavy ? 0.35 : 0.2);
  },
  _pierce() {
    this._osc('square', 1200, 0.15, 0.35, 300);
    this._noise(0.2, 800, 4000, 0.25);
  },
  _magicWhoosh() {
    this._osc('sine', 300, 0.3, 0.4, 1400);

    this._noise(0.35, 400, 2000, 0.3);
  },
  _fistImpact() {

    } else if (fx === 'ninja') {
      // 👥 忍者 — 影分身
      if (!isImpact) {
        for (let i = 0; i < 6; i++) {
          setTimeout(() => { this._ensureContext();
            this._noise(0.06, 800, 4000, 0.2);
            this._osc('sine', 1500 + i * 200, 0.05, 0.15, 600);
          }, i * 40);
        }
      } else {
        this._noise(0.1, 400, 3000, 0.35);
        this._osc('sine', 35, 0.3, 0.4, 10);
      }
    } else if (fx === 'mecha') {
      // 🤖 机械师 — 机甲召唤
      if (!isImpact) {
        this._osc('square', 80, 0.8, 0.55, 20);
        this._osc('square', 200, 0.6, 0.35, 50);
        this._noise(0.4, 100, 3000, 0.45);
        for (let i = 0; i < 5; i++) {
          setTimeout(() => { this._ensureContext();
            this._osc('square', 400 + i * 100, 0.12, 0.25, 200);
          }, 200 + i * 120);
        }
      } else {
        this._osc('square', 60, 0.3, 0.55, 15);
        this._noise(0.15, 200, 4000, 0.4);
      }
    } else if (fx === 'time') {
      // 🌀 时空术士 — 时空裂隙
      if (!isImpact) {
        [220, 330, 440, 550, 440, 330, 220].forEach((f, i) => {
          setTimeout(() => { this._ensureContext();
            this._osc('sine', f, 0.5, 0.25, f * 0.3);
            this._osc('sine', f * 1.5, 0.4, 0.1, f * 0.5);
          }, i * 150);
        });
        // Reverse tick
        for (let i = 0; i < 5; i++) {
          setTimeout(() => { this._ensureContext();
            this._osc('sine', 3000 - i * 400, 0.03, 0.2, 1500);
          }, 600 + i * 80);
        }
      } else {
        this._osc('sine', 30, 0.5, 0.45, 10);
        this._noise(0.25, 50, 1500, 0.35);
      }
    } else if (fx === 'blade') {
      // ⚔️ 剑圣 — 剑刃风暴
      if (!isImpact) {
        for (let i = 0; i < 8; i++) {
          setTimeout(() => { this._ensureContext();
            this._osc('sawtooth', 700 - i * 60, 0.18, 0.3, 180);
            this._noise(0.06, 400, 3000, 0.15);
          }, i * 70);
        }
        setTimeout(() => { this._ensureContext();
          this._osc('sawtooth', 200, 0.3, 0.4, 50);
          this._noise(0.15, 200, 2000, 0.3);
        }, 400);
      } else {
        this._osc('sine', 22, 0.35, 0.5, 8);
        this._noise(0.15, 50, 2500, 0.4);
      }
    } else if (fx === 'arcaneArrow') {
      // ✨ 魔射手 — 奥术箭雨
      if (!isImpact) {
        for (let i = 0; i < 7; i++) {
          setTimeout(() => { this._ensureContext();
            this._osc('triangle', 500 + i * 120, 0.12, 0.2, 1000);
            this._osc('sine', 700 + i * 100, 0.1, 0.15, 1500);
            this._noise(0.04, 1200, 5000, 0.1);
          }, i * 60);
        }
      } else {
        this._osc('sine', 35, 0.35, 0.45, 10);
        this._noise(0.2, 100, 3000, 0.35);
      }
    } else {
      // Default: rising energy + burst
      if (!isImpact) {
        this._osc('sawtooth', 150, 0.6, 0.5, 400);
        this._noise(0.5, 80, 1500, 0.45);
        setTimeout(() => { this._ensureContext();
          this._osc('sine', 80, 0.4, 0.4, 30);
          this._noise(0.3, 30, 500, 0.35);
        }, 300);
      } else {
        this._osc('sine', 25, 0.5, 0.55, 8);
        this._noise(0.3, 30, 800, 0.45);
      }
    }
  },

  playSfx(type, params = {}) {
    if (!this.enabled) return;
    const now = performance.now();
    const minInt = type === 'footstep' ? 200 : 20;
    if (this._lastPlayed[type] && now - this._lastPlayed[type] < minInt) return;
    this._lastPlayed[type] = now;
    this._ensureContext();

    switch (type) {
      case 'attack': this._playAttackSound(params.fx || 'slash', false); break;
      case 'skill': this._playAttackSound(params.fx || 'slash', true); break;
      case 'projectile': this._playAttackSound(params.fx || 'magic', false); break;
      case 'hit':
        this._impact(Math.min(1, (params.dmg || 10) / 80), 0.2);
        if (params.crit) { this._osc('square', 1200, 0.08, 0.4, 600); this._noise(0.06, 3000, 8000, 0.3); }
        break;
      case 'projectile_hit':
        if (params.big) { this._impact(0.9, 0.4); this._noise(0.3, 200, 2000, 0.5); }
        else this._impact(0.4, 0.15);
        break;
      case 'ultimate': this._playUltimateSound(params.fx, params.bossStyle, false); break;
      case 'ultimate_impact': this._playUltimateSound(params.fx, params.bossStyle, true); break;
      case 'battle_start':
        [262, 330, 392].forEach((f, i) => setTimeout(() => { this._ensureContext(); this._osc('sawtooth', f, 0.4, 0.3, f * 0.5); }, i * 120));
        break;
      case 'victory':
        [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => { this._ensureContext(); this._osc('triangle', f, 0.5, 0.35, f * 0.5); }, i * 150));
        break;
      case 'defeat':
        [330, 262, 196].forEach((f, i) => setTimeout(() => { this._ensureContext(); this._osc('sawtooth', f, 0.5, 0.25, f * 0.3); }, i * 200));
        break;
      case 'jump': this._osc('sine', 300, 0.15, 0.2, 600); break;
      case 'land': this._noise(0.08, 40, 200, 0.25); break;
      case 'dodge': this._noise(0.12, 600, 3000, 0.25); this._osc('sine', 800, 0.1, 0.15, 400); break;
      case 'death': this._osc('sawtooth', 200, 0.5, 0.4, 40); this._noise(0.4, 50, 300, 0.3); break;
      case 'ui_click': this._osc('sine', 800, 0.04, 0.2, 600); break;
      case 'ui_confirm': this._osc('sine', 660, 0.06, 0.25, 880); this._osc('sine', 880, 0.06, 0.2, 660); break;
      case 'ui_purchase': this._osc('triangle', 1200, 0.08, 0.3, 1600); this._osc('triangle', 1600, 0.06, 0.2, 2000); break;
      case 'ui_upgrade':
        [523, 659, 784].forEach((f, i) => setTimeout(() => { this._ensureContext(); this._osc('sine', f, 0.1, 0.25, f * 1.2); }, i * 60));
        break;
      case 'ui_back': this._osc('sine', 440, 0.05, 0.2, 330); break;
      case 'footstep': this._noise(0.04, 60, 300, 0.12); break;
      case 'countdown': this._osc('sine', 880, 0.08, 0.3, 440); break;
      case 'go': this._osc('sine', 1047, 0.12, 0.35, 523); break;
    }
  },

  toggle() {
    this.enabled = !this.enabled;
    if (this.enabled) this.init();
    return this.enabled;
  }
};
