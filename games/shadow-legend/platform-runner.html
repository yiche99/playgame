resize();window.addEventListener('resize',resize);

const keys={};
window.addEventListener('keydown',e=>{
  // 名字输入处理
  if(gameState===STATE.MENU&&game._nameFocused){
    if(e.key==='Escape'){game._nameFocused=false;autoSave();return}
    if(e.key==='Enter'){game._nameFocused=false;autoSave();return}
    if(e.key==='Backspace'){playerName=playerName.slice(0,-1);return}
    if(e.key.length===1&&playerName.length<12){playerName+=e.key;return}
    return;
  }
  // P键暂停
  if(e.key==='p'||e.key==='P'){
    if(gameState===STATE.PLAYING){gameState=STATE.PAUSED;return}
    else if(gameState===STATE.PAUSED){gameState=STATE.PLAYING;return}
  }
  // R键重试(死亡后)
  if((e.key==='r'||e.key==='R')&&gameState===STATE.GAME_OVER){game.loadLevel(currentRegion,currentLevel);return}
  // 1-3使用道具
  if(gameState===STATE.PLAYING&&e.key>='1'&&e.key<='3'){const idx=parseInt(e.key)-1;if(game.player.items[idx]){const item=game.player.items[idx];if(item.type==='bomb'){for(const en of game.enemies){if(!en.dead&&en.type!=='boss')en.takeDamage(10);else if(!en.dead&&en.type==='boss')en.takeDamage(4)}spawnParticles(game.player.x+game.player.w/2,game.player.y+game.player.h/2,30,'#FF5722');game.showMessage('💣 炸弹!')}else if(item.type==='slowEnemies'){for(const en of game.enemies)en.slowedByPlayer=600;game.showMessage('⏳ 敌人减速!')}else{game.player._useItemIdx=idx}game.player.items.splice(idx,1);return}}
  keys[e.key.toLowerCase()]=true;keys[e.code]=true;e.preventDefault()});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;keys[e.code]=false;e.preventDefault()});

const MAX_SLOTS=3;
let currentSlot=0; // 0=未选择, 1-3=槽位
function getSlotKey(n){return `shadow_legend_slot_${n}`}
function saveSlot(n){
  const d={ur:unlockedRegion,ul:unlockedLevel,coins:coins,ow:ownedWeapons,ew:equippedWeapon,oa:ownedArmors,ea:equippedArmor,os:ownedSkins,es:equippedSkin,pn:playerName,diff:difficulty,score:highScore,ts:Date.now(),tk:totalKills,td:totalDeaths,pt:playTime+Math.floor((Date.now()-sessionStart)/1000),ac:achievements};
  localStorage.setItem(getSlotKey(n),JSON.stringify(d));
}
function loadSlot(n){
  try{
    const d=JSON.parse(localStorage.getItem(getSlotKey(n)));
    if(d){unlockedRegion=d.ur||0;unlockedLevel=d.ul||0;coins=d.coins||0;ownedWeapons=d.ow||[0];equippedWeapon=d.ew||0;ownedArmors=d.oa||[0];equippedArmor=d.ea||0;ownedSkins=d.os||[0];equippedSkin=d.es||0;playerName=d.pn||'暗影勇士';difficulty=d.diff||1;highScore=d.score||0;totalKills=d.tk||0;totalDeaths=d.td||0;playTime=d.pt||0;achievements=d.ac||{};currentSlot=n;return true}
  }catch(e){}
  return false;
}
function getSlotInfo(n){
  try{const d=JSON.parse(localStorage.getItem(getSlotKey(n)));if(d)return d}catch(e){}
  return null;
}
function deleteSlot(n){localStorage.removeItem(getSlotKey(n))}
function hasAnySave(){
  for(let i=1;i<=MAX_SLOTS;i++)if(getSlotInfo(i))return true;
  return false;
}

// 自动保存
function autoSave(){if(currentSlot>0)saveSlot(currentSlot)}

function checkAchievements(){
  let anyNew=false;
  for(const a of ACHIEVEMENTS){

}

let storyState=null; // {type, text, title, callback}
function startStory(type, regionIdx, callback){
  let text='',title='';
  if(type==='intro'){text=STORY_DATA.intro.text;title=STORY_DATA.intro.title}
  else if(type==='region'&&regionIdx<STORY_DATA.regions.length){text=STORY_DATA.regions[regionIdx].enter;title=`第${regionIdx+1}地区 · ${REGIONS[regionIdx].name}`}
  else if(type==='boss'&&regionIdx<STORY_DATA.regions.length){text=STORY_DATA.regions[regionIdx].boss;title=`Boss战 · ${BOSS_DEFS[regionIdx]?.name||'???'}`}
  else if(type==='bossDefeat'&&regionIdx<STORY_DATA.regions.length){text=STORY_DATA.regions[regionIdx].bossDefeat;title='Boss 击败!'}
  else if(type==='ending'){text=STORY_DATA.ending;title='终章'}
  text=text.replace(/\{playerName\}/g,playerName);
  storyState={text,title,type,callback,regionIdx,charIndex:0,lineIndex:0,timer:0};
  gameState=STATE.STORY;
}

// ===== 粒子 =====
class Particle{
  constructor(x,y,vx,vy,color,life=30){this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.color=color;this.life=life;this.maxLife=life;this.size=2+Math.random()*3}
  update(){this.x+=this.vx;this.y+=this.vy;this.vy+=0.1;this.life--}
  draw(ctx,cam){const a=this.life/this.maxLife;ctx.globalAlpha=a;ctx.fillStyle=this.color;ctx.fillRect(this.x-cam.x-this.size/2,this.y-cam.y-this.size/2,this.size,this.size);ctx.globalAlpha=1}
  get dead(){return this.life<=0}
}
let particles=[];
function spawnParticles(x,y,count,color){for(let i=0;i<count;i++)particles.push(new Particle(x,y,(Math.random()-0.5)*5,(Math.random()-0.5)*5-2,color,20+Math.random()*20))}

class Camera{constructor(){this.x=0;this.y=0}follow(t){this.x+=(t.x-W/2-this.x)*0.1;this.y+=(t.y-H/2-this.y)*0.1;this.x=Math.max(0,this.x)}}

class Platform{
  constructor(x,y,w,h,type='ground'){this.x=x;this.y=y;this.w=w;this.h=h;this.type=type;this.startX=x;this.startY=y;this.moveDir=1;this.moveRange=100;this.moveSpeed=1}
  update(){if(this.type==='moving'){this.x+=this.moveDir*this.moveSpeed;if(Math.abs(this.x-this.startX)>this.moveRange)this.moveDir*=-1}}
  draw(ctx,cam,region){const r=REGIONS[region],sx=this.x-cam.x,sy=this.y-cam.y;if(sx+this.w<0||sx>W)return;if(this.type==='ground'){ctx.fillStyle=r.ground;ctx.fillRect(sx,sy,this.w,this.h);ctx.fillStyle=r.color;ctx.fillRect(sx,sy,this.w,6)}else if(this.type==='brick'){ctx.fillStyle=r.ground;ctx.fillRect(sx,sy,this.w,this.h);ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.strokeRect(sx,sy,this.w,this.h);for(let bx=0;bx<this.w;bx+=16){ctx.strokeStyle='#555';ctx.beginPath();ctx.moveTo(sx+bx,sy);ctx.lineTo(sx+bx,sy+this.h);ctx.stroke()}ctx.strokeStyle='#555';ctx.beginPath();ctx.moveTo(sx,sy+this.h/2);ctx.lineTo(sx+this.w,sy+this.h/2);ctx.stroke()}else if(this.type==='moving'){ctx.fillStyle='#FFD54F';ctx.fillRect(sx,sy,this.w,this.h);ctx.fillStyle='#FFA000';ctx.fillRect(sx+2,sy+2,this.w-4,this.h-4)}}
}

class Enemy{
  constructor(x,y,type='patrol',region=0,level=0,bossDef=null){
    this.x=x;this.y=y;this.type=type;this.region=region;this.level=level;
    const ren=REGION_ENEMIES[region]||REGION_ENEMIES[0];
    if(type==='boss'&&bossDef){this.bossDef=bossDef;this.w=bossDef.w;this.h=bossDef.h}
    else if(type==='patrol'){const d=ren.patrol;this.w=d.w;this.h=d.h;this.enemyName=d.name;this.enemyColor=d.color;this.enemyColor2=d.color2}
    else if(type==='chase'){const d=ren.chase;this.w=d.w;this.h=d.h;this.enemyName=d.name;this.enemyColor=d.color;this.enemyColor2=d.color2}
    else if(type==='flying'){const d=ren.flying;this.w=d.w;this.h=d.h;this.enemyName=d.name;this.enemyColor=d.color;this.enemyColor2=d.color2}
    else{this.w=28;this.h=32;this.enemyName='怪物';this.enemyColor='#795548';this.enemyColor2='#5D4037'}
    this.vx=type==='flying'?2:1.2;this.vy=0;
    const hpBase={patrol:3,chase:4,flying:2,boss:15};this.hp=hpBase[type]||3;this.hp+=Math.floor(region*1.5)+level;
    if(type==='boss')this.hp=18+region*7+level*4;
    // 难度修正
    const dm=DIFF_MODS[difficulty];this.hp=Math.ceil(this.hp*dm.enemyHp);this.damage=type==='boss'?2:1;this.damage=Math.ceil(this.damage*dm.enemyDmg);
    this.maxHp=this.hp;this.onGround=false;this.patrolRange=80;this.startX=x;this.startY=y;
    this.facingRight=false;this.attackTimer=0;this.attackCooldown=type==='chase'?40:60;
    this.invincibleTimer=0;this.frozen=0;this.bossAttacks=[];this.bossPhase=0;this.animTimer=0;this.dead=false;this.flashTimer=0;
    this.damage=type==='boss'?2:1+Math.floor(region/3);
    this.knockbackVx=0;this.knockbackVy=0;this.jumpCooldown=0;this.jumpsLeft=1;
    this.chaseSpeed=ENEMY_SPEED*(0.9+level*0.05+region*0.03);
    this.skillTimers=[0,0,0];this.currentSkill=-1;this.skillActive=0;this.minions=[];
    this.slowedByPlayer=0;
  }
  update(player,platforms){
    if(this.dead)return;if(this.flashTimer>0)this.flashTimer--;if(this.invincibleTimer>0)this.invincibleTimer--;if(this.slowedByPlayer>0)this.slowedByPlayer--;
    const slowFactor=this.slowedByPlayer>0?0.4:1;
    if(this.frozen>0){this.frozen--;return}
    this.animTimer++;if(this.jumpCooldown>0)this.jumpCooldown--;
    if(this.knockbackVx!==0){this.x+=this.knockbackVx;this.knockbackVx*=0.85;if(Math.abs(this.knockbackVx)<0.3)this.knockbackVx=0}
    if(this.knockbackVy!==0){this.y+=this.knockbackVy;this.knockbackVy*=0.85;if(Math.abs(this.knockbackVy)<0.3)this.knockbackVy=0}
    if(this.type==='patrol'){this.vx=(this.facingRight?1:-1)*1.2*slowFactor;if(Math.abs(this.x-this.startX)>this.patrolRange)this.facingRight=!this.facingRight;if(this.onGround&&this.jumpCooldown<=0&&this.wouldFallIntoGap(platforms)){this.vy=PLAYER_JUMP*0.8;this.jumpCooldown=30;this.onGround=false}}
    else if(this.type==='chase'){const dx=player.x-this.x,dy=player.y-this.y;this.vx=(dx>0?this.chaseSpeed:-this.chaseSpeed)*slowFactor;this.facingRight=dx>0;if(this.onGround&&this.jumpCooldown<=0){const needJump=(Math.abs(dx)<60&&dy<-30)||this.wouldFallIntoGap(platforms)||(Math.abs(dx)<200&&dy<-40);if(needJump){this.vy=PLAYER_JUMP*(0.9+Math.random()*0.2);this.jumpCooldown=25+Math.random()*20;this.onGround=false}}if(this.attackTimer<=0&&Math.abs(dx)<45&&Math.abs(this.y-player.y)<45){this.attackTimer=this.attackCooldown;if(Math.abs(dx)<55)player.takeDamage(this.damage,this.x)}}
    else if(this.type==='flying'){const dx=player.x-this.x,dy=player.y-this.y;this.vx=(dx>0?this.chaseSpeed*0.7:-this.chaseSpeed*0.7)*slowFactor;this.vy=dy>0?1.2:-1.2;this.facingRight=dx>0}
    else if(this.type==='boss')this.bossAI(player,platforms);
    if(this.attackTimer>0)this.attackTimer--;
    for(let i=0;i<3;i++)if(this.skillTimers[i]>0)this.skillTimers[i]--;
    if(this.skillActive>0)this.skillActive--;
    if(this._iceShield>0){this._iceShield--;if(this._iceShield<=0){this.def=Math.max(0,(this.def||0)-3)}}
    if(this._rebornFx>0)this._rebornFx--;
    if(this.type!=='flying'){this.vy+=GRAVITY;this.y+=this.vy;this.onGround=false;for(const p of platforms){if(this.x+this.w>p.x&&this.x<p.x+p.w&&this.y+this.h>=p.y&&this.y+this.h-this.vy<=p.y+5){this.y=p.y-this.h;this.vy=0;this.onGround=true;this.jumpsLeft=1}}if(this.y>WORLD_BOTTOM){this.hp=0;this.dead=true}}
    this.x+=this.vx;
    for(const p of platforms){if(this.y+this.h>p.y&&this.y<p.y+p.h){if(this.vx>0&&this.x+this.w>p.x&&this.x<p.x){this.x=p.x-this.w;this.vx*=-1;this.facingRight=!this.facingRight}if(this.vx<0&&this.x<p.x+p.w&&this.x+this.w>p.x+p.w){this.x=p.x+p.w;this.vx*=-1;this.facingRight=!this.facingRight}}}
    this.x=Math.max(0,this.x);

class Player{

  reset(){
    this.x=this.spawnX||80;this.y=this.spawnY||380;this.w=28;this.h=40;this.vx=0;this.vy=0;this.onGround=false;this.facingRight=true;

    this.maxHp=5+(armor.hpBonus||0);this.hp=this.maxHp;this.def=armor.def||0;
    this.invincible=0;this.attackTimer=0;this.attackDuration=15;this.attackCooldown=18;
    this.items=[];this.speedBoost=0;this.invincibleBoost=0;const dm2=DIFF_MODS[difficulty];this.jumpsLeft=dm2.doubleJump?2:1;this.maxJumps=dm2.doubleJump?2:1;this.animTimer=0;this.dead=false;
    this._jumpPressed=false;this._doAttack=false;this._kPressed=false;this._useItemIdx=-1;this.knockbackVx=0;this.knockbackVy=0;
    this.powerBoost=0;this.shieldBoost=0;
    this._curseSlow=0;this._blizzardDmg=0;this._poisonFog=0;this._rootBind=0;this._inkBlind=0;
  }
  getWeapon(){return SHOP_WEAPONS[equippedWeapon]||SHOP_WEAPONS[0]}
  getSkin(){return SKINS[equippedSkin]||SKINS[0]}
  getArmor(){return ARMORS[equippedArmor]||ARMORS[0]}
  takeDamage(dmg,attackerX){
    if(this.invincible>0||this.invincibleBoost>0||this.dead)return;
    let actualDmg=Math.max(0,dmg-this.def);
    if(this.shieldBoost>0)actualDmg=Math.ceil(actualDmg*0.5);
    actualDmg=Math.max(1,actualDmg);
    this.hp-=actualDmg;this.invincible=60;
    const kbDir=attackerX!=null?(attackerX<this.x?-1:1):(this.facingRight?-1:1);this.knockbackVx=kbDir*5;this.knockbackVy=-4;
    if(this.hp<=0){this.hp=0;this.dead=true;totalDeaths++}
  }

// ===== 关卡生成（缩小间隙+增加移动平台）=====
function generateLevel(region,level){
  const platforms=[],enemies=[],pickups=[];
  const isBossLevel=(level===4);
  const levelWidth=2200+level*700+region*250;
  const groundY=600;

  // 地面平台（间隙缩小）
  let gx=0;
  while(gx<levelWidth){
    const gapChance=0.12+level*0.025+region*0.008; // 降低间隙概率
    if(Math.random()<gapChance&&gx>150&&gx<levelWidth-200){
      const gapW=30+Math.random()*50; // 间隙宽度从60~140缩小到30~80
      // 在大间隙(>55)上方生成移动平台桥接
      if(gapW>55){
        const bridgeX=gx+5,bridgeY=groundY-50-Math.random()*30;
        const bp=new Platform(bridgeX,bridgeY,gapW-10,16,'moving');
        bp.moveRange=20;bp.moveSpeed=0.4+Math.random()*0.4;
        platforms.push(bp);
      }
      gx+=gapW;
    }else{
      const segW=80+Math.random()*200; // 平台段更长
      platforms.push(new Platform(gx,groundY,segW,H-groundY,'ground'));
      gx+=segW;
    }
  }

  // 浮动平台（更多）
  const numPlatforms=14+level*5+region*3;
  for(let i=0;i<numPlatforms;i++){
    const px=80+Math.random()*(levelWidth-160),py=160+Math.random()*260,pw=45+Math.random()*110;
    const isMoving=Math.random()<0.25+level*0.04;
    const p=new Platform(px,py,pw,18,isMoving?'moving':'brick');
    if(isMoving){p.moveRange=40+Math.random()*80;p.moveSpeed=0.5+Math.random()*1}
    platforms.push(p);
  }

  // 敌人
  if(isBossLevel){const bossDef=BOSS_DEFS[region];const boss=new Enemy(levelWidth-350,groundY-bossDef.h,'boss',region,level,bossDef);enemies.push(boss)}
  else{const numEnemies=4+level*3+region*2;const enemyTypes=['patrol','patrol','patrol','chase','chase','flying'];for(let i=0;i<numEnemies;i++){const ex=250+Math.random()*(levelWidth-500),ey=groundY-32;const typeIdx=Math.floor(Math.random()*Math.min(6,2+level+Math.floor(region/2)));const type=enemyTypes[typeIdx];enemies.push(new Enemy(ex,ey,type,region,level))}}

  // 道具（种类更丰富）
  const numPickups=4+level+Math.floor(region/2);
  for(let i=0;i<numPickups;i++){const px=150+Math.random()*(levelWidth-300),py=180+Math.random()*220;const r=Math.random();if(r<0.2&&region>=2){const wi=1+Math.floor(Math.random()*Math.min(3,Math.floor(region/2)));pickups.push(new Pickup(px,py,SHOP_WEAPONS[wi],'weapon',wi))}else if(r<0.5)pickups.push(new Pickup(px,py,null,'coin'));else{const ii=Math.floor(Math.random()*ITEMS.length);pickups.push(new Pickup(px,py,ITEMS[ii],'item',ii))}}
  const flagX=levelWidth-100;
  return {platforms,enemies,pickups,levelWidth,flagX,isBossLevel,groundY};
}

  updateStory(){

  }

function handleMenuInput(){
  if(instructionScreen){if(keys['escape']){instructionScreen=false;keys['escape']=false}return}
  if(gameState===STATE.STORY){
    if(keys['enter']||keys[' ']||keys['escape']){
      keys['enter']=false;keys[' ']=false;keys['escape']=false;
      const totalChars=storyState.text.replace(/\n/g,'').length;
      if(storyState.charIndex>=totalChars){gameState=STATE.PLAYING;if(storyState.callback)storyState.callback();storyState=null}
      else storyState.charIndex=totalChars;
    }
    return;
  }
  if(gameState===STATE.MENU){if(keys['w']||keys['arrowup']){menuSelection=(menuSelection-1+4)%4;keys['w']=false;keys['arrowup']=false}if(keys['s']||keys['arrowdown']){menuSelection=(menuSelection+1)%4;keys['s']=false;keys['arrowdown']=false}if(keys['enter']){keys['enter']=false;if(menuSelection===0)game.loadLevel(0,0);else if(menuSelection===1){gameState=STATE.LEVEL_SELECT;menuSelection=0}else if(menuSelection===2){gameState=STATE.SHOP;menuSelection=0;shopTab=0}else if(menuSelection===3)instructionScreen=true}}
  else if(gameState===STATE.LEVEL_SELECT){if(keys['escape']){gameState=STATE.MENU;keys['escape']=false;menuSelection=0;return}if(keys['a']||keys['arrowleft']){if(levelSelectPage>0){levelSelectPage--;keys['a']=false;keys['arrowleft']=false}}if(keys['d']||keys['arrowright']){if((levelSelectPage+1)*4<REGIONS.length){levelSelectPage++;keys['d']=false;keys['arrowright']=false}}if(keys['w']||keys['arrowup']){menuSelection=Math.max(0,menuSelection-1);keys['w']=false;keys['arrowup']=false}if(keys['s']||keys['arrowdown']){menuSelection=Math.min(19,menuSelection+1);keys['s']=false;keys['arrowdown']=false}if(keys['enter']){keys['enter']=false;const r=Math.floor(menuSelection/5),l=menuSelection%5;if(r<REGIONS.length&&(r<unlockedRegion||(r===unlockedRegion&&l<=unlockedLevel)))game.loadLevel(r,l)}}
  else if(gameState===STATE.SHOP){if(keys['escape']){gameState=STATE.MENU;keys['escape']=false;menuSelection=0;return}if(keys['a']||keys['arrowleft']){if(shopTab>0){shopTab--;menuSelection=0;keys['a']=false;keys['arrowleft']=false}}if(keys['d']||keys['arrowright']){if(shopTab<2){shopTab++;menuSelection=0;keys['d']=false;keys['arrowright']=false}}const items=shopTab===0?SHOP_WEAPONS:shopTab===1?ARMORS:SKINS;if(keys['w']||keys['arrowup']){menuSelection=Math.max(0,menuSelection-4);keys['w']=false;keys['arrowup']=false}if(keys['s']||keys['arrowdown']){menuSelection=Math.min(items.length-1,menuSelection+4);keys['s']=false;keys['arrowdown']=false}if(keys['enter']){keys['enter']=false;const item=items[menuSelection];const ownedList=shopTab===0?ownedWeapons:shopTab===1?ownedArmors:ownedSkins;if(ownedList.includes(menuSelection)){if(shopTab===0)equippedWeapon=menuSelection;else if(shopTab===1)equippedArmor=menuSelection;else equippedSkin=menuSelection;autoSave()}else if(coins>=item.price){coins-=item.price;ownedList.push(menuSelection);if(shopTab===0)equippedWeapon=menuSelection;else if(shopTab===1)equippedArmor=menuSelection;else equippedSkin=menuSelection;autoSave()}}}
  else if(gameState===STATE.GAME_OVER){if(keys['enter']){keys['enter']=false;game.loadLevel(currentRegion,currentLevel)}if(keys['escape']){keys['escape']=false;gameState=STATE.MENU;menuSelection=0}}
  else if(gameState===STATE.WIN){if(keys['escape']){keys['escape']=false;gameState=STATE.MENU;menuSelection=0;score=0}}
  if(gameState===STATE.PLAYING&&keys['escape']){gameState=STATE.PAUSED;keys['escape']=false}else if(gameState===STATE.PAUSED&&keys['escape']){gameState=STATE.PLAYING;keys['escape']=false}
}

function gameLoop(){
  handleMenuInput();
  if(gameState===STATE.STORY){game.updateStory();game.drawStory()}
  else if(gameState===STATE.PLAYING)game.update();
  if(gameState===STATE.MENU)game.drawMenu();
  else if(gameState===STATE.LEVEL_SELECT)game.drawLevelSelect();
  else if(gameState===STATE.SHOP)game.drawShop();
  else if(gameState===STATE.SAVE_MANAGE)game.drawSaveManage();
  else if(instructionScreen)game.drawInstructions();
  else if(gameState===STATE.PLAYING||gameState===STATE.PAUSED){game.draw();if(gameState===STATE.PAUSED)game.drawPause()}
  else if(gameState===STATE.GAME_OVER){game.draw();game.drawGameOver()}
  else if(gameState===STATE.WIN){game.draw();game.drawWin()}
  requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
